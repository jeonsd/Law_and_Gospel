<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="author" content="전승대 선교사">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복음의 배경으로서의 율법</title>
<style>
  :root { --bg:#FAF8F3; --ink:#1F2A24; --mute:#5E6B63; --acc:#2E7D4F; --hl:#AEDDBF; --bar:#1F3A2B; --fs:22px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); line-height:1.95; word-break:keep-all; padding-bottom:84px; }
  .wrap { max-width:760px; margin:0 auto; padding:26px 20px 0; }
  header h1 { font-size:30px; font-weight:900; line-height:1.4; letter-spacing:-0.01em; }
  header .meta { color:var(--mute); font-size:16px; margin:6px 0 4px; }
  header .rule { height:4px; width:64px; background:var(--acc); border-radius:4px; margin:14px 0 22px; }
  #resume { display:none; background:#EAF3EC; border:2px solid #BFD9C7; border-radius:14px; padding:12px 16px; margin-bottom:18px; font-size:17px; }
  #text p { font-size:var(--fs); margin-bottom:1.1em; }
  #text h2.hd { font-size:calc(var(--fs) + 4px); font-weight:900; margin:1.6em 0 .6em; color:var(--acc); line-height:1.5; }
  .seg { cursor:pointer; border-radius:8px; padding:1px 3px; -webkit-box-decoration-break:clone; box-decoration-break:clone; scroll-margin-top:24px; transition:background .2s; }
  .seg.on { background:var(--hl); box-shadow:0 0 0 3px var(--hl); }
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--bar); color:#fff; padding:0 12px calc(6px + env(safe-area-inset-bottom,0px)); box-shadow:0 -4px 18px rgba(0,0,0,.25); z-index:50; }
  .prog { height:10px; background:rgba(255,255,255,.22); cursor:pointer; overflow:hidden; margin:0 -12px 6px; }
  .prog i { display:block; height:100%; width:0; background:#8fe0a8; }
  .bar .in { max-width:900px; margin:0 auto; display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; }
  .tm { font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap; padding:0 6px; opacity:.95; }
  button { font:inherit; font-weight:900; font-size:16px; border:0; border-radius:12px; padding:0 12px; height:44px; min-width:44px; background:rgba(255,255,255,.16); color:#fff; cursor:pointer; }
  button:active { transform:scale(.96); }
  button:focus-visible { outline:3px solid #FFE680; outline-offset:2px; }
  #play { background:#3FAE6A; font-size:18px; min-width:100px; }
  button.o { font-size:14px; min-width:40px; padding:0 10px; background:rgba(255,255,255,.1); }
  #tolist { display:none; font-size:16px; color:var(--mute); text-decoration:none; font-weight:700; margin-bottom:6px; }
  #nvnote { display:none; background:#FFF3DC; color:#1F2A24; border:2px solid #F0D49A; border-radius:14px; padding:10px 14px; margin:8px 0; font-size:17px; line-height:1.6; text-align:center; }
  #nvnote button { background:var(--acc); color:#fff; padding:0 18px; margin-left:8px; font-size:17px; }
  .nvcard { display:none; margin:34px 0 10px; background:#fff; border:2px solid #DCE6DF; border-radius:16px; padding:18px 20px; }
  .nvcard .lb { color:var(--mute); font-size:16px; }
  .nvcard .nm { font-size:calc(var(--fs) + 2px); font-weight:900; margin:4px 0 14px; line-height:1.5; }
  .nvcard a.go { display:inline-block; background:var(--acc); color:#fff; text-decoration:none; font-weight:900; font-size:19px; border-radius:14px; padding:12px 22px; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(63,174,106,.75); } 50% { box-shadow:0 0 0 10px rgba(63,174,106,0); } }
  #play.wait { animation:pulse 1.2s infinite; }
  #resume button { background:var(--acc); color:#fff; height:auto; padding:8px 14px; margin-left:8px; font-size:16px; }
  @media (max-width:640px) { header h1 { font-size:25px; } button { height:42px; padding:0 9px; } #play { min-width:84px; } }
  @media print { .bar { display:none; } body { padding-bottom:0; } }
  header .by { color:var(--mute); font-size:17px; font-weight:700; margin:2px 0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a id="tolist" href="#">← 목록으로</a>
    <h1 id="ttl">복음의 배경으로서의 율법</h1>
    <div class="meta" id="meta"></div>
    <div class="by">제작: 전승대 선교사</div>
    <div class="rule"></div>
  </header>
  <div id="resume"></div>
  <main id="text"></main>
  <div class="nvcard" id="nvcard"><div class="lb">다음 글</div><div class="nm" id="nvname"></div><a class="go" id="nvgo" href="#">다음 글 열기 ▶</a></div>
</div>

<div class="bar">
  <div id="nvnote"></div>
  <div class="prog" id="prog" aria-label="재생 위치"><i id="fill"></i></div>
  <div class="in">
    <button id="pt" class="o" aria-label="앞 글">앞 글</button>
    <button id="prev" aria-label="앞 문장" title="앞 문장">⏮</button>
    <button id="back" aria-label="10초 뒤로" title="10초 뒤로">↺10</button>
    <button id="play" aria-label="재생">▶ 재생</button>
    <button id="fwd" aria-label="10초 앞으로" title="10초 앞으로">10↻</button>
    <button id="next" aria-label="다음 문장" title="다음 문장">⏭</button>
    <button id="nt" class="o" aria-label="다음 글">다음 글</button>
    <span class="tm"><span id="cur">0:00</span> / <span id="tot">0:00</span></span>
    <button id="spd" class="o" aria-label="재생 속도">1.0x</button>
    <button id="fsm" class="o" aria-label="글자 줄이기">가-</button>
    <button id="fbg" class="o" aria-label="글자 키우기">가+</button>
    <button id="fs" class="o" aria-label="전체 화면" title="전체 화면 (F 키)">⛶ 전체</button>
  </div>
</div>

<script>
(function () {
  const TITLE = "복음의 배경으로서의 율법", TRACKS = [{"title":"들어가며","audio":"book_2611261521_1.mp3","start":0,"end":196.752,"dur":196.8,"segs":[{"t":"#레위기를 읽다가 멈추는 이유","s":0,"e":2.702,"p":true,"h":false},{"t":"성경을 처음부터 읽어 가던 분들이 가장 많이 멈추는 곳이 레위기입니다.","s":3.624,"e":8.42,"p":false,"h":false},{"t":"제사의 이름은 낯설고, 규례는 끝없이 이어지고, 왜 이런 것을 하라시는지 이유가 보이지 않기 때문입니다.","s":9.048,"e":16.769,"p":false,"h":false},{"t":"여기에 \"구약은 율법을 지켜서 구원받는 시대, 신약은 믿음으로 구원받는 시대\"라는 오해까지 겹치면 레위기는 오늘의 나와 상관없는 옛 규칙집처럼 느껴집니다.","s":17.448,"e":28.532,"p":true,"h":false},{"t":"#이 책을 쓴 까닭","s":29.4,"e":31.412,"p":true,"h":false},{"t":"그런데 성경의 순서를 따라가 보면 전혀 다른 그림이 나옵니다.","s":32.304,"e":36.498,"p":false,"h":false},{"t":"구약에도 복음이 있었습니다.","s":36.792,"e":38.807,"p":false,"h":false},{"t":"레위기의 제사와 정결법과 성막은 바로 그 복음의 배경입니다.","s":39.432,"e":43.811,"p":false,"h":false},{"t":"어두운 배경 위에서 빛이 더 선명하게 보이듯, 율법을 알면 복음이 얼마나 큰 은혜인지 훨씬 분명하게 보입니다.","s":44.352,"e":52.162,"p":true,"h":false},{"t":"이 책은 그 생각에서 출발했습니다.","s":53.04,"e":55.682,"p":false,"h":false},{"t":"율법을 복음의 배경으로 보면 복음의 은혜성이 더욱 선명하게 드러난다는 것입니다.","s":56.28,"e":61.823,"p":false,"h":false},{"t":"그래서 책의 제목이 「복음의 배경으로서의 율법」입니다.","s":62.472,"e":66.114,"p":false,"h":false},{"t":"쓰는 동안 저는 이 길이 복음의 은혜를 밝혀 줄 뿐 아니라 율법 자체를 이해하는 데도 도움이 된다는 것을 확인했습니다.","s":66.672,"e":74.168,"p":false,"h":false},{"t":"복음이라는 빛 아래서 읽으면 낯설기만 하던 규례들이 흩어진 규칙이 아니라 하나의 이야기로 이어지기 때문입니다.","s":74.784,"e":82.001,"p":false,"h":false},{"t":"이 책을 읽는 분들도 같은 것을 경험하시기를 바랍니다.","s":82.584,"e":86.364,"p":true,"h":false},{"t":"#이 책이 걸어가는 길","s":87.24,"e":89.408,"p":true,"h":false},{"t":"이 책은 레위기 전체를 꿰뚫는 질문 하나를 붙들고 갑니다.","s":90.312,"e":94.371,"p":true,"h":false},{"t":"\"거룩하신 하나님과 죄 많은 백성이 어떻게 함께 살 수 있는가?\"","s":95.232,"e":99.531,"p":true,"h":false},{"t":"먼저 구원이 처음부터 은혜였음을 확인하고(1장), 율법이 보여 주는 거룩하신 하나님(2장)과 정결과 부정의 문제를 안고 선 사람의 모습(3장), 하나님이 먼저 마련해 주신 제사의 길(4장), 그리고 아무도 스스로 통과할 수 없는 율법의 기준(5장)을 차례로 봅니다.","s":100.392,"e":123.032,"p":false,"h":false},{"t":"이것이 율법이 해 주는 진단입니다.","s":123.648,"e":126.156,"p":false,"h":false},{"t":"그 진단의 끝에서 그림자가 가리키던 실체, 곧 그리스도를 만납니다(6장).","s":126.768,"e":133.211,"p":false,"h":false},{"t":"이것이 복음이라는 처방입니다.","s":133.776,"e":135.945,"p":true,"h":false},{"t":"#이 책을 읽는 방법","s":136.512,"e":138.567,"p":true,"h":false},{"t":"각 장은 본문, 낯선 용어 풀이, 한 줄 요약, 함께 나눠 볼 질문, 짧은 목회자 노트로 이루어져 있습니다.","s":139.176,"e":148.133,"p":false,"h":false},{"t":"본문은 처음 읽는 분도 이해할 수 있도록 쓰려 했고, 낯선 말은 처음 나올 때 풀어 썼습니다.","s":148.776,"e":155.063,"p":false,"h":false},{"t":"목회자 노트에는 본문의 신학적 근거와 가르칠 때 주의할 점을 담았습니다.","s":155.688,"e":160.498,"p":false,"h":false},{"t":"이 책은 개혁신학의 은혜언약 이해를 따라 썼습니다.","s":161.136,"e":164.72,"p":false,"h":false},{"t":"성도님들은 본문과 나눔 질문을 중심으로 읽으시고, 목회자와 교사는 노트를 가르칠 때의 뼈대로 삼아 주십시오.","s":165.336,"e":173.033,"p":false,"h":false},{"t":"장마다 한 번에 읽을 수 있는 분량이니, 한 장씩 천천히 읽고 질문을 두고 이야기를 나누시기를 권합니다.","s":173.568,"e":180.574,"p":true,"h":false},{"t":"그리고 마지막 장에서는 이 복음이 성도의 삶을 어떻게 바꾸는지까지 살펴봅니다.","s":181.368,"e":187.023,"p":false,"h":false},{"t":"이 책을 덮을 때 레위기를 다시 펴고 싶은 마음과, 은혜로 구원하신 하나님을 더 즐거워하는 마음이 남기를 바랍니다.","s":187.656,"e":195.865,"p":true,"h":false}]},{"title":"1장. 구약에도 복음이 있었습니다","audio":"book_2611261521_1.mp3","start":196.752,"end":995.52,"dur":798.8,"segs":[{"t":"1장.","s":196.752,"e":197.435,"p":false,"h":false},{"t":"구약에도 복음이 있었습니다","s":198.624,"e":200.639,"p":true,"h":false},{"t":"#흔한 오해 하나","s":201.528,"e":203.258,"p":true,"h":false},{"t":"많은 분들이 성경을 이렇게 이해하고 계십니다.","s":204.12,"e":207.088,"p":true,"h":false},{"t":"\"구약 시대 사람들은 율법을 지켜서 구원을 얻으려 했고, 신약 시대 사람들은 예수님을 믿어서 구원을 얻는다.\"","s":207.96,"e":215.401,"p":true,"h":false},{"t":"얼핏 그럴듯하게 들립니다.","s":216.264,"e":218.323,"p":false,"h":false},{"t":"하지만 이렇게 이해하면 구약의 하나님은 까다로운 시험관처럼 보이고, 신약의 하나님은 갑자기 마음을 바꾸신 분처럼 보입니다.","s":218.928,"e":227.308,"p":false,"h":false},{"t":"레위기를 읽을 때마다 \"이걸 다 지켜야 구원받았다니, 얼마나 힘들었을까\" 하는 부담이 앞서기도 합니다.","s":227.952,"e":235.045,"p":true,"h":false},{"t":"그런데 성경의 순서를 차근차근 따라가 보면 전혀 다른 그림이 나옵니다.","s":235.944,"e":240.729,"p":true,"h":false},{"t":"순서를 보면 답이 보입니다","s":241.584,"e":243.689,"p":true,"h":false},{"t":"이스라엘 백성은 애굽에서 400년 넘게 종살이를 했습니다.","s":244.464,"e":248.697,"p":false,"h":false},{"t":"벽돌을 굽고, 채찍을 맞고, 아이들이 죽임을 당하는 세월이었습니다.","s":249.36,"e":254.534,"p":false,"h":false},{"t":"그들이 한 일이라고는 부르짖는 것뿐이었습니다.","s":255.144,"e":258.272,"p":false,"h":false},{"t":"하나님은 그 부르짖음을 들으시고 열 가지 재앙과 홍해의 기적으로 그들을 건져 내셨습니다(출 1~14장).","s":258.768,"e":266.896,"p":true,"h":false},{"t":"여기서 눈여겨볼 것이 있습니다.","s":267.672,"e":269.841,"p":false,"h":false},{"t":"이스라엘은 율법을 지켜서 애굽에서 나온 것이 아닙니다.","s":270.384,"e":274.167,"p":false,"h":false},{"t":"아직 율법이 주어지지도 않았습니다.","s":274.824,"e":277.27,"p":false,"h":false},{"t":"하나님이 일방적으로 건져 주셨습니다.","s":277.92,"e":280.489,"p":true,"h":false},{"t":"그리고 석 달쯤 지나 시내산에 도착했을 때 비로소 율법이 주어집니다(출 19~20장).","s":281.04,"e":288.395,"p":false,"h":false},{"t":"그것도 이렇게 시작합니다.","s":288.744,"e":290.793,"p":true,"h":false},{"t":"\"나는 너를 애굽 땅, 종 되었던 집에서 인도하여 낸 네 하나님 여호와니라\"(출 20:2)","s":291.36,"e":298.619,"p":true,"h":false},{"t":"\"이것을 지키면 내가 너를 구원해 주겠다\"가 아닙니다.","s":299.328,"e":303.455,"p":false,"h":false},{"t":"\"내가 이미 너를 구원했다.","s":304.056,"e":305.988,"p":false,"h":false},{"t":"그러니 이제 내 백성으로 이렇게 살아라\"입니다.","s":306.552,"e":309.829,"p":false,"h":false},{"t":"구원이 먼저이고, 율법은 그다음입니다.","s":310.44,"e":313.82,"p":true,"h":false},{"t":"#결혼식 날의 반지와 집안 규칙","s":314.688,"e":317.772,"p":true,"h":false},{"t":"이 순서는 이렇게 생각해 보면 쉽습니다.","s":318.576,"e":321.422,"p":true,"h":false},{"t":"한 신랑이 결혼식 날 신부에게 반지를 끼워 주었습니다.","s":322.296,"e":325.97,"p":false,"h":false},{"t":"그 순간 신부는 신랑의 아내가 되었습니다.","s":326.568,"e":329.564,"p":false,"h":false},{"t":"그날 저녁 신랑이 말합니다.","s":330.192,"e":332.259,"p":false,"h":false},{"t":"\"이제 우리가 함께 살 집의 규칙을 정하자.","s":332.928,"e":335.85,"p":false,"h":false},{"t":"식사는 같이 하고, 늦으면 연락하고, 서로 거짓말하지 말자.\"","s":336.504,"e":341.586,"p":true,"h":false},{"t":"이 규칙은 \"다 지켜야 아내로 인정해 주겠다\"는 조건이 아닙니다.","s":342.48,"e":347.048,"p":false,"h":false},{"t":"이미 아내가 된 사람과 잘 살아가기 위한 약속입니다.","s":347.688,"e":351.422,"p":false,"h":false},{"t":"규칙을 어기면 신랑은 마음이 아프겠지만, 그것으로 결혼이 무효가 되지는 않습니다.","s":352.056,"e":357.886,"p":false,"h":false},{"t":"다만 신부가 신랑을 사랑할수록 그 어긋남이 마음에 걸리고, 화해의 자리를 간절히 찾게 됩니다.","s":358.512,"e":365.173,"p":false,"h":false},{"t":"물론 언약을 어긴다고 해서 하나님의 은혜가 무의미해지는 것은 아니지만, 하나님은 언약을 배반한 백성을 징계하시기도 하셨습니다.","s":365.832,"e":373.938,"p":false,"h":false},{"t":"그 징계 역시 자기 백성을 버리지 않으시는 하나님의 언약적 사랑 안에 있었습니다.","s":374.568,"e":379.828,"p":true,"h":false},{"t":"시내산의 율법도 그랬습니다.","s":380.736,"e":382.904,"p":false,"h":false},{"t":"하나님은 이미 이스라엘을 \"내 백성\"이라 부르셨고(출 19:5-6), 그 위에서 함께 살아가는 법을 알려 주셨습니다.","s":383.568,"e":392.796,"p":false,"h":false},{"t":"그리고 제사는 바로 그 \"화해의 자리\"였습니다.","s":393.408,"e":396.691,"p":true,"h":false},{"t":"구약 성도도 같은 길로 구원받았습니다","s":397.56,"e":400.293,"p":true,"h":false},{"t":"그렇다면 구약 시대 사람들은 어떻게 구원받았을까요?","s":401.16,"e":404.89,"p":false,"h":false},{"t":"신약 성도와 다른 방법이었을까요?","s":405.552,"e":408.004,"p":false,"h":false},{"t":"성경은 그렇지 않다고 말합니다.","s":408.672,"e":410.977,"p":false,"h":false},{"t":"구원의 방법은 처음부터 하나였습니다.","s":411.6,"e":414.324,"p":true,"h":false},{"t":"• 아브라함: \"아브라함이 여호와를 믿으매 여호와께서 이를 그의 의로 여기시고\"(창 15:6).","s":415.224,"e":422.319,"p":false,"h":false},{"t":"율법이 주어지기 430년 전의 일입니다.","s":422.928,"e":426.207,"p":false,"h":false},{"t":"바울은 이것을 믿음으로 의롭다 하심의 모범으로 삼았습니다(롬 4장, 갈 3:17).","s":426.816,"e":434.634,"p":true,"h":false},{"t":"• 다윗: 율법 아래 살던 다윗이 \"허물의 사함을 받고 자신의 죄가 가려진 자는 복이 있도다\"(시 32:1)라고 노래했을 때, 바울은 이를 \"행위와 상관없이 하나님께 의로 인정받는 사람의 복\"이라 풀었습니다(롬 4:6-8).","s":435.336,"e":455.291,"p":true,"h":false},{"t":"• 믿음의 선진들: 히브리서 11장은 아벨부터 이어지는 사람들이 모두 믿음으로 살았다고 증언합니다.","s":455.856,"e":462.895,"p":true,"h":false},{"t":"구약 성도도, 신약 성도도 자기 행위가 아니라 하나님이 베푸시는 은혜의 약속을 믿어 구원받았습니다.","s":463.776,"e":470.36,"p":false,"h":false},{"t":"달라진 것은 구원의 방법이 아니라, 그 약속이 얼마나 밝게 드러났느냐입니다.","s":471,"e":476.562,"p":true,"h":false},{"t":"#새벽빛처럼 밝아진 약속.","s":477.456,"e":480.028,"p":true,"h":false},{"t":"그 약속은 언제부터 있었을까요?","s":480.792,"e":483.165,"p":false,"h":false},{"t":"사람이 죄에 빠진 바로 그 현장에서 시작됩니다.","s":483.792,"e":487.247,"p":false,"h":false},{"t":"아담과 하와가 타락했을 때 하나님은 뱀에게 이렇게 말씀하셨습니다.","s":487.512,"e":492.102,"p":false,"h":false},{"t":"\"여자의 후손은 네 머리를 상하게 할 것이요\"(창 3:15).","s":492.744,"e":497.741,"p":false,"h":false},{"t":"구원자가 오시리라는 최초의 약속입니다.","s":498.336,"e":501.28,"p":false,"h":false},{"t":"이름도 얼굴도 없이, 방향만 일러 주는 말씀이었습니다.","s":501.912,"e":506.251,"p":true,"h":false},{"t":"그 뒤로 약속은 점점 구체적이 됩니다.","s":507.144,"e":510.115,"p":true,"h":false},{"t":"• 아브라함에게는 \"네 씨로 말미암아 천하 만민이 복을 얻으리라\"(창 22:18)는 약속으로","s":510.936,"e":518.495,"p":true,"h":false},{"t":"• 모세와 제사제도를 통해서는 죄인을 대신하는 제물과 중보의 그림으로","s":519.384,"e":524.001,"p":true,"h":false},{"t":"• 다윗에게는 영원한 왕권을 가진 후손의 약속으로(삼하 7장)","s":524.904,"e":529.476,"p":true,"h":false},{"t":"• 이사야 같은 선지자들에게는 어린 양처럼 우리 죄를 지고 끌려가는 고난받는 종의 모습으로(사 53장)","s":530.28,"e":537.794,"p":true,"h":false},{"t":"새벽을 떠올려 보십시오.","s":538.464,"e":540.254,"p":false,"h":false},{"t":"처음에는 동녘이 어슴푸레하다가 차츰 환해지고, 마침내 해가 떠오릅니다.","s":540.744,"e":546.107,"p":false,"h":false},{"t":"구약 성도들은 그 새벽빛을 바라보며 해가 뜨기를 기다린 사람들이었습니다.","s":546.696,"e":551.695,"p":false,"h":false},{"t":"이를 점진계시, 곧 하나님이 구원의 계획을 한꺼번에가 아니라 조금씩 밝히셨다고 부릅니다.","s":552.336,"e":559.048,"p":false,"h":false},{"t":"구약 성도들은 \"예수\"라는 이름과 십자가의 세부까지 알지는 못했습니다.","s":559.68,"e":564.699,"p":false,"h":false},{"t":"그러나 하나님이 구원을 마련하신다는 약속을 믿었고, 그 믿음이 그들을 구원했습니다.","s":565.344,"e":571.173,"p":false,"h":false},{"t":"그들은 희미하게 보았고, 우리는 환하게 봅니다.","s":571.8,"e":575.37,"p":true,"h":false},{"t":"#경건한 사람들에게 율법과 제사는 무엇이었나","s":576.216,"e":580.046,"p":true,"h":false},{"t":"성경은 율법을 진심으로 사랑한 사람들을 보여 줍니다.","s":580.944,"e":584.549,"p":false,"h":false},{"t":"시편 119편은 \"내가 주의 법을 어찌 그리 사랑하는지요\"(97절), \"주의 말씀이 내게 꿀보다 더 다니이다\"(103절)라고 노래합니다.","s":585.144,"e":597.522,"p":false,"h":false},{"t":"이들에게 율법은 무거운 짐이 아니라 구원하신 하나님을 알아 가는 기쁨이었습니다.","s":598.152,"e":603.36,"p":true,"h":false},{"t":"그런데 율법에 진지할수록 이들은 한 가지를 깨달았습니다.","s":604.272,"e":608.368,"p":false,"h":false},{"t":"자기 힘으로는 그 기준 앞에 설 수 없다는 사실입니다.","s":609.048,"e":612.716,"p":false,"h":false},{"t":"\"누가 자기 허물을 능히 깨닫겠습니까\"(시 19:12), \"여호와여 주께서 죄악을 살피신다면 주여 누가 서리이까\"(시 130:3).","s":613.344,"e":623.553,"p":false,"h":false},{"t":"그래서 이들에게 용서는 절실한 갈급함이었고, 제사는 간절히 기다려지는 은혜의 자리였습니다.","s":624.072,"e":630.724,"p":false,"h":false},{"t":"죄를 숨기던 다윗의 고통과 용서받은 기쁨(시 32편), 하나님의 성전을 사모하다 쇠약해진다는 고백(시 84편)이 그 증거입니다.","s":631.344,"e":643.066,"p":true,"h":false},{"t":"또 이들은 짐승의 피 자체에 죄를 없앨 힘이 없다는 것을 알았습니다.","s":643.944,"e":648.468,"p":false,"h":false},{"t":"\"주께서는 제사를 기뻐하지 아니하시나니 ...","s":649.08,"e":651.876,"p":false,"h":false},{"t":"하나님의 제사는 상한 심령이라\"(시 51:16-17).","s":652.488,"e":657.796,"p":false,"h":false},{"t":"선지자들도 마음 없는 제사를 거듭 책망했습니다(사 1:11-17, 호 6:6).","s":658.296,"e":666.39,"p":false,"h":false},{"t":"그러니 이들은 제사 앞에서 이렇게 물었을 것입니다.","s":666.936,"e":670.453,"p":false,"h":false},{"t":"\"이 짐승의 죽음은 무엇을 가리키는가?","s":670.752,"e":673.375,"p":false,"h":false},{"t":"하나님은 이 일을 어떻게 온전히 이루실까?\"","s":674.016,"e":676.87,"p":false,"h":false},{"t":"아브라함이 모리아산에서 \"하나님이 번제할 어린 양을 친히 준비하시리라\"(창 22:8)고 말했던 그 기대가 경건한 사람들의 마음에 이어지고 있었습니다.","s":677.496,"e":688.603,"p":true,"h":false},{"t":"이 기다림이 어떻게 응답받았는지는 6장에서 보게 됩니다.","s":689.496,"e":693.59,"p":true,"h":false},{"t":"그렇다면 율법은 왜 필요했을까요","s":694.488,"e":697.089,"p":true,"h":false},{"t":"구원이 은혜로 이미 주어졌다면, 율법은 왜 필요했을까요?","s":697.872,"e":702.089,"p":false,"h":false},{"t":"율법에는 적어도 두 가지 역할이 있었습니다.","s":702.696,"e":705.803,"p":true,"h":false},{"t":"하나는 구원받은 백성이 거룩하신 하나님을 어떻게 섬기며 살아야 하는지 알려 주는 안내였습니다.","s":706.656,"e":712.861,"p":false,"h":false},{"t":"다른 하나는 하나님이 얼마나 거룩하신 분인지, 사람이 그 앞에 서기가 얼마나 어려운지를 비춰 주는 거울이었습니다.","s":713.472,"e":721.028,"p":false,"h":false},{"t":"이 거울의 역할은 2장에서 5장에 걸쳐 차근차근 살펴보겠습니다.","s":721.608,"e":726.207,"p":true,"h":false},{"t":"지금은 한 가지만 기억하시면 됩니다.","s":727.104,"e":729.802,"p":false,"h":false},{"t":"율법은 \"구원받기 위해 올라가야 하는 사다리\"가 아니라 \"이미 구원하신 하나님을 알아 가는 길잡이\"였습니다.","s":730.344,"e":737.44,"p":false,"h":false},{"t":"그리고 그 길잡이가 가리키는 끝에 복음이 있습니다.","s":738.12,"e":741.652,"p":false,"h":false},{"t":"구약에도 복음이 있었던 것입니다.","s":742.2,"e":744.519,"p":true,"h":false},{"t":"#낯선 용어 풀이","s":745.056,"e":746.864,"p":true,"h":false},{"t":"• 출애굽: 이스라엘 백성이 애굽(이집트)의 종살이에서 하나님의 능력으로 건져 내어진 사건.","s":747.696,"e":755.828,"p":false,"h":false},{"t":"구약 구원의 대표적인 모형입니다.","s":756.216,"e":758.608,"p":true,"h":false},{"t":"• 시내산: 출애굽 후 이스라엘이 도착하여 하나님께 율법을 받은 산입니다.","s":759.48,"e":765.185,"p":true,"h":false},{"t":"• 율법: 하나님이 이스라엘에게 주신 가르침과 규례 전체.","s":766.056,"e":770.526,"p":false,"h":false},{"t":"십계명, 제사 규례, 정결 규례, 생활 규례 등이 포함됩니다.","s":770.952,"e":777.03,"p":true,"h":false},{"t":"• 점진계시: 하나님이 구원의 계획을 한꺼번에 보이지 않으시고 시대를 따라 조금씩 더 밝히신 것을 말합니다.","s":777.912,"e":785.835,"p":true,"h":false},{"t":"• 예표: 장차 올 실체를 미리 보여 주는 그림자 같은 사건이나 제도를 말합니다.","s":786.648,"e":792.265,"p":true,"h":false},{"t":"한 줄 요약","s":793.152,"e":794.115,"p":true,"h":false},{"t":"구원은 처음부터 은혜였고, 구약 성도도 약속을 믿어 구원받았습니다.","s":795.024,"e":800.304,"p":true,"h":false},{"t":"#함께 나눠 볼 질문","s":801.192,"e":803.242,"p":true,"h":false},{"t":"1.","s":804.024,"e":804.559,"p":false,"h":false},{"t":"나는 구약의 하나님을 \"까다롭게 요구하시는 분\"으로만 생각해 오지는 않았는가?","s":805.896,"e":810.978,"p":true,"h":false},{"t":"2.","s":811.848,"e":812.133,"p":false,"h":false},{"t":"새벽빛을 바라보며 기다린 구약 성도와, 해가 떠오른 뒤를 사는 나는 무엇이 다른가?","s":812.448,"e":817.986,"p":true,"h":false},{"t":"3.","s":818.856,"e":819.445,"p":false,"h":false},{"t":"구원받기 위한 조건과 구원받은 뒤에 주어지는 삶의 규칙은 내 신앙에서 어떻게 구분되고 있는가?","s":820.728,"e":827.025,"p":true,"h":false},{"t":"#목회자 노트 (1장)","s":827.88,"e":830.558,"p":true,"h":false},{"t":"이 구조는 개혁신학의 은혜언약 이해를 따른 것입니다.","s":831.408,"e":835.004,"p":true,"h":false},{"t":"1.","s":835.872,"e":836.407,"p":false,"h":false},{"t":"가르칠 때의 뼈대","s":837.744,"e":839.279,"p":true,"h":false},{"t":"\"구원이 먼저, 율법이 그다음\"이라는 순서가 이 장의 핵심 구조입니다.","s":840.096,"e":845.501,"p":false,"h":false},{"t":"출애굽(구속)이 시내산(율법 수여)에 앞서고, 십계명 서문(출 20:2)이 그 순서를 선언합니다.","s":846.12,"e":858.719,"p":false,"h":false},{"t":"율법을 은혜언약의 틀 안에서 읽게 하는 출발점입니다.","s":859.368,"e":862.991,"p":true,"h":false},{"t":"2.","s":863.88,"e":864.165,"p":false,"h":false},{"t":"구약과 신약의 구원은 하나","s":864.48,"e":866.536,"p":true,"h":false},{"t":"구원의 방법은 하나이고, 달라진 것은 시행 방식과 계시의 밝기입니다.","s":867.384,"e":872.618,"p":false,"h":false},{"t":"웨스트민스터 신앙고백서 7장은 하나의 은혜언약이 율법 시대와 복음 시대에 달리 시행되었다고 정리하고, 8장은 구약 성도도 오실 메시아를 믿어 구원받았다고 말합니다.","s":873.24,"e":884.872,"p":false,"h":false},{"t":"성경적 근거는 창 15:6, 롬 4장, 갈 3:17, 히 11장, 요 8:56입니다.","s":885.48,"e":896.813,"p":true,"h":false},{"t":"3.","s":897.72,"e":898.309,"p":false,"h":false},{"t":"점진계시의 흐름","s":899.592,"e":901.124,"p":true,"h":false},{"t":"창 3:15(원시복음) → 아브라함 언약(창 12, 15, 22장) → 모세 언약과 제사제도 → 다윗 언약(삼하 7장) → 선지자들(사 53장 등) → 그리스도.","s":901.968,"e":919.843,"p":false,"h":false},{"t":"이 흐름을 한 장의 도표로 만들어 두면 교육 자료로 쓰기 좋습니다.","s":920.424,"e":924.832,"p":true,"h":false},{"t":"4.","s":925.704,"e":926.25,"p":false,"h":false},{"t":"구약 성도의 인식 정도에 대한 균형","s":927.576,"e":930.066,"p":true,"h":false},{"t":"• 분명히 알았던 것: 짐승의 피 자체에 죄를 없앨 힘이 없다는 점(시 40:6, 50:8-15, 51:16-17, 사 1:11-17)","s":930.888,"e":944.835,"p":true,"h":false},{"t":"• 희미하게 알았던 것: 제사가 더 큰 구원을 가리킨다는 점(창 22:8, 사 53장)","s":945.504,"e":953.732,"p":true,"h":false},{"t":"• 알지 못했던 것: 그리스도의 이름과 십자가의 구체적 내용(벧전 1:10-12)","s":954.552,"e":961.894,"p":true,"h":false},{"t":"\"구약 성도가 그리스도를 알고 믿었다\"고 단정하면 점진계시를 훼손하고, \"아무것도 몰랐다\"고 하면 약속 신앙의 실체를 놓칩니다.","s":962.592,"e":971.554,"p":false,"h":false},{"t":"약속에 대한 믿음이라는 표현이 정확합니다.","s":972.12,"e":975.016,"p":true,"h":false},{"t":"5.","s":975.912,"e":976.326,"p":false,"h":false},{"t":"흔한 오해에 대한 대응","s":977.784,"e":979.476,"p":true,"h":false},{"t":"세대주의적 구분이나 \"구약은 행위 구원, 신약은 믿음 구원\"이라는 통념이 성도들 사이에 널리 퍼져 있습니다.","s":980.28,"e":987.916,"p":false,"h":false},{"t":"설교나 교육에서 이 오해를 먼저 짚고 들어가면 이후의 율법 이해가 훨씬 수월해집니다.","s":988.608,"e":994.632,"p":true,"h":false}]},{"title":"2장. 율법이 보여주는 하나님: 거룩하신 하나님","audio":"book_2611261521_1.mp3","start":995.52,"end":1787.016,"dur":791.5,"segs":[{"t":"2장.","s":995.52,"e":996.154,"p":false,"h":false},{"t":"율법이 보여주는 하나님: 거룩하신 하나님","s":997.392,"e":1001.193,"p":true,"h":false},{"t":"#레위기를 여는 질문 하나","s":1002.048,"e":1004.432,"p":true,"h":false},{"t":"많은 분들이 레위기를 읽다가 3~4장쯤에서 멈춥니다.","s":1005.336,"e":1009.283,"p":false,"h":false},{"t":"제사 이름은 낯설고, 규례는 반복되고, 왜 이런 것을 하라시는지 이유가 보이지 않기 때문입니다.","s":1009.92,"e":1017.091,"p":true,"h":false},{"t":"그런데 레위기 전체를 꿰뚫는 질문 하나를 붙들고 읽으면 달라집니다.","s":1017.936,"e":1022.431,"p":true,"h":false},{"t":"\"거룩하신 하나님과 죄 많은 백성이 어떻게 함께 살 수 있는가?\"","s":1023.216,"e":1027.515,"p":true,"h":false},{"t":"제사, 제사장, 정결법, 속죄일이 모두 이 질문에 대한 답의 조각입니다.","s":1028.376,"e":1035.209,"p":false,"h":false},{"t":"흩어진 규칙이 아니라 한 편의 이야기입니다.","s":1035.816,"e":1038.899,"p":false,"h":false},{"t":"이 장에서는 그 질문의 앞부분, 곧 \"거룩하신 하나님이 어떤 분이신가\"를 봅니다.","s":1039.2,"e":1045.277,"p":true,"h":false},{"t":"거룩하다는 것은 무슨 뜻일까요","s":1046.184,"e":1048.523,"p":true,"h":false},{"t":"레위기의 중심 말씀은 이것입니다.","s":1049.4,"e":1051.946,"p":true,"h":false},{"t":"\"너희는 거룩하라 내가 거룩함이니라\"(레 19:2)","s":1052.712,"e":1057.083,"p":true,"h":false},{"t":"거룩하다는 말은 흔히 \"깨끗하고 착하다\"는 뜻으로 이해합니다.","s":1057.848,"e":1062.34,"p":false,"h":false},{"t":"그런데 성경의 거룩은 먼저 구별됨이라는 뜻입니다.","s":1062.96,"e":1066.734,"p":false,"h":false},{"t":"그렇다면 하나님은 무엇이 다르시기에 구별되신다는 걸까요?","s":1067.352,"e":1071.445,"p":false,"h":false},{"t":"성경은 두 가지로 답합니다.","s":1072.104,"e":1074.209,"p":true,"h":false},{"t":"첫째, 존재가 다르십니다.","s":1075.08,"e":1077.685,"p":false,"h":false},{"t":"우리는 누군가가 지어서 생겨난 피조물이지만, 하나님은 스스로 계신 분이십니다(출 3:14).","s":1078.296,"e":1085.893,"p":false,"h":false},{"t":"우리는 태어나고 늙고 죽지만, 하나님은 영원하십니다.","s":1086.48,"e":1090.472,"p":false,"h":false},{"t":"우리는 변하지만 하나님은 변하지 않으십니다(말 3:6).","s":1091.088,"e":1096.02,"p":false,"h":false},{"t":"우리는 한 자리에만 있고 아는 것이 제한되어 있지만, 하나님은 어디에나 계시고 모든 것을 아십니다.","s":1096.608,"e":1102.832,"p":false,"h":false},{"t":"이사야는 하나님 앞에서 열방이 통의 물 한 방울 같다고 한 뒤 \"그런즉 너희가 나를 누구와 같다 하여 견주겠느냐\"(사 40:15, 25)고 하시는 분을 \"거룩한 이\"라 부릅니다.","s":1103.496,"e":1117.499,"p":false,"h":false},{"t":"하나님은 우리가 가진 것을 더 크게 가진 분이 아니라, 아예 다른 차원의 분이십니다.","s":1118.16,"e":1123.828,"p":true,"h":false},{"t":"둘째, 죄와 전혀 섞이지 않으십니다.","s":1124.736,"e":1127.885,"p":false,"h":false},{"t":"하나님은 도덕적으로 완전히 깨끗하셔서 \"눈이 너무 깨끗하사 악을 참아 보지 못하십니다\"(합 1:13).","s":1128.552,"e":1137.332,"p":false,"h":false},{"t":"이사야가 하늘 보좌에서 \"거룩, 거룩, 거룩\"이라는 외침을 들었을 때, 그는 하나님의 위대함에 놀라는 데서 멈추지 않고 \"화로다 나여 망하게 되었도다 나는 입술이 부정한 사람이라\"(사 6:3-5)라며 자기 죄를 보았습니다.","s":1137.792,"e":1155.995,"p":false,"h":false},{"t":"존재가 다르신 분이 동시에 죄와 완전히 구별되신 분이시기에, 그 앞에 서는 사람은 자기의 작음과 더러움을 함께 깨닫게 됩니다.","s":1156.632,"e":1165.402,"p":true,"h":false},{"t":"이 두 가지가 합쳐져 거룩이 됩니다.","s":1166.328,"e":1168.796,"p":false,"h":false},{"t":"하나님은 존재에서도 우리와 다르시고, 순결에서도 우리와 다르십니다.","s":1169.424,"e":1174.293,"p":false,"h":false},{"t":"그래서 \"너희는 거룩하라\"는 명령은 하나님처럼 되라는 것이 아니라, 하나님이 가지신 순결을 따라 하나님께 구별되어 살라는 뜻입니다.","s":1174.944,"e":1183.788,"p":true,"h":false},{"t":"#집이 된 거룩: 성막 이야기","s":1184.688,"e":1187.864,"p":true,"h":false},{"t":"하나님은 이 거룩을 말로만 설명하지 않으셨습니다.","s":1188.744,"e":1192.1,"p":false,"h":false},{"t":"눈에 보이는 건물로 보여 주셨습니다.","s":1192.728,"e":1195.345,"p":false,"h":false},{"t":"그것이 성막입니다.","s":1195.92,"e":1197.438,"p":false,"h":false},{"t":"성막은 이스라엘이 광야에서 쓰던 이동식 예배 처소로, 하나님이 백성 가운데 거하시기 위해 세우게 하신 집입니다(출 25:8).","s":1197.984,"e":1207.719,"p":true,"h":false},{"t":"성막에 들어가 본다고 상상해 보십시오.","s":1208.472,"e":1211.088,"p":true,"h":false},{"t":"뜰.","s":1211.904,"e":1212.477,"p":false,"h":false},{"t":"울타리로 둘러싸인 바깥마당입니다.","s":1213.776,"e":1216.408,"p":false,"h":false},{"t":"입구는 하나뿐입니다.","s":1217.064,"e":1218.708,"p":false,"h":false},{"t":"들어서면 제물을 잡는 번제단이 있습니다.","s":1219.296,"e":1222.191,"p":false,"h":false},{"t":"피 냄새와 연기가 가득합니다.","s":1222.752,"e":1225.101,"p":false,"h":false},{"t":"하나님께 나아오려면 가장 먼저 만나는 것이 죽음과 피입니다.","s":1225.752,"e":1230.21,"p":false,"h":false},{"t":"놋 물두멍에서 씻는 곳도 있습니다.","s":1230.768,"e":1233.26,"p":true,"h":false},{"t":"성소.","s":1234.152,"e":1234.938,"p":false,"h":false},{"t":"뜰 안쪽의 천막 안으로, 제사장만 들어갈 수 있습니다.","s":1236.024,"e":1239.97,"p":false,"h":false},{"t":"금 등잔대, 떡을 차려 놓는 상, 향단이 있습니다.","s":1240.608,"e":1245.147,"p":false,"h":false},{"t":"평신도는 여기부터 들어갈 수 없습니다.","s":1245.768,"e":1248.588,"p":true,"h":false},{"t":"지성소.","s":1249.488,"e":1250.391,"p":false,"h":false},{"t":"가장 안쪽의 방으로, 두꺼운 휘장 하나가 성소와 갈라놓았습니다.","s":1251.36,"e":1255.88,"p":false,"h":false},{"t":"하나님이 임재하시는 곳이고, 언약궤가 놓여 있습니다.","s":1256.52,"e":1260.39,"p":false,"h":false},{"t":"이곳은 대제사장만, 1년에 단 하루(속죄일), 반드시 피를 가지고서만 들어갈 수 있었습니다(레 16장, 히 9:7).","s":1261.008,"e":1272.188,"p":true,"h":false},{"t":"바깥에서 안으로 갈수록 접근은 점점 좁아지고, 재료는 점점 귀해집니다.","s":1272.936,"e":1278.267,"p":false,"h":false},{"t":"뜰의 기구는 놋, 성소의 기구는 금입니다.","s":1278.888,"e":1282.322,"p":false,"h":false},{"t":"성막의 구조 전체가 이렇게 말하고 있었습니다.","s":1282.992,"e":1286.091,"p":true,"h":false},{"t":"\"하나님과 사람 사이에는 사람이 스스로 건널 수 없는 거리가 있다.\"","s":1286.976,"e":1291.331,"p":true,"h":false},{"t":"함부로 다가올 수 없는 분","s":1292.112,"e":1293.896,"p":true,"h":false},{"t":"이 거리가 얼마나 진지한 것인지 보여 주는 사건이 있습니다.","s":1294.656,"e":1298.514,"p":false,"h":false},{"t":"성막이 세워지고 제사가 시작된 첫날, 하나님의 불이 나와 제물을 태우자 온 백성이 엎드려 환호했습니다(레 9:24).","s":1299.12,"e":1308.112,"p":false,"h":false},{"t":"그런데 곧바로 비극이 일어납니다.","s":1308.648,"e":1311.159,"p":true,"h":false},{"t":"대제사장 아론의 두 아들 나답과 아비후가 \"하나님이 명령하시지 않은 다른 불\"을 담아 하나님 앞에 드렸습니다.","s":1311.96,"e":1318.58,"p":false,"h":false},{"t":"그러자 여호와 앞에서 불이 나와 그들을 삼켰습니다(레 10:1-2).","s":1319.208,"e":1325.152,"p":false,"h":false},{"t":"하나님은 이렇게 말씀하십니다.","s":1325.76,"e":1327.969,"p":true,"h":false},{"t":"\"나는 나에게 가까이하는 자들 중에서 내가 거룩함을 나타내겠고\"(레 10:3)","s":1328.544,"e":1334.656,"p":true,"h":false},{"t":"이들은 악한 사람이 아니었습니다.","s":1335.336,"e":1337.781,"p":false,"h":false},{"t":"제사장의 직분을 받은 사람들이었고, 열심은 있었을 것입니다.","s":1338.12,"e":1342.716,"p":false,"h":false},{"t":"문제는 하나님이 정하신 방식이 아니라 자기 방식으로 나아갔다는 데 있었습니다.","s":1343.304,"e":1348.649,"p":true,"h":false},{"t":"비슷한 일이 다윗 때에도 있었습니다.","s":1349.544,"e":1352.076,"p":false,"h":false},{"t":"언약궤를 옮기던 중 소들이 뛰어 궤가 흔들리자 웃사가 손을 들어 궤를 붙들었다가 그 자리에서 죽었습니다(삼하 6:6-7).","s":1352.712,"e":1362.065,"p":false,"h":false},{"t":"선의로 한 행동이었습니다.","s":1362.504,"e":1364.362,"p":false,"h":false},{"t":"그러나 거룩하신 하나님 앞에서는 선의가 규칙을 대신하지 못했습니다.","s":1364.904,"e":1369.612,"p":true,"h":false},{"t":"이 사건들이 우리에게 가르치는 것은 하나님이 잔인하시다는 것이 아닙니다.","s":1370.448,"e":1375.265,"p":false,"h":false},{"t":"하나님은 우리 마음대로, 우리 방식대로 만날 수 있는 분이 아니라는 것입니다.","s":1375.896,"e":1381.077,"p":false,"h":false},{"t":"우리가 흔히 쓰는 말로 하면, 하나님은 \"편한 친구\"로만 계시는 분이 아닙니다.","s":1381.728,"e":1386.993,"p":true,"h":false},{"t":"#불꽃 앞의 모세","s":1387.872,"e":1389.752,"p":true,"h":false},{"t":"시내산에서도 같은 장면이 나옵니다.","s":1390.488,"e":1393.065,"p":false,"h":false},{"t":"하나님이 산 위에 내려오시자 천둥과 번개와 연기가 가득했고, 백성은 떨며 멀리 섰습니다.","s":1393.68,"e":1400.059,"p":false,"h":false},{"t":"산 둘레에는 경계선이 그어졌고, 짐승이라도 그 산에 닿으면 죽임을 당해야 했습니다(출 19:12-13, 16-18).","s":1400.688,"e":1411.618,"p":false,"h":false},{"t":"모세조차 \"내가 심히 두렵고 떨린다\"고 했다고 히브리서는 전합니다(히 12:21).","s":1412.184,"e":1419.181,"p":true,"h":false},{"t":"그러나 이 모든 두려움이 하나님을 멀리하라는 뜻은 아니었습니다.","s":1419.936,"e":1424.19,"p":false,"h":false},{"t":"같은 하나님이 같은 산에서 \"너희는 내게 제사장 나라가 되며 거룩한 백성이 되리라\"(출 19:6)고 하셨습니다.","s":1424.736,"e":1433.931,"p":false,"h":false},{"t":"거룩하신 분이 가까이 오시기를 원하셨기 때문에, 가까이 올 수 있는 길을 마련하는 것이 필요했던 것입니다.","s":1434.576,"e":1441.482,"p":false,"h":false},{"t":"이 길이 곧 제사입니다.","s":1442.112,"e":1443.845,"p":false,"h":false},{"t":"그 이야기는 4장에서 이어집니다.","s":1444.44,"e":1446.972,"p":true,"h":false},{"t":"#이 장을 마치며: 그림이 보여 주는 것","s":1447.848,"e":1451.421,"p":true,"h":false},{"t":"성막은 두 가지를 한꺼번에 말합니다.","s":1452.144,"e":1454.774,"p":true,"h":false},{"t":"하나는 하나님이 거룩하시다는 것입니다.","s":1455.648,"e":1458.279,"p":false,"h":false},{"t":"바깥에서 안으로 갈수록 좁아지는 구조, 지성소의 두꺼운 휘장, 나답과 아비후의 죽음이 그것을 보여 줍니다.","s":1458.576,"e":1466.393,"p":true,"h":false},{"t":"다른 하나는 그런데도 하나님이 사람 가운데 거하기를 원하신다는 것입니다.","s":1467.264,"e":1471.82,"p":false,"h":false},{"t":"성막은 하나님이 먼저 \"내가 그들 중에 거하리라\"(출 25:8)고 하시며 세우게 하신 집입니다.","s":1472.448,"e":1480.592,"p":false,"h":false},{"t":"거리는 멀지만, 그 거리를 건너오고자 하시는 분도 하나님이십니다.","s":1481.232,"e":1486.027,"p":true,"h":false},{"t":"이 두 가지를 함께 붙들어야 복음이 선명해집니다.","s":1486.896,"e":1490.329,"p":false,"h":false},{"t":"거룩하신 하나님이 가까이 계시려 한다면, 그 사이의 거리를 누가, 어떻게 채울 것인가.","s":1490.88,"e":1497.129,"p":false,"h":false},{"t":"이 질문이 3장(사람은 어떤 상태인가), 4장(제사), 그리고 마침내 6장(휘장이 찢어지다)으로 이어집니다.","s":1497.768,"e":1508.978,"p":true,"h":false},{"t":"낯선 용어 풀이","s":1509.84,"e":1511.19,"p":true,"h":false},{"t":"• 성막: 광야 시대에 이스라엘이 하나님께 예배하던 이동식 천막 성전입니다.","s":1512.048,"e":1517.709,"p":false,"h":false},{"t":"뜰, 성소, 지성소로 이루어져 있습니다.","s":1518.36,"e":1522.353,"p":true,"h":false},{"t":"• 지성소: 성막의 가장 안쪽 방으로, 하나님의 임재를 상징하는 언약궤가 있던 곳입니다.","s":1523.208,"e":1529.642,"p":true,"h":false},{"t":"• 제사장: 백성을 대표해 하나님께 제사를 드리는 직분입니다.","s":1530.552,"e":1535.37,"p":false,"h":false},{"t":"대제사장은 그중 으뜸으로, 속죄일에 지성소에 들어갑니다.","s":1536,"e":1540.367,"p":true,"h":false},{"t":"• 언약궤: 십계명 돌판을 담은 금으로 싼 상자로, 그 뚜껑(속죄소) 위에 하나님이 임재하셨습니다.","s":1541.208,"e":1549.44,"p":true,"h":false},{"t":"• 거룩: 하나님이 피조물과 구별되시는 분임을 나타내는 말입니다.","s":1550.328,"e":1554.899,"p":false,"h":false},{"t":"존재에서 우리와 다르시고(자존, 영원, 불변), 순결에서 죄와 전혀 섞이지 않으심을 뜻합니다.","s":1555.536,"e":1564.143,"p":false,"h":false},{"t":"사람에게 쓰면 \"하나님께 구별되었다\"는 뜻입니다.","s":1564.776,"e":1568.55,"p":true,"h":false},{"t":"한 줄 요약","s":1569.432,"e":1570.395,"p":true,"h":false},{"t":"하나님은 존재에서도 순결에서도 우리와 다르신 거룩한 분이시므로 아무렇게나 만날 수 없지만, 그런데도 사람 가운데 거하기를 원하십니다.","s":1571.304,"e":1580.362,"p":true,"h":false},{"t":"함께 나눠 볼 질문","s":1581.24,"e":1582.769,"p":true,"h":false},{"t":"1.","s":1583.568,"e":1584.103,"p":false,"h":false},{"t":"나는 하나님을 \"언제든 편하게 만날 수 있는 분\"으로만 생각해 오지는 않았는가?","s":1585.44,"e":1590.667,"p":true,"h":false},{"t":"2.","s":1591.56,"e":1591.845,"p":false,"h":false},{"t":"나답과 아비후, 웃사의 이야기를 읽으면 어떤 마음이 드는가?","s":1592.16,"e":1596.643,"p":false,"h":false},{"t":"그 마음은 하나님의 거룩에 대해 무엇을 말해 주는가?","s":1597.296,"e":1600.566,"p":true,"h":false},{"t":"3.","s":1601.472,"e":1602.061,"p":false,"h":false},{"t":"거룩하신 하나님이 먼저 \"내가 그들 중에 거하리라\" 하신 것은 나에게 어떤 위로가 되는가?","s":1603.344,"e":1608.964,"p":true,"h":false},{"t":"목회자 노트 (2장)","s":1609.848,"e":1612.006,"p":true,"h":false},{"t":"이 구조는 개혁신학의 은혜언약 이해를 따른 것입니다.","s":1612.68,"e":1616.276,"p":true,"h":false},{"t":"1.","s":1617.144,"e":1617.679,"p":false,"h":false},{"t":"가르칠 때의 뼈대","s":1619.016,"e":1620.551,"p":true,"h":false},{"t":"레위기 전체를 \"거룩하신 하나님과 죄 많은 백성이 어떻게 함께 사는가\"라는 하나의 질문으로 묶는 것이 이 장의 방법입니다.","s":1621.368,"e":1629.804,"p":false,"h":false},{"t":"이 질문이 있으면 평신도가 레위기를 흩어진 규정이 아닌 하나의 서사로 읽습니다.","s":1630.464,"e":1635.52,"p":true,"h":false},{"t":"2.","s":1636.368,"e":1636.653,"p":false,"h":false},{"t":"성막 구조의 신학","s":1636.968,"e":1638.444,"p":true,"h":false},{"t":"성막의 공간 구조(뜰, 성소, 지성소)는 접근의 단계를 나타냅니다.","s":1639.272,"e":1646.701,"p":false,"h":false},{"t":"동시에 성막은 하나님이 먼저 \"그들 중에 거하리라\"(출 25:8) 하신 임재의 장소이므로, 거리와 임재가 함께 있다는 이중성이 핵심입니다.","s":1647.312,"e":1658.708,"p":false,"h":false},{"t":"이 이중성이 6장에서 휘장이 찢어지는 사건(마 27:51, 히 10:19-20)으로 해소됩니다.","s":1659.336,"e":1669.504,"p":true,"h":false},{"t":"3.","s":1670.376,"e":1670.965,"p":false,"h":false},{"t":"나답과 아비후 사건 해석","s":1672.248,"e":1674.266,"p":true,"h":false},{"t":"이 사건은 규정 위반에 대한 형벌이라는 면과 함께, 하나님의 거룩이 가까이 나아가는 자들 가운데서 나타난다는 면(레 10:3)을 강조해야 합니다.","s":1675.056,"e":1685.953,"p":false,"h":false},{"t":"열심이나 선의가 하나님이 정하신 길을 대신할 수 없다는 점이 제사 이해의 전제가 됩니다.","s":1686.576,"e":1692.397,"p":false,"h":false},{"t":"이 점은 예배의 규정적 원리(웨스트민스터 신앙고백서 21장)와도 맞닿아 있으나, 평신도 본문에서는 용어를 쓰지 않았습니다.","s":1693.032,"e":1703.165,"p":true,"h":false},{"t":"4.","s":1704,"e":1704.546,"p":false,"h":false},{"t":"주의할 점","s":1705.872,"e":1706.877,"p":true,"h":false},{"t":"구약의 하나님을 \"무서운 분\", 신약의 하나님을 \"사랑의 분\"으로 나누지 않도록 해야 합니다.","s":1707.744,"e":1713.424,"p":false,"h":false},{"t":"시내산의 두려움과 같은 자리에서 \"제사장 나라\"의 약속이 주어졌다는 점(출 19:6)을 함께 가르치면 균형이 잡힙니다.","s":1714.08,"e":1723.484,"p":true,"h":false},{"t":"5.","s":1724.376,"e":1724.79,"p":false,"h":false},{"t":"거룩의 내용과 조직신학적 위치","s":1726.248,"e":1728.666,"p":true,"h":false},{"t":"거룩은 어원적으로 구별됨이며, 그 내용은 두 면을 가집니다.","s":1729.44,"e":1734.051,"p":false,"h":false},{"t":"(1) 존재의 초월성: 자존, 영원, 불변, 무한 등 비공유적 속성과 연결(출 3:14, 말 3:6, 사 40:25, 호 11:9).","s":1734.696,"e":1751.684,"p":false,"h":false},{"t":"(2) 윤리적 순결: 죄와 완전히 분리된 도덕적 완전성(합 1:13, 사 6:3-5).","s":1752.288,"e":1761.645,"p":false,"h":false},{"t":"조직신학에서는 거룩을 비공유적 속성, 공유적(도덕적) 속성, 또는 모든 속성을 아우르는 속성으로 분류하는 입장이 있으므로, 교단에서 쓰는 교재의 분류에 맞추어 가르치시면 됩니다.","s":1762.2,"e":1776.473,"p":false,"h":false},{"t":"사람에게 요구되는 거룩(\"너희는 거룩하라\")은 주로 두 번째 면, 곧 윤리적 순결과 하나님께 대한 구별의 의미입니다.","s":1776.768,"e":1786.123,"p":true,"h":false}]},{"title":"3장. 율법이 보여주는 사람: 정결과 부정","audio":"book_2611261521_1.mp3","start":1787.016,"end":2474.856,"dur":687.8,"segs":[{"t":"3장.","s":1787.016,"e":1787.748,"p":false,"h":false},{"t":"율법이 보여주는 사람: 정결과 부정","s":1788.888,"e":1792.296,"p":true,"h":false},{"t":"가장 낯선 부분 앞에서","s":1793.208,"e":1794.939,"p":true,"h":false},{"t":"레위기를 읽다가 가장 크게 막히는 곳이 11~15장입니다.","s":1795.776,"e":1800.318,"p":false,"h":false},{"t":"먹어도 되는 동물과 안 되는 동물, 피부병, 곰팡이 핀 집과 옷, 출산, 몸의 유출...","s":1800.936,"e":1808.984,"p":false,"h":false},{"t":"읽다 보면 \"이게 오늘 나와 무슨 상관인가\" 싶습니다.","s":1809.504,"e":1813.209,"p":false,"h":false},{"t":"게다가 이런 일들은 대부분 죄를 지어서 생기는 것도 아닙니다.","s":1813.848,"e":1818.166,"p":false,"h":false},{"t":"아이를 낳는 것이 죄는 아닌데 왜 부정하다고 할까요?","s":1818.744,"e":1822.304,"p":true,"h":false},{"t":"이 의문을 풀어 주는 열쇠가 있습니다.","s":1823.184,"e":1825.865,"p":false,"h":false},{"t":"2장에서 본 질문, \"거룩하신 하나님과 사람이 어떻게 함께 살 수 있는가\"를 이어서 붙들고 읽는 것입니다.","s":1826.496,"e":1833.998,"p":true,"h":false},{"t":"정결과 부정, 무엇을 말하는가","s":1834.92,"e":1837.95,"p":true,"h":false},{"t":"먼저 용어부터 정리하겠습니다.","s":1838.832,"e":1841.211,"p":false,"h":false},{"t":"정결은 하나님 앞에 나아갈 수 있는 상태이고, 부정은 그럴 수 없는 상태입니다.","s":1841.784,"e":1847.243,"p":false,"h":false},{"t":"여기서 부정은 \"죄를 지었다\"와 같은 말이 아닙니다.","s":1847.88,"e":1851.463,"p":false,"h":false},{"t":"부정한 상태가 되는 일 중에는 죄가 아닌 것이 많습니다.","s":1852.104,"e":1855.824,"p":false,"h":false},{"t":"시체를 돌보는 일, 아이를 낳는 일은 오히려 마땅한 일입니다.","s":1856.472,"e":1861.118,"p":false,"h":false},{"t":"그런데도 부정하다고 했습니다.","s":1861.776,"e":1863.804,"p":true,"h":false},{"t":"이를 이해하려면 부정하게 되는 일들의 공통점을 보아야 합니다.","s":1864.632,"e":1868.856,"p":false,"h":false},{"t":"시체, 피부병(나병), 몸의 출혈과 유출, 곰팡이와 부패.","s":1869.456,"e":1876.736,"p":false,"h":false},{"t":"이것들은 모두 죽음과 부패, 생명이 무너지는 모습과 연결되어 있습니다.","s":1877.328,"e":1882.895,"p":false,"h":false},{"t":"거룩하신 하나님은 살아 계신 생명의 하나님이십니다.","s":1883.496,"e":1887.113,"p":false,"h":false},{"t":"그분 앞에 죽음의 흔적을 지닌 채 나아갈 수는 없다는 것이 정결법의 바탕에 깔린 생각입니다.","s":1887.72,"e":1893.839,"p":true,"h":false},{"t":"그렇다면 정결법은 사람에게 무엇을 가르쳤을까요?","s":1894.704,"e":1898.318,"p":false,"h":false},{"t":"단지 \"죄를 짓지 말라\"를 넘어, 죄로 타락한 이 세상의 상태 자체가 하나님 앞에 그대로 설 수 없는 상태라는 것입니다.","s":1899,"e":1906.794,"p":false,"h":false},{"t":"죄가 세상에 들어온 결과 죽음이 왔고, 우리는 그 죽음의 세상에서 태어나 살아갑니다.","s":1907.472,"e":1913.618,"p":false,"h":false},{"t":"정결법은 이 사실을 일상의 규례로 날마다 몸으로 느끼게 한 교육이었습니다.","s":1914.264,"e":1919.649,"p":true,"h":false},{"t":"부정이 되면 어떻게 되었나","s":1920.552,"e":1922.569,"p":true,"h":false},{"t":"부정한 사람은 성막에 나아갈 수 없었고, 사람들과 접촉하면 그 부정이 옮아 갈 수 있었습니다.","s":1923.456,"e":1930.075,"p":false,"h":false},{"t":"특히 심한 피부병(레위기의 \"나병\")에 걸린 사람은 옷을 찢고 머리를 풀고 \"부정하다, 부정하다\" 외치며 진영 밖에서 혼자 살아야 했습니다(레 13:45-46).","s":1930.728,"e":1945.2,"p":false,"h":false},{"t":"가족과 공동체에서 격리되고, 예배에서도 멀어지는 고통스러운 처지였습니다.","s":1945.776,"e":1951.207,"p":true,"h":false},{"t":"다행히 부정은 영원하지 않았습니다.","s":1952.088,"e":1954.609,"p":false,"h":false},{"t":"하나님은 부정한 상태에서 벗어나는 길도 정해 주셨습니다.","s":1955.256,"e":1959.127,"p":false,"h":false},{"t":"정한 기간이 지나기를 기다리고, 몸을 씻고, 때로는 제물을 드리는 것입니다(레 12, 14, 15장).","s":1959.768,"e":1969.575,"p":false,"h":false},{"t":"이 정결 의식은 \"부정한 채로 영영 버려두지 않겠다\"는 하나님의 은혜를 보여 줍니다.","s":1970.112,"e":1975.968,"p":true,"h":false},{"t":"먹는 것까지 구별하신 이유 (레 11장)","s":1976.856,"e":1980.749,"p":true,"h":false},{"t":"정결법의 가장 낯선 부분은 음식 규례입니다.","s":1981.56,"e":1984.808,"p":false,"h":false},{"t":"소와 양은 되고 돼지는 안 되고, 비늘 있는 물고기는 되고 새우나 조개는 안 되고...","s":1985.424,"e":1991.232,"p":false,"h":false},{"t":"왜 이런 구분이 필요했을까요?","s":1991.424,"e":1993.61,"p":true,"h":false},{"t":"성경 본문이 직접 밝히는 이유는 이것입니다.","s":1994.52,"e":1997.637,"p":true,"h":false},{"t":"\"나는 너희의 하나님 여호와니라 ...","s":1998.528,"e":2000.735,"p":false,"h":false},{"t":"너희는 거룩하라 내가 거룩하니라\"(레 11:44-45)","s":2001.144,"e":2006.728,"p":true,"h":false},{"t":"하나님은 이스라엘이 만민 가운데 구별된 백성으로 살기를 원하셨고, 그 구별을 식탁 위에까지 새겨 주셨습니다.","s":2007.456,"e":2015.214,"p":false,"h":false},{"t":"그렇다면 그 구분의 기준은 무엇이었을까요?","s":2015.808,"e":2018.885,"p":false,"h":false},{"t":"많은 신학자들은 상징적 의미에서 답을 찾습니다.","s":2019.552,"e":2023.121,"p":false,"h":false},{"t":"하나님은 창조 때 모든 생물을 \"그 종류대로\" 질서 있게 지으셨습니다.","s":2023.728,"e":2028.665,"p":false,"h":false},{"t":"정한 동물은 각 영역(땅, 물, 하늘)에서 그 종류의 온전한 모습을 갖춘 것이고, 부정한 동물은 그 질서에서 벗어난 것이나 죽은 것을 먹는 것들로 분류되었다는 해석입니다.","s":2029.296,"e":2043.438,"p":false,"h":false},{"t":"이렇게 보면 식탁은 날마다 \"하나님은 질서와 생명의 하나님이시고, 나는 그분께 구별된 백성이다\"를 되새기는 자리가 됩니다.","s":2044.008,"e":2053.042,"p":true,"h":false},{"t":"이 외에도 건강과 위생 때문이라는 설명, 이방 종교의 제의와 구별하기 위해서라는 설명이 있습니다.","s":2053.92,"e":2060.991,"p":false,"h":false},{"t":"어느 한 가지로 모든 규례를 설명하기는 어렵지만, 이 해석들은 서로 충돌하지 않고 본문이 말하는 \"거룩과 구별\"이라는 목적 안에서 함께 이해될 수 있습니다.","s":2061.624,"e":2072.23,"p":true,"h":false},{"t":"옛날부터 교회에서는 이 규례를 신앙의 모습에 비추어 풀기도 했습니다.","s":2073.144,"e":2077.94,"p":false,"h":false},{"t":"예를 들어 되새김질하는 동물을 보며, 들은 말씀을 곱씹고 주야로 묵상하는 성도의 모습을 떠올리는 식입니다.","s":2078.592,"e":2086.025,"p":false,"h":false},{"t":"시편 1편이 말씀을 즐거워하며 주야로 묵상하는 사람을 복 있는 사람이라 부르니, 이런 적용은 은혜로운 교훈이 됩니다.","s":2086.632,"e":2094.526,"p":false,"h":false},{"t":"다만 이것은 레위기 본문이 직접 가르치는 뜻이라기보다, 그 위에서 얻는 영적 묵상이라고 이해하는 것이 좋습니다.","s":2095.152,"e":2103.101,"p":false,"h":false},{"t":"본문이 밝히는 목적은 어디까지나 거룩과 구별입니다.","s":2103.72,"e":2107.523,"p":false,"h":false},{"t":"(이 되새김의 실천 이야기는 7장에서 이어집니다.)","s":2108.136,"e":2111.444,"p":true,"h":false},{"t":"이 구별은 신약에서 베드로가 환상을 통해 이방인에게 복음을 전하게 되면서(행 10장) 새롭게 해석됩니다.","s":2112.312,"e":2120.536,"p":false,"h":false},{"t":"그 이야기는 6장에서 다룹니다.","s":2121.168,"e":2123.636,"p":true,"h":false},{"t":"일상 전체가 하나님 앞이었습니다","s":2124.504,"e":2126.915,"p":true,"h":false},{"t":"정결법을 한눈에 보면 놀라운 점이 하나 있습니다.","s":2127.84,"e":2131.171,"p":false,"h":false},{"t":"먹는 것, 몸의 상태, 출산, 집과 옷에 이르기까지, 사람이 사는 모든 영역이 하나님 앞이라는 사실입니다.","s":2131.776,"e":2140.709,"p":false,"h":false},{"t":"종교적인 행사 때만 하나님 앞에 서는 것이 아니라, 하루 종일 먹고 자고 일하는 모든 시간이 거룩하신 하나님 앞이었습니다.","s":2141.352,"e":2149.185,"p":true,"h":false},{"t":"이는 오늘 우리에게도 질문을 던집니다.","s":2149.992,"e":2152.826,"p":false,"h":false},{"t":"우리는 주일 예배 한 시간만 하나님 앞에 서 있는 것은 아닌지, 월요일부터 토요일의 삶은 하나님과 무관한 영역처럼 지내고 있지는 않은지 돌아보게 합니다.","s":2153.448,"e":2163.604,"p":true,"h":false},{"t":"정결법이 우리에게 보여 준 것","s":2164.488,"e":2166.593,"p":true,"h":false},{"t":"정결법은 두 가지를 보여 줍니다.","s":2167.368,"e":2169.739,"p":true,"h":false},{"t":"첫째, 우리의 문제는 죄를 짓는 행동만이 아니라는 것입니다.","s":2170.608,"e":2175.203,"p":false,"h":false},{"t":"우리가 태어난 이 세상, 우리가 입고 있는 이 몸 자체가 죽음과 부패의 영향 아래 있습니다.","s":2175.84,"e":2182.161,"p":false,"h":false},{"t":"행동을 조금 고친다고 해결되지 않고, 상태 자체가 바뀌어야 합니다.","s":2182.8,"e":2187.583,"p":true,"h":false},{"t":"둘째, 우리는 스스로 이 부정을 씻어낼 수 없다는 것입니다.","s":2188.368,"e":2192.913,"p":false,"h":false},{"t":"정결해지려면 하나님이 정하신 방법, 곧 물과 피의 정결 의식을 거쳐야 했습니다.","s":2193.552,"e":2199.472,"p":false,"h":false},{"t":"사람이 아무리 노력해도 자기 힘으로 부정을 벗는 길은 없었습니다.","s":2200.128,"e":2204.401,"p":true,"h":false},{"t":"이 두 가지가 복음을 향한 길을 엽니다.","s":2204.928,"e":2207.588,"p":false,"h":false},{"t":"부정이 옮아 가는 세상에서, 그 방향을 거꾸로 돌려 줄 분이 오셔야 하기 때문입니다.","s":2208.216,"e":2213.903,"p":false,"h":false},{"t":"복음서의 한 장면이 이것을 보여 줍니다.","s":2214.552,"e":2217.258,"p":false,"h":false},{"t":"예수님은 나병환자에게 손을 대어 고치셨고(막 1:40-42), 12년간 혈루증을 앓던 여인이 당신의 옷에 손을 대는 것을 막지 않으셨습니다(막 5:25-34).","s":2217.552,"e":2232.335,"p":false,"h":false},{"t":"율법에서는 부정한 것과 접촉하면 정한 사람도 부정해졌습니다.","s":2232.936,"e":2237.581,"p":false,"h":false},{"t":"그런데 예수님께는 부정이 옮겨지지 않았고, 오히려 예수님의 정결이 부정한 사람에게 흘러가 그를 깨끗하게 했습니다.","s":2238.24,"e":2246.302,"p":false,"h":false},{"t":"부정이 옮아가던 방향이 거꾸로 돌려진 것입니다.","s":2246.952,"e":2250.201,"p":false,"h":false},{"t":"이것이 6장에서 다룰 복음의 놀라움입니다.","s":2250.816,"e":2253.851,"p":true,"h":false},{"t":"낯선 용어 풀이","s":2254.728,"e":2256.078,"p":true,"h":false},{"t":"• 정결: 하나님 앞에 나아갈 수 있는 깨끗한 상태입니다.","s":2256.936,"e":2261.039,"p":true,"h":false},{"t":"• 부정: 하나님 앞에 나아갈 수 없는 상태입니다.","s":2261.928,"e":2265.449,"p":false,"h":false},{"t":"죄를 지었다는 뜻과 같지 않으며, 죽음과 부패의 영향 아래 있는 상태를 포함합니다.","s":2266.104,"e":2271.841,"p":true,"h":false},{"t":"• 나병: 레위기에서 말하는 나병은 오늘날의 한센병만이 아니라 여러 종류의 심한 피부병을 가리키는 것으로 이해됩니다.","s":2272.752,"e":2281.035,"p":true,"h":false},{"t":"• 진영 밖: 이스라엘이 광야에서 천막을 치고 모여 살던 진영의 바깥.","s":2281.92,"e":2286.843,"p":false,"h":false},{"t":"부정한 사람이 격리되던 곳입니다.","s":2287.368,"e":2289.773,"p":true,"h":false},{"t":"한 줄 요약","s":2290.56,"e":2291.523,"p":true,"h":false},{"t":"정결법은 죄를 짓는 행동만이 아니라 죄로 타락한 세상의 상태 자체가 하나님 앞에 설 수 없는 것임을 보여 주며, 사람이 스스로 그것을 씻을 수 없음을 가르칩니다.","s":2292.432,"e":2302.806,"p":true,"h":false},{"t":"함께 나눠 볼 질문","s":2303.688,"e":2305.217,"p":true,"h":false},{"t":"1.","s":2306.016,"e":2306.551,"p":false,"h":false},{"t":"정결법의 규례들을 읽을 때 가장 낯설거나 불편했던 것은 무엇이었는가?","s":2307.888,"e":2312.97,"p":true,"h":false},{"t":"2.","s":2313.864,"e":2314.149,"p":false,"h":false},{"t":"나는 하나님 앞에 서는 시간을 주일 예배에만 한정하고 있지는 않은가?","s":2314.464,"e":2318.601,"p":true,"h":false},{"t":"3.","s":2319.48,"e":2320.069,"p":false,"h":false},{"t":"나병환자에게 손을 대신 예수님의 모습은 부정한 자였던 나에게 어떤 의미로 다가오는가?","s":2321.352,"e":2326.997,"p":true,"h":false},{"t":"목회자 노트 (3장)","s":2327.88,"e":2330.16,"p":true,"h":false},{"t":"이 구조는 개혁신학의 은혜언약 이해를 따른 것입니다.","s":2330.832,"e":2334.428,"p":true,"h":false},{"t":"1.","s":2335.296,"e":2335.831,"p":false,"h":false},{"t":"가르칠 때의 뼈대","s":2337.168,"e":2338.703,"p":true,"h":false},{"t":"정결법의 핵심 원리를 \"죽음과 부패에 대한 거룩한 생명의 하나님의 구별\"로 묶는 것이 이 장의 방법입니다.","s":2339.52,"e":2346.44,"p":false,"h":false},{"t":"부정은 죄와 동일하지 않지만 죄의 결과인 죽음의 영역과 연결됩니다.","s":2347.08,"e":2351.744,"p":false,"h":false},{"t":"이를 통해 구약 정결법이 죄의 행위뿐 아니라 타락한 상태 전체를 가리킨다는 점을 가르칠 수 있습니다.","s":2352.36,"e":2358.997,"p":true,"h":false},{"t":"2.","s":2359.896,"e":2360.181,"p":false,"h":false},{"t":"정결법 해석의 여러 입장","s":2360.496,"e":2362.531,"p":true,"h":false},{"t":"음식 규례의 해석은 학계에서 합의가 없지만(위생설, 이방 종교와의 구별설, 상징설 등), 개혁파 전통에서는 상징적 해석(창조 질서와 구별의 교육)이 널리 받아들여져 왔습니다.","s":2363.352,"e":2378.255,"p":false,"h":false},{"t":"다만 동물 하나하나에 본문이 말하지 않는 구체적 상징을 붙이는 알레고리는 경계하고, 본문이 명시한 원리(거룩과 구별, 레 11:44-45)를 중심으로 가르치는 것이 좋습니다.","s":2378.904,"e":2393.943,"p":false,"h":false},{"t":"부흥회 등에서 전해지는 동물별 영적 적용(예: 되새김질과 말씀 묵상)은 설교적 적용으로는 유익하나, 본문이 명시한 상징이 아니므로 \"본문의 뜻\"과 \"적용\"을 구분해서 가르치도록 권합니다.","s":2394.504,"e":2409.525,"p":true,"h":false},{"t":"3.","s":2410.056,"e":2410.645,"p":false,"h":false},{"t":"정결 의식과 은혜","s":2411.928,"e":2413.579,"p":true,"h":false},{"t":"부정은 영구적이지 않고, 하나님이 회복의 길을 마련해 주셨다는 점에서 정결 제도 자체가 은혜의 구조입니다.","s":2414.4,"e":2421.696,"p":true,"h":false},{"t":"4.","s":2422.584,"e":2423.13,"p":false,"h":false},{"t":"복음서와의 연결","s":2424.456,"e":2425.986,"p":true,"h":false},{"t":"부정의 전염 방향이 그리스도에게서 역전된다는 점(막 1:41, 5:25-34)이 이 장과 6장을 잇는 연결고리입니다.","s":2426.424,"e":2437.866,"p":false,"h":false},{"t":"다만 6장에서 그리스도께서 율법의 정결 요구를 폐하신 것이 아니라 성취하셨다는 점을 분명히 해야 합니다.","s":2438.496,"e":2445.553,"p":true,"h":false},{"t":"5.","s":2446.44,"e":2446.854,"p":false,"h":false},{"t":"음식법과 신약","s":2448.312,"e":2449.755,"p":true,"h":false},{"t":"음식 규례의 구별 기능이 신약에서 어떻게 성취되는지(막 7:19, 행 10장, 골 2:16-17)는 6장 또는 부록에서 다룰 수 있습니다.","s":2450.52,"e":2463.973,"p":false,"h":false},{"t":"구약의 정결법을 \"시대에 뒤처진 규칙\"으로 치부하지 않고, 그 목적이 그리스도 안에서 성취되었다는 방식으로 가르치도록 유의합니다.","s":2464.608,"e":2473.968,"p":true,"h":false}]},{"title":"4장. 제사: 하나님이 마련해 주신 길","audio":"book_2611261521_1.mp3","start":2474.856,"end":3261.648,"dur":786.8,"segs":[{"t":"4장.","s":2474.856,"e":2475.539,"p":false,"h":false},{"t":"제사: 하나님이 마련해 주신 길","s":2476.728,"e":2479.582,"p":true,"h":false},{"t":"2장의 질문에 대한 답","s":2480.448,"e":2482.104,"p":true,"h":false},{"t":"2장에서 우리는 거룩하신 하나님과 사람 사이에 스스로 건널 수 없는 거리가 있음을 보았고, 3장에서는 사람이 스스로 부정을 씻어낼 수 없음을 보았습니다.","s":2482.848,"e":2492.904,"p":false,"h":false},{"t":"그렇다면 길은 영영 막혀 있는 걸까요?","s":2493.528,"e":2496.148,"p":true,"h":false},{"t":"아닙니다.","s":2497.032,"e":2497.928,"p":false,"h":false},{"t":"하나님이 직접 길을 마련해 주셨습니다.","s":2498.904,"e":2501.449,"p":false,"h":false},{"t":"그것이 제사입니다.","s":2502.024,"e":2503.642,"p":false,"h":false},{"t":"제사는 사람이 하나님을 달래기 위해 만들어 낸 장치가 아닙니다.","s":2503.944,"e":2508.106,"p":false,"h":false},{"t":"거룩하신 하나님이 죄인을 만나 주시기 위해 먼저 베푸신 은혜의 길입니다.","s":2508.696,"e":2513.679,"p":false,"h":false},{"t":"레위기 1장은 이렇게 시작합니다.","s":2514.216,"e":2516.837,"p":false,"h":false},{"t":"\"여호와께서 회막에서 모세를 부르사 그에게 이르시되\"(레 1:1).","s":2517.48,"e":2523.085,"p":false,"h":false},{"t":"제사의 규례는 하나님이 먼저 부르시는 말씀으로 시작됩니다.","s":2523.696,"e":2527.791,"p":true,"h":false},{"t":"제사의 두 가지 핵심: 안수와 피","s":2528.664,"e":2531.834,"p":true,"h":false},{"t":"제사의 종류는 여러 가지지만 모든 제사를 꿰뚫는 장면은 두 가지입니다.","s":2532.792,"e":2537.774,"p":true,"h":false},{"t":"첫째, 안수입니다.","s":2538.648,"e":2540.852,"p":false,"h":false},{"t":"제물을 가져온 사람이 짐승의 머리에 손을 얹습니다(레 1:4).","s":2541.456,"e":2546.826,"p":false,"h":false},{"t":"이 행위는 \"이 짐승이 나를 대신합니다\"라는 선언입니다.","s":2547.288,"e":2551.667,"p":false,"h":false},{"t":"특히 속죄일에는 백성의 죄를 짐승의 머리 위에 얹는 장면이 분명하게 나옵니다(레 16:21).","s":2552.28,"e":2559.789,"p":true,"h":false},{"t":"둘째, 피입니다.","s":2560.512,"e":2562.673,"p":false,"h":false},{"t":"짐승은 죽임을 당하고 그 피가 제단에 뿌려집니다.","s":2563.272,"e":2566.805,"p":false,"h":false},{"t":"죄의 값은 사망이기 때문에(롬 6:23) 누군가는 죽어야 하고, 그 죽음을 짐승이 대신 감당합니다.","s":2567.424,"e":2576.453,"p":false,"h":false},{"t":"\"생명은 피에 있기 때문이라 내가 이 피를 너희에게 주어 제단에서 너희의 생명을 위하여 속죄하게 하였나니\"(레 17:11).","s":2577.072,"e":2586.166,"p":false,"h":false},{"t":"피 흘림 없이는 사함이 없다는 말씀(히 9:22)은 이 원리의 요약입니다.","s":2586.672,"e":2593.527,"p":true,"h":false},{"t":"잠깐 생각해 보면, 이 장면은 가볍지 않습니다.","s":2594.4,"e":2598.109,"p":false,"h":false},{"t":"제물을 가져온 사람은 자기 손으로 짐승의 머리에 손을 얹고, 그 짐승이 죽는 것을 눈앞에서 지켜보았습니다.","s":2598.72,"e":2606.141,"p":false,"h":false},{"t":"\"내 죄의 값이 이렇구나\"를 몸으로 배운 것입니다.","s":2606.736,"e":2610.069,"p":false,"h":false},{"t":"죄가 얼마나 무거운지를 말이 아니라 장면으로 가르친 교육이었습니다.","s":2610.672,"e":2615.305,"p":true,"h":false},{"t":"하나님은 말로만 가르치지 않으시고 눈과 손과 코로 배우게 하셨습니다.","s":2616.216,"e":2621.053,"p":false,"h":false},{"t":"제사는 하나님이 이스라엘에게 베푸신 시청각 교육이었습니다.","s":2621.64,"e":2625.752,"p":false,"h":false},{"t":"이 교육이 무엇을 가르치려 했는지는 5장에서 말로 정리합니다.","s":2626.344,"e":2630.815,"p":true,"h":false},{"t":"제사의 다섯 가지 모습 (레 1~7장)","s":2631.72,"e":2635.562,"p":true,"h":false},{"t":"레위기 1~7장에는 다섯 가지 제사가 나옵니다.","s":2636.424,"e":2640.181,"p":false,"h":false},{"t":"이름이 낯설지만 각각 한 줄로 기억하시면 됩니다.","s":2640.792,"e":2644.372,"p":true,"h":false},{"t":"번제 (레 1장): 전부를 드리는 제사.","s":2645.208,"e":2648.694,"p":false,"h":false},{"t":"제물 전체를 제단에서 태워 올려 드립니다.","s":2649.288,"e":2652.104,"p":false,"h":false},{"t":"하나님께 나를 온전히 드린다는 뜻이고, 동시에 제물의 죽음으로 하나님께 받아들여지는(열납) 제사입니다.","s":2652.696,"e":2660.901,"p":false,"h":false},{"t":"다섯 제사 중 가장 기본이 되는 제사입니다.","s":2661.48,"e":2664.529,"p":true,"h":false},{"t":"소제 (레 2장): 감사의 예물.","s":2665.416,"e":2668.489,"p":false,"h":false},{"t":"곡식과 기름, 유향으로 드리는 제사로, 피를 흘리지 않습니다.","s":2669.064,"e":2673.826,"p":false,"h":false},{"t":"하나님이 주신 일용할 양식의 일부를 다시 하나님께 올려 드리며 \"이 모든 것이 주께서 주신 것입니다\"라고 감사하는 제사입니다.","s":2674.464,"e":2683.183,"p":true,"h":false},{"t":"화목제 (레 3장): 함께 먹는 식탁.","s":2684.04,"e":2687.583,"p":false,"h":false},{"t":"제물의 일부는 하나님께, 일부는 제사장에게, 나머지는 제물을 드린 사람이 가족과 함께 먹습니다.","s":2688.144,"e":2695.473,"p":false,"h":false},{"t":"하나님과 사람이 같은 식탁에 앉는 제사로, 평화와 교제를 나타냅니다.","s":2696.064,"e":2701.047,"p":true,"h":false},{"t":"속죄제 (레 4:1-5:13): 죄를 씻는 제사.","s":2701.92,"e":2707.052,"p":false,"h":false},{"t":"의도하지 않고 지은 죄(부지중에 지은 죄)와 정결하지 못한 상태를 씻는 제사입니다.","s":2707.608,"e":2714.132,"p":false,"h":false},{"t":"죄의 정도에 따라 제사장, 회중, 지도자, 일반 백성 순으로 제물이 달랐는데(레 4장), 책임이 무거울수록 더 큰 제물이었다는 점이 눈에 띕니다.","s":2714.784,"e":2727.513,"p":false,"h":false},{"t":"이 제사의 피는 성막 안쪽까지 들어가 성소를 정결하게 합니다.","s":2728.056,"e":2732.327,"p":true,"h":false},{"t":"속건제 (레 5:14-6:7): 갚는 제사.","s":2733.216,"e":2738.21,"p":false,"h":false},{"t":"하나님의 것이나 이웃의 것을 침해했을 때 드리는 제사입니다.","s":2738.832,"e":2742.878,"p":false,"h":false},{"t":"제물을 드리는 것 외에 피해를 입힌 만큼에 오분의 일을 더해 배상해야 했습니다.","s":2743.392,"e":2748.601,"p":false,"h":false},{"t":"죄가 이웃과의 관계에도 영향을 미치는 것이기 때문입니다.","s":2749.248,"e":2753.118,"p":true,"h":false},{"t":"이 다섯 제사는 크게 보면 두 방향으로 나뉩니다.","s":2753.952,"e":2757.492,"p":false,"h":false},{"t":"번제, 소제, 화목제는 이미 용서받은 사람이 하나님께 드리는 헌신, 감사, 교제의 제사입니다.","s":2758.104,"e":2766.595,"p":false,"h":false},{"t":"속죄제와 속건제는 죄의 문제를 해결하는 제사입니다.","s":2767.2,"e":2770.884,"p":false,"h":false},{"t":"신앙의 두 측면, 곧 \"죄 용서를 받는 것\"과 \"용서받은 자로서 하나님을 누리는 것\"이 모두 제사 안에 담겨 있었습니다.","s":2771.52,"e":2779.865,"p":true,"h":false},{"t":"제사를 돕는 사람들: 제사장","s":2780.76,"e":2783.515,"p":true,"h":false},{"t":"제사는 아무나 마음대로 드릴 수 없었습니다.","s":2784.36,"e":2787.496,"p":false,"h":false},{"t":"하나님은 아론과 그 자손을 제사장으로 세우셨습니다(레 8~10장).","s":2788.152,"e":2793.555,"p":false,"h":false},{"t":"제사장은 백성과 하나님 사이에 서서, 백성을 대표해 제물을 드리고 하나님의 뜻을 백성에게 전하는 중보자였습니다.","s":2794.176,"e":2801.958,"p":false,"h":false},{"t":"대제사장은 그중 으뜸으로, 가슴에 열두 지파의 이름이 새겨진 흉패를 달고 하나님 앞에 나갔습니다(출 28장).","s":2802.576,"e":2811.118,"p":false,"h":false},{"t":"백성 전체를 가슴에 품고 하나님 앞에 서는 모습입니다.","s":2811.432,"e":2815.094,"p":true,"h":false},{"t":"그런데 제사장 자신도 죄인이었습니다.","s":2815.944,"e":2818.779,"p":false,"h":false},{"t":"그래서 제사장은 백성을 위한 제사에 앞서 먼저 자신을 위한 제사를 드려야 했습니다(레 9:7, 16:6).","s":2819.088,"e":2827.968,"p":false,"h":false},{"t":"이 점이 6장에서 큰 의미를 갖게 됩니다.","s":2828.568,"e":2831.598,"p":true,"h":false},{"t":"모든 것이 모이는 날: 속죄일 (레 16장)","s":2832.48,"e":2836.833,"p":true,"h":false},{"t":"일 년에 한 번, 이 모든 제사가 한 날에 모입니다.","s":2837.688,"e":2841.332,"p":false,"h":false},{"t":"속죄일입니다.","s":2841.984,"e":2843.164,"p":false,"h":false},{"t":"대제사장은 이날 일반 제사장의 옷이 아닌 흰 세마포 옷을 입고, 먼저 자기와 가족을 위해 수송아지를 드립니다.","s":2843.856,"e":2851.765,"p":false,"h":false},{"t":"그다음 백성을 위해 두 마리의 숫염소를 취합니다(레 16:5-10).","s":2852.424,"e":2858.629,"p":true,"h":false},{"t":"한 마리는 여호와를 위한 염소로 잡아 그 피를 지성소로 가지고 들어가 속죄소 위에 뿌립니다.","s":2859.408,"e":2865.389,"p":false,"h":false},{"t":"1년에 한 번, 이 한 사람만이 들어가는 곳입니다.","s":2866.008,"e":2869.557,"p":false,"h":false},{"t":"피가 죄의 값을 치르는 것입니다.","s":2870.208,"e":2872.482,"p":true,"h":false},{"t":"다른 마리는 아사셀을 위한 염소입니다.","s":2873.376,"e":2876.146,"p":false,"h":false},{"t":"대제사장이 이 염소의 머리에 두 손을 얹고 이스라엘의 모든 죄를 고백하면, 그 죄가 염소에게 얹힌 것으로 여겨졌고, 염소는 사람이 살지 않는 광야로 보내졌습니다(레 16:21-22).","s":2876.688,"e":2891.418,"p":false,"h":false},{"t":"죄가 멀리 사라지는 모습입니다.","s":2891.904,"e":2894.184,"p":true,"h":false},{"t":"한 염소는 피를 흘려 죄의 값을 치르고, 다른 염소는 죄를 지고 광야로 떠납니다.","s":2895.072,"e":2900.818,"p":false,"h":false},{"t":"두 장면을 합치면 죄 값의 지불과 죄의 제거라는 용서의 두 측면이 완성됩니다.","s":2901.432,"e":2906.969,"p":false,"h":false},{"t":"하나님이 죄인을 용서하시는 방법이 이 한 날에 그림으로 담겨 있습니다.","s":2907.48,"e":2911.774,"p":true,"h":false},{"t":"그러나 반복되어야 했던 제사","s":2912.544,"e":2914.774,"p":true,"h":false},{"t":"제사는 은혜의 길이었지만, 한계도 분명했습니다.","s":2915.568,"e":2919.242,"p":false,"h":false},{"t":"속죄일은 매년 반복되었고, 일상의 죄에 대해서도 제사는 계속 드려야 했습니다.","s":2919.816,"e":2925.465,"p":false,"h":false},{"t":"히브리서는 이렇게 말합니다.","s":2926.08,"e":2928.124,"p":false,"h":false},{"t":"\"율법은 장차 오는 좋은 일의 그림자일 뿐이고 참 형상이 아니므로 해마다 늘 드리는 같은 제사로는 나아오는 사람들을 능히 온전하게 할 수 없느니라 ...","s":2928.432,"e":2937.466,"p":false,"h":false},{"t":"황소와 염소의 피가 능히 죄를 없이 하지 못함이라\"(히 10:1, 4).","s":2938.08,"e":2944.385,"p":true,"h":false},{"t":"1장에서 보았듯 경건한 구약 성도들도 이를 알았습니다.","s":2945.232,"e":2949.213,"p":false,"h":false},{"t":"제사를 드리고 용서의 기쁨을 누렸지만, 또 죄를 지으면 다시 가야 했습니다.","s":2949.84,"e":2955.311,"p":false,"h":false},{"t":"이 반복 속에서 \"이 짐승의 피보다 더 온전한 무엇이 있어야 하지 않을까\" 하는 기다림이 자랐습니다.","s":2955.936,"e":2962.935,"p":false,"h":false},{"t":"그리고 제사장도 죄인이었고, 흘리는 피도 짐승의 것이었으니 이 제도는 처음부터 더 나은 것을 가리키는 그림자였습니다.","s":2963.568,"e":2972.043,"p":true,"h":false},{"t":"제사의 길이 열려 있었다는 사실은 은혜입니다.","s":2972.904,"e":2975.991,"p":false,"h":false},{"t":"그러나 그 길이 반복되어야 했다는 사실은, 이 길이 도착지가 아니라 도착지를 가리키는 이정표였음을 말해 줍니다.","s":2976.624,"e":2984.219,"p":false,"h":false},{"t":"그 도착지가 6장의 이야기입니다.","s":2984.856,"e":2987.456,"p":true,"h":false},{"t":"낯선 용어 풀이","s":2988.312,"e":2989.662,"p":true,"h":false},{"t":"• 안수: 제물의 머리에 손을 얹는 행위.","s":2990.52,"e":2993.783,"p":false,"h":false},{"t":"제물이 나를 대신한다는 뜻을 나타냅니다.","s":2994.336,"e":2997.32,"p":true,"h":false},{"t":"• 번제: 제물 전체를 태워 드리는 제사.","s":2998.224,"e":3001.444,"p":false,"h":false},{"t":"전적인 헌신과 하나님께 받아들여짐을 뜻합니다.","s":3002.016,"e":3005.423,"p":true,"h":false},{"t":"• 소제: 곡식 가루와 기름 등으로 드리는 감사의 제사입니다.","s":3006.312,"e":3010.664,"p":true,"h":false},{"t":"• 화목제: 제물을 하나님, 제사장, 드린 사람이 함께 나누는 교제의 제사입니다.","s":3011.52,"e":3018.397,"p":true,"h":false},{"t":"• 속죄제: 죄와 부정을 씻는 제사입니다.","s":3019.296,"e":3022.625,"p":true,"h":false},{"t":"• 속건제: 죄로 끼친 손해를 배상하며 드리는 제사입니다.","s":3023.496,"e":3027.788,"p":true,"h":false},{"t":"• 속죄일: 매년 한 번, 대제사장이 지성소에 들어가 온 백성의 죄를 위해 속죄하는 날입니다(레 16장).","s":3028.632,"e":3037.55,"p":true,"h":false},{"t":"• 아사셀: 백성의 죄를 지고 광야로 보내지던 염소와 관련된 말로, 정확한 뜻에는 여러 견해가 있습니다.","s":3038.352,"e":3045.944,"p":true,"h":false},{"t":"• 중보자: 하나님과 사람 사이에 서서 둘을 이어 주는 사람입니다.","s":3046.824,"e":3051.519,"p":true,"h":false},{"t":"한 줄 요약","s":3052.392,"e":3053.355,"p":true,"h":false},{"t":"제사는 거룩하신 하나님이 죄인을 만나 주시려고 마련하신 은혜의 길이며, 안수와 피로 죄의 값이 대신 치러짐을 가르치지만, 반복되어야 했기에 더 온전한 제사를 가리키는 그림자였습니다.","s":3054.264,"e":3067.01,"p":true,"h":false},{"t":"함께 나눠 볼 질문","s":3067.8,"e":3069.329,"p":true,"h":false},{"t":"1.","s":3070.128,"e":3070.663,"p":false,"h":false},{"t":"제물의 머리에 손을 얹고 그 짐승이 죽는 것을 지켜보는 사람의 마음은 어땠을까?","s":3072,"e":3077.51,"p":true,"h":false},{"t":"2.","s":3078.408,"e":3078.693,"p":false,"h":false},{"t":"용서받는 제사(속죄제, 속건제)와 용서받은 자로서 하나님을 누리는 제사(번제, 소제, 화목제)는 내 신앙에서 각각 어떤 모습인가?","s":3079.008,"e":3092.24,"p":true,"h":false},{"t":"3.","s":3093.072,"e":3093.661,"p":false,"h":false},{"t":"해마다 반복되던 속죄일을 생각하면, 단번에 이루어진 십자가의 의미가 어떻게 새롭게 다가오는가?","s":3094.944,"e":3101.624,"p":true,"h":false},{"t":"목회자 노트 (4장)","s":3102.504,"e":3104.79,"p":true,"h":false},{"t":"이 구조는 개혁신학의 은혜언약 이해를 따른 것입니다.","s":3105.384,"e":3108.98,"p":true,"h":false},{"t":"1.","s":3109.848,"e":3110.383,"p":false,"h":false},{"t":"가르칠 때의 뼈대","s":3111.72,"e":3113.255,"p":true,"h":false},{"t":"제사를 \"하나님이 먼저 마련하신 은혜의 길\"로 시작하는 것이 이 장의 방법입니다(레 1:1).","s":3114.072,"e":3121.465,"p":false,"h":false},{"t":"제사는 인간이 신을 달래는 종교적 장치가 아니라, 언약의 하나님이 언약 백성에게 주신 접근의 방편입니다.","s":3121.752,"e":3129.098,"p":true,"h":false},{"t":"2.","s":3130.008,"e":3130.293,"p":false,"h":false},{"t":"대속의 문법","s":3130.608,"e":3131.79,"p":true,"h":false},{"t":"안수(전가)와 피(대리 죽음, 레 17:11)가 제사의 핵심입니다.","s":3132.576,"e":3141.611,"p":false,"h":false},{"t":"안수의 의미는 제사마다 논의가 있으나, 속죄일의 아사셀 염소(레 16:21)에서 죄 전가의 의미가 가장 분명합니다.","s":3142.248,"e":3152.431,"p":false,"h":false},{"t":"평신도 본문은 이 흐름을 따라 썼습니다.","s":3153.048,"e":3155.947,"p":true,"h":false},{"t":"3.","s":3156.792,"e":3157.381,"p":false,"h":false},{"t":"다섯 제사의 구조","s":3158.664,"e":3160.077,"p":true,"h":false},{"t":"번제·소제·화목제(자원하여 드리는 헌신, 감사, 교제)와 속죄제·속건제(죄 문제의 해결)의 이분 구조로 정리했습니다.","s":3160.8,"e":3173.143,"p":false,"h":false},{"t":"실제 제사 현장에서는 속죄제와 번제, 화목제가 함께 드려지는 경우가 많아 순서와 조합(속죄제 → 번제 → 화목제)에도 신학적 의미가 있다고 보는 견해가 있습니다(죄 해결 → 헌신 → 교제).","s":3173.736,"e":3187.215,"p":true,"h":false},{"t":"4.","s":3187.992,"e":3188.538,"p":false,"h":false},{"t":"속죄일과 아사셀","s":3189.864,"e":3191.369,"p":true,"h":false},{"t":"두 염소를 죄 값의 지불과 죄의 제거로 읽는 해석은 개혁파 전통에서 널리 쓰입니다.","s":3192.168,"e":3197.801,"p":false,"h":false},{"t":"다만 아사셀의 어원과 정체(광야의 지명, 제거를 뜻하는 말, 악한 영의 이름 등)에는 학계의 이견이 있어 본문에서는 단정하지 않았습니다.","s":3198.336,"e":3209.353,"p":false,"h":false},{"t":"두 염소를 하나의 속죄로 읽는 견해도 있습니다.","s":3209.928,"e":3213.021,"p":true,"h":false},{"t":"5.","s":3213.864,"e":3214.278,"p":false,"h":false},{"t":"제사의 효력과 한계","s":3215.736,"e":3217.354,"p":true,"h":false},{"t":"구약 제사의 효력을 어떻게 이해할지는 1장 목회자 노트의 틀(짐승의 피 자체에는 힘이 없고, 장차 올 그리스도의 대속에 근거한다)과 이어서 가르칩니다.","s":3217.992,"e":3229.947,"p":false,"h":false},{"t":"히 10:1-4과 롬 3:25(\"전에 지은 죄를 간과하심\")를 함께 보시기 바랍니다.","s":3230.592,"e":3238.638,"p":true,"h":false},{"t":"6.","s":3239.544,"e":3240.112,"p":false,"h":false},{"t":"6장과의 연결","s":3241.416,"e":3242.822,"p":true,"h":false},{"t":"제사장도 죄인이었다는 점, 제물이 짐승이었다는 점, 반복되어야 했다는 점이 6장에서 그리스도의 대제사장직과 단번의 제사로 성취됩니다(히 7~10장).","s":3243.528,"e":3255.446,"p":false,"h":false},{"t":"이 세 가지 한계를 메모해 두면 6장을 가르칠 때 구조가 쉽게 보입니다.","s":3255.816,"e":3260.799,"p":true,"h":false}]},{"title":"5장. 율법의 기준: 아무도 통과할 수 없는 수준","audio":"book_2611261521_2.mp3","start":0,"end":862.872,"dur":862.9,"segs":[{"t":"5장.","s":0,"e":0.72,"p":false,"h":false},{"t":"율법의 기준: 아무도 통과할 수 없는 수준","s":1.872,"e":5.194,"p":true,"h":false},{"t":"이 장의 자리","s":6,"e":7.067,"p":true,"h":false},{"t":"지금까지 우리는 거룩하신 하나님(2장), 스스로 부정을 씻을 수 없는 사람(3장), 하나님이 마련하신 제사의 길(4장)을 보았습니다.","s":7.92,"e":20.062,"p":false,"h":false},{"t":"이 장에서는 한 걸음 더 들어가, 율법이 사람에게 요구한 기준이 어느 수준이었는지, 그리고 하나님이 왜 그런 기준을 요구하셨는지 묻습니다.","s":20.712,"e":30.392,"p":false,"h":false},{"t":"이 질문에 정직하게 답해야 복음이 얼마나 큰 은혜인지 보입니다.","s":30.96,"e":35.34,"p":true,"h":false},{"t":"\"나는 그래도 괜찮게 살았다\"는 생각","s":36.24,"e":39.127,"p":true,"h":false},{"t":"많은 분들이 마음 한구석에 이런 생각을 품고 있습니다.","s":40.08,"e":43.847,"p":false,"h":false},{"t":"\"나는 살인도 안 했고, 도둑질도 안 했고, 남에게 크게 해를 끼친 적도 없다.","s":44.496,"e":50.127,"p":false,"h":false},{"t":"이만하면 괜찮지 않을까?\"","s":50.736,"e":52.528,"p":true,"h":false},{"t":"저는 일본에서 오랫동안 살았습니다.","s":53.4,"e":56.093,"p":false,"h":false},{"t":"그곳에서 만난 많은 분들은 정말 여간해서 잘못을 범하지 않았습니다.","s":56.664,"e":61.488,"p":false,"h":false},{"t":"일본 사회에서는 다른 사람의 시선을 의식하여 외적으로 바르게 행동하려는 경향이 강하게 나타납니다.","s":62.16,"e":69.029,"p":false,"h":false},{"t":"실제로 그들은 규칙을 잘 지키고 정직하며 친절합니다.","s":69.576,"e":73.395,"p":false,"h":false},{"t":"그러나 외적으로 드러나는 모습이 곧 그 사람의 내면을 보여 주는 것은 아닙니다.","s":73.968,"e":79.226,"p":false,"h":false},{"t":"사람은 그런 모습을 자기 자신의 전부라고 착각하며 살아가기도 합니다.","s":79.824,"e":84.316,"p":true,"h":false},{"t":"그런데 이것은 일본 분들만의 이야기가 아닙니다.","s":84.864,"e":88.281,"p":false,"h":false},{"t":"우리에게도 \"체면상\", \"예의상\", \"좋게 좋게\"라는 이름으로 마음의 죄를 덮어 두는 모습이 있습니다.","s":88.872,"e":96.139,"p":false,"h":false},{"t":"예수님이 \"살인하지 말라\"를 마음의 노여움으로, \"간음하지 말라\"를 마음의 음욕으로 풀어 주셨을 때 무너지는 것은 바로 이런 자기 확신입니다.","s":96.768,"e":105.712,"p":false,"h":false},{"t":"사람은 겉모습을 보지만 하나님은 중심을 보십니다(삼상 16:7).","s":106.344,"e":112.072,"p":false,"h":false},{"t":"이 기준 앞에서는 저도, 우리 모두도 같은 자리에 섭니다.","s":112.488,"e":116.656,"p":true,"h":false},{"t":"하나님은 왜 이렇게 높은 기준을 요구하실까요","s":117.504,"e":120.655,"p":true,"h":false},{"t":"여기서 마음에 걸리는 질문이 생깁니다.","s":121.536,"e":124.219,"p":false,"h":false},{"t":"실력도 없는 우리에게 하나님은 왜 이렇게 높은 기준을 요구하실까요?","s":124.848,"e":129.409,"p":false,"h":false},{"t":"덮어놓고 까다롭게 구시는 걸까요?","s":130.056,"e":132.509,"p":true,"h":false},{"t":"성경을 처음부터 따라가 보면 사연이 있습니다.","s":133.392,"e":136.634,"p":false,"h":false},{"t":"하나님은 사람을 자기 형상대로 지으셨습니다(창 1:27).","s":137.208,"e":142.701,"p":false,"h":false},{"t":"하나님을 알고, 사랑하고, 그분의 거룩을 닮아 사는 존재로 지으신 것입니다.","s":143.184,"e":148.745,"p":false,"h":false},{"t":"하나님이 보시기에 그 모습은 \"심히 좋았습니다\"(창 1:31).","s":149.376,"e":155.821,"p":false,"h":false},{"t":"율법이 요구하는 높은 기준은 새로 만든 규칙이 아니라, 사람이 본래 살도록 지어진 모습입니다.","s":156.264,"e":162.621,"p":true,"h":false},{"t":"그런데 사람은 죄로 타락했고, 그 본래의 자리에서 한참 떨어졌습니다.","s":163.536,"e":168.655,"p":false,"h":false},{"t":"더 안타까운 것은 떨어진 줄도 모른다는 것입니다.","s":169.32,"e":172.764,"p":false,"h":false},{"t":"평생 어두운 방에서 산 사람은 그 어둠을 당연하게 여깁니다.","s":173.376,"e":177.522,"p":false,"h":false},{"t":"타락한 자리를 본래의 자리로 착각하며 살아가는 것입니다.","s":178.176,"e":181.821,"p":false,"h":false},{"t":"비참한 줄도 모르고 비참하게 사는 것이 가장 깊은 비참입니다.","s":182.352,"e":186.651,"p":true,"h":false},{"t":"그래서 하나님은 율법으로 기준을 보여 주십니다.","s":187.536,"e":190.771,"p":false,"h":false},{"t":"하나님이 본래 사람을 향해 품으신 계획과 비전이 무엇이었는지, 지금 우리가 거기서 얼마나 멀어져 있는지를 깨닫게 하시려는 것입니다.","s":191.4,"e":200.195,"p":false,"h":false},{"t":"성막과 제사도 같은 뜻이었습니다.","s":200.856,"e":203.388,"p":false,"h":false},{"t":"말로만 \"너는 죄인이다\" 하면 사람은 \"나는 괜찮다\"고 답하기에, 하나님은 피와 죽음과 닫힌 휘장을 눈으로 보게 하셨습니다.","s":203.712,"e":212.582,"p":false,"h":false},{"t":"하나님이 이스라엘에게 하신 일은 시청각 교육이었습니다.","s":213.24,"e":216.936,"p":true,"h":false},{"t":"하나님이 높은 기준을 세우신 것은 우리를 절망시키기 위해서가 아닙니다.","s":217.752,"e":222.471,"p":false,"h":false},{"t":"우리가 있어야 할 자리가 어디인지 알게 하시고, 스스로는 갈 수 없음을 깨달아 구원자를 찾게 하시려는 것입니다.","s":223.104,"e":230.703,"p":false,"h":false},{"t":"그리고 그 구원은 죄를 덮어 주는 데서 그치지 않고, 잃어버린 본래의 자리로 우리를 회복시키는 일입니다.","s":231.36,"e":238.54,"p":true,"h":false},{"t":"첫 번째 기준: 모든 것을, 항상","s":239.424,"e":243.104,"p":true,"h":false},{"t":"율법은 부분 점수를 인정하지 않았습니다.","s":243.888,"e":246.869,"p":true,"h":false},{"t":"\"이 율법책에 기록된 모든 일을 항상 행하지 아니하는 자는 저주 아래 있는 자라\"(갈 3:10, 신 27:26 인용)","s":247.68,"e":257.759,"p":true,"h":false},{"t":"\"누구든지 온 율법을 지키다가 그 하나를 범하면 모두 범한 자가 되나니\"(약 2:10)","s":258.384,"e":264.927,"p":true,"h":false},{"t":"학교에 비유하면, 한 과목만 낙제해도 졸업이 안 되는 학교입니다.","s":265.56,"e":270.268,"p":false,"h":false},{"t":"그것도 90점이 아니라 100점을, 한 학기가 아니라 평생 유지해야 합니다.","s":270.912,"e":276.184,"p":false,"h":false},{"t":"이 기준이 가혹해 보이는 것은, 우리가 이미 본래 자리에서 떨어져 있어 그 자리가 낯설기 때문입니다.","s":276.84,"e":283.725,"p":false,"h":false},{"t":"본래 지음 받은 모습으로 보면 이것은 당연한 설계도입니다.","s":284.352,"e":288.621,"p":true,"h":false},{"t":"두 번째 기준: 행동이 아니라 마음까지","s":289.512,"e":292.693,"p":true,"h":false},{"t":"율법이 요구한 것은 겉으로 드러나는 행동만이 아니었습니다.","s":293.544,"e":297.465,"p":false,"h":false},{"t":"십계명의 마지막 계명은 마음을 다룹니다.","s":298.128,"e":300.927,"p":false,"h":false},{"t":"\"네 이웃의 집을 탐내지 말라\"(출 20:17).","s":301.56,"e":306.236,"p":false,"h":false},{"t":"탐내는 것은 아무도 볼 수 없는 마음속의 일입니다.","s":306.744,"e":310.104,"p":false,"h":false},{"t":"율법은 처음부터 마음의 문제를 겨냥하고 있었습니다.","s":310.656,"e":314.286,"p":true,"h":false},{"t":"예수님은 이 깊이를 산상수훈에서 분명하게 풀어 주셨습니다(마 5장).","s":315.168,"e":321.146,"p":true,"h":false},{"t":"• \"살인하지 말라\"는 계명은 형제에게 노하는 마음까지 다룹니다(마 5:21-22).","s":321.936,"e":329.221,"p":true,"h":false},{"t":"• \"간음하지 말라\"는 계명은 음욕을 품고 바라보는 것까지 다룹니다(마 5:27-28).","s":330.048,"e":337.729,"p":true,"h":false},{"t":"예수님은 율법을 더 엄격하게 바꾸신 것이 아니라, 율법이 원래 요구하던 깊이를 드러내신 것입니다.","s":338.472,"e":345.418,"p":false,"h":false},{"t":"그리고 이렇게 말씀하십니다.","s":346.08,"e":348.135,"p":false,"h":false},{"t":"\"그러므로 너희 하늘 아버지의 온전하심 같이 너희도 온전하라\"(마 5:48).","s":348.672,"e":355.165,"p":false,"h":false},{"t":"기준은 하나님의 온전하심, 곧 사람이 본래 닮도록 지음 받은 그 모습입니다.","s":355.704,"e":361.446,"p":true,"h":false},{"t":"세 번째 기준: 가장 큰 계명","s":362.328,"e":365.134,"p":true,"h":false},{"t":"예수님은 율법 전체를 두 문장으로 요약하셨습니다.","s":365.88,"e":369.405,"p":true,"h":false},{"t":"\"네 마음을 다하고 목숨을 다하고 뜻을 다하여 주 너의 하나님을 사랑하라 ...","s":370.296,"e":374.832,"p":false,"h":false},{"t":"네 이웃을 네 자신같이 사랑하라\"(마 22:37-39)","s":375.432,"e":381.374,"p":true,"h":false},{"t":"여기서 질문을 던져 보십시오.","s":381.816,"e":384.068,"p":false,"h":false},{"t":"나는 오늘 하루, 마음과 목숨과 뜻을 다해 하나님을 사랑했는가?","s":384.672,"e":389.242,"p":false,"h":false},{"t":"나는 나 자신을 대하듯 이웃을 대했는가?","s":389.88,"e":392.691,"p":false,"h":false},{"t":"정직하게 답하면 누구도 \"예\"라고 할 수 없습니다.","s":393.312,"e":396.757,"p":false,"h":false},{"t":"이것이 하나님이 사람을 지으신 본래 목적이었기에, 우리의 현주소가 얼마나 멀리 떨어져 있는지가 이 질문에서 드러납니다.","s":397.392,"e":405.411,"p":true,"h":false},{"t":"거울로서의 율법","s":406.248,"e":407.784,"p":true,"h":false},{"t":"이렇게 보면 율법은 구원받기 위해 올라가는 사다리가 아니라 자신의 모습을 비춰 주는 거울입니다.","s":408.672,"e":415.014,"p":false,"h":false},{"t":"거울 앞에 서면 얼굴의 얼룩이 보입니다.","s":415.68,"e":418.445,"p":false,"h":false},{"t":"그런데 거울이 그 얼룩을 닦아 주지는 못합니다.","s":419.064,"e":422.399,"p":false,"h":false},{"t":"바울은 \"율법으로는 죄를 깨닫느니라\"(롬 3:20)고 했고, 그 결과를 \"모든 입을 막고 온 세상으로 하나님의 심판 아래에 있게 하려 함\"(롬 3:19)이라고 요약합니다.","s":422.952,"e":437.142,"p":false,"h":false},{"t":"변명하던 입이 닫히고, 모두가 같은 자리에 서게 됩니다.","s":437.76,"e":441.812,"p":true,"h":false},{"t":"그러면 율법은 절망만 주는가?","s":442.704,"e":444.812,"p":true,"h":false},{"t":"여기서 이 장이 멈추면 절망뿐입니다.","s":445.68,"e":448.439,"p":false,"h":false},{"t":"하지만 성경은 이 지점에서 방향을 돌립니다.","s":449.04,"e":452.202,"p":true,"h":false},{"t":"\"이러므로 율법이 우리를 그리스도에게로 인도하는 몽학선생이 되어 우리로 하여금 믿음으로 말미암아 의롭다 하심을 얻게 하려 함이라\"(갈 3:24)","s":453.048,"e":463.565,"p":true,"h":false},{"t":"몽학선생은 옛날 부유한 집에서 아이를 학교까지 데려다주던 보호자를 가리키는 말입니다.","s":464.28,"e":470.091,"p":false,"h":false},{"t":"아이를 가르치는 선생이 아니라, 선생에게 데려다주는 안내자입니다.","s":470.736,"e":475.394,"p":false,"h":false},{"t":"율법이 하는 일이 바로 이것입니다.","s":476.016,"e":478.511,"p":false,"h":false},{"t":"\"너는 스스로 할 수 없다.","s":479.112,"e":480.928,"p":false,"h":false},{"t":"그러니 구원자에게 가라\"고 가리키는 손가락입니다.","s":481.224,"e":484.557,"p":true,"h":false},{"t":"엑스레이는 뼈가 부러진 것을 정확히 보여 주지만 뼈를 붙여 주지는 못합니다.","s":485.448,"e":490.057,"p":false,"h":false},{"t":"그렇다고 쓸모없는 것은 아닙니다.","s":490.68,"e":493.054,"p":false,"h":false},{"t":"진단이 정확해야 치료가 시작됩니다.","s":493.344,"e":496,"p":false,"h":false},{"t":"율법의 진단서 마지막 줄에는 이렇게 적혀 있었습니다.","s":496.608,"e":500.39,"p":false,"h":false},{"t":"\"스스로 고칠 수 없음.","s":501.024,"e":502.716,"p":false,"h":false},{"t":"구원자가 필요함.\"","s":503.328,"e":504.789,"p":false,"h":false},{"t":"그분이 누구신지는 6장에서 만나게 됩니다.","s":505.344,"e":508.379,"p":true,"h":false},{"t":"이 장을 마치며","s":509.208,"e":510.475,"p":true,"h":false},{"t":"거울 앞에서 자기 모습을 직시한 사람은 두 갈래 길 앞에 섭니다.","s":511.152,"e":515.699,"p":false,"h":false},{"t":"거울을 깨 버리고 외면하거나, 구원자를 찾아 나서거나.","s":516.288,"e":520.121,"p":false,"h":false},{"t":"경건했던 구약 성도들이 \"주께서 죄악을 살피신다면 누가 서리이까\"(시 130:3)라고 고백하며 제사를 사모했던 것은 후자의 길이었습니다.","s":520.776,"e":531.679,"p":false,"h":false},{"t":"이들이 기다렸던 분이 6장에서 오십니다.","s":532.296,"e":535.238,"p":true,"h":false},{"t":"낯선 용어 풀이","s":536.064,"e":537.414,"p":true,"h":false},{"t":"• 하나님의 형상: 하나님이 사람을 지으실 때 주신 본래의 모습.","s":538.272,"e":542.701,"p":false,"h":false},{"t":"하나님을 알고 사랑하며 그분의 거룩을 닮아 사는 존재로 지음 받았음을 뜻합니다.","s":543.168,"e":548.561,"p":true,"h":false},{"t":"• 타락: 사람이 죄를 지어 하나님이 지으신 본래의 자리에서 떨어진 일입니다.","s":549.336,"e":554.355,"p":true,"h":false},{"t":"• 혼네와 타테마에: 일본 문화에서 속마음(혼네)과 겉으로 보이는 모습(타테마에)을 구별하는 처신을 이르는 말입니다.","s":555.192,"e":565.15,"p":true,"h":false},{"t":"• 저주: 율법을 어긴 자에게 선언된 하나님의 심판을 뜻합니다(신 27:26).","s":566.016,"e":573.075,"p":true,"h":false},{"t":"• 산상수훈: 예수님이 산에서 가르치신 가르침(마 5~7장)으로, 율법의 깊은 뜻을 풀어 주신 말씀입니다.","s":573.84,"e":583.823,"p":true,"h":false},{"t":"• 몽학선생: 아이를 학교에 데려다주던 보호자.","s":584.736,"e":588.405,"p":false,"h":false},{"t":"율법이 우리를 그리스도께 인도하는 역할을 가리킵니다.","s":589.032,"e":592.479,"p":true,"h":false},{"t":"• 의롭다 하심(칭의): 하나님이 죄인을 의로운 자로 인정해 주시는 것입니다.","s":593.328,"e":598.561,"p":false,"h":false},{"t":"행위가 아니라 믿음으로 받습니다.","s":599.208,"e":601.525,"p":true,"h":false},{"t":"한 줄 요약","s":602.4,"e":603.363,"p":true,"h":false},{"t":"율법의 높은 기준은 하나님이 까다로우셔서가 아니라, 사람이 본래 지음 받은 자리와 타락한 우리의 현주소를 보게 하려는 것이며, 그래서 율법은 우리를 구원자께로 인도합니다.","s":604.272,"e":615.456,"p":true,"h":false},{"t":"함께 나눠 볼 질문","s":616.368,"e":617.897,"p":true,"h":false},{"t":"1.","s":618.696,"e":619.231,"p":false,"h":false},{"t":"\"나는 그래도 괜찮게 살았다\"는 생각이 내 안에 있었다면, 산상수훈의 말씀 앞에서 어떻게 달라지는가?","s":620.568,"e":627.33,"p":true,"h":false},{"t":"2.","s":628.2,"e":628.485,"p":false,"h":false},{"t":"나는 \"예의상\", \"체면상\"이라는 이름으로 덮어 둔 거짓이 없는가?","s":628.8,"e":633.394,"p":true,"h":false},{"t":"3.","s":634.272,"e":634.861,"p":false,"h":false},{"t":"타락한 자리를 본래의 자리로 착각하며 살았던 모습이 내게도 있는가?","s":636.144,"e":640.467,"p":true,"h":false},{"t":"4.","s":641.352,"e":641.898,"p":false,"h":false},{"t":"율법이 거울이지 사다리가 아니라는 것을 알게 되면, 구원받기 위해 애쓰던 마음에 어떤 변화가 생기는가?","s":643.224,"e":649.836,"p":true,"h":false},{"t":"목회자 노트 (5장)","s":650.712,"e":653.047,"p":true,"h":false},{"t":"이 구조는 개혁신학의 은혜언약 이해를 따른 것입니다.","s":653.664,"e":657.26,"p":true,"h":false},{"t":"1.","s":658.128,"e":658.663,"p":false,"h":false},{"t":"가르칠 때의 뼈대","s":660,"e":661.535,"p":true,"h":false},{"t":"\"왜 이런 기준인가\"(창조 목적)에서 시작해, 율법 요구의 세 층위(전체성과 항상성, 내면성, 사랑의 총체성)로 자기 의를 해체하고, 몽학선생으로 복음에 연결하는 구조입니다.","s":662.352,"e":678.775,"p":false,"h":false},{"t":"일본 현장 예화는 \"착하게 살았다\"는 자기 확신이 죄를 죄로 보지 못하게 하는 실례입니다.","s":679.128,"e":685.188,"p":true,"h":false},{"t":"2.","s":686.088,"e":686.373,"p":false,"h":false},{"t":"창조 목적(하나님의 형상)과 율법의 요구","s":686.688,"e":691.32,"p":true,"h":false},{"t":"율법의 요구는 임의의 기준이 아니라 하나님의 형상으로 지음 받은 인간의 본래 모습을 드러냅니다(창 1:26-27, 엡 4:24, 골 3:10).","s":692.112,"e":705.859,"p":false,"h":false},{"t":"웨스트민스터 소요리문답 1문과 연결해 가르칠 수 있고, 타락 전 행위언약 개념과도 맞닿아 있습니다.","s":706.368,"e":713.225,"p":false,"h":false},{"t":"다만 행위언약의 이해는 교단과 신학자마다 표현이 다르므로 본문에는 용어를 쓰지 않았습니다.","s":713.856,"e":720.026,"p":false,"h":false},{"t":"타락한 자리를 본래 자리로 착각하는 상태는 마음의 어두워짐(롬 1:21, 엡 4:18)과 연결됩니다.","s":720.648,"e":730.602,"p":true,"h":false},{"t":"3.","s":731.472,"e":732.061,"p":false,"h":false},{"t":"예화의 사용 주의","s":733.344,"e":734.725,"p":true,"h":false},{"t":"예의와 배려 자체를 비판하는 것이 아니라, 거짓을 덕목의 이름으로 덮는 구조를 짚는 예화입니다.","s":735.6,"e":742.318,"p":false,"h":false},{"t":"연결 구절은 마 23:25-28(겉은 깨끗한 잔), 엡 4:25(거짓을 버리고 참된 것을 말하라)입니다.","s":742.92,"e":754.49,"p":false,"h":false},{"t":"특정 민족을 평가하는 글로 읽히지 않도록 마지막 단락에서 \"우리에게도 같은 모습이 있다\"로 돌립니다.","s":755.112,"e":761.786,"p":false,"h":false},{"t":"죄는 진실의 일부를 입은 변명으로 자신을 정당화합니다.","s":762.408,"e":766.304,"p":false,"h":false},{"t":"배려라는 선한 동기가 실제로는 자기 보호와 거짓을 덮는 경우를 분별하도록 가르칩니다(창 3:1, 마 23:25-28, 엡 4:25).","s":766.896,"e":779.832,"p":true,"h":false},{"t":"4.","s":780.672,"e":781.218,"p":false,"h":false},{"t":"제사는 시청각 교육","s":782.544,"e":784.22,"p":true,"h":false},{"t":"성막과 제사는 죄와 거룩의 거리를 보이고 만지고 느끼게 하는 계시의 교육 방식이었습니다.","s":785.064,"e":790.959,"p":true,"h":false},{"t":"5.","s":791.856,"e":792.27,"p":false,"h":false},{"t":"율법의 삼중 용도","s":793.728,"e":795.335,"p":true,"h":false},{"t":"이 장은 주로 제1용도(거울, 롬 3:20, 7:7)를 다룹니다.","s":796.08,"e":803.844,"p":false,"h":false},{"t":"제3용도(성도의 삶의 규범)는 7장에서, 제2용도(시민적 용도)는 부록에서 정리할 수 있습니다.","s":804.456,"e":814.152,"p":true,"h":false},{"t":"6.","s":815.016,"e":815.584,"p":false,"h":false},{"t":"마태복음 5장의 해석","s":816.888,"e":818.706,"p":true,"h":false},{"t":"예수님이 율법을 강화하셨다기보다 율법 본래의 깊이를 드러내셨다는 이해를 따랐습니다.","s":819.504,"e":825.474,"p":true,"h":false},{"t":"7.","s":826.344,"e":826.992,"p":false,"h":false},{"t":"갈 3:24의 \"몽학선생\"","s":828.216,"e":831.291,"p":true,"h":false},{"t":"헬라어 파이다고고스(paidagogos)는 교사가 아니라 아이를 학교로 인도하는 보호자입니다.","s":831.888,"e":839.382,"p":true,"h":false},{"t":"8.","s":840.216,"e":840.76,"p":false,"h":false},{"t":"주의할 점","s":842.088,"e":843.093,"p":true,"h":false},{"t":"이 장이 자기 정죄나 절망으로 끝나지 않도록 마지막에 복음 쪽으로 방향을 돌리는 구조를 유지해야 합니다.","s":843.96,"e":850.317,"p":false,"h":false},{"t":"거울의 기능만 강조하면 율법을 부정적으로만 보게 되므로, 1장의 율법의 선함(시 119편)과 7장의 제3용도를 함께 기억하도록 합니다.","s":850.92,"e":861.999,"p":true,"h":false}]},{"title":"6장. 그림자에서 실체로: 복음","audio":"book_2611261521_2.mp3","start":862.872,"end":2188.824,"dur":1326,"segs":[{"t":"6장.","s":862.872,"e":863.706,"p":false,"h":false},{"t":"그림자에서 실체로: 복음","s":864.744,"e":867.336,"p":true,"h":false},{"t":"기다림이 응답받은 날","s":868.08,"e":869.833,"p":true,"h":false},{"t":"1장
