false,"h":false},{"t":"그리스도는 피로 죄 값을 지불하셨고(롬 3:25), 우리 죄를 우리에게서 제거하셨습니다.","s":1258.632,"e":1265.964,"p":false,"h":false},{"t":"\"동이 서에서 먼 것같이 우리의 죄과를 우리에게서 멀리 옮기셨으며\"(시 103:12).","s":1266.6,"e":1273.268,"p":true,"h":false},{"t":"더 나은 대제사장.","s":1274.088,"e":1275.58,"p":false,"h":false},{"t":"4장에서 제사장에게는 한계가 있었습니다.","s":1276.176,"e":1279.122,"p":false,"h":false},{"t":"그도 죄인이어서 먼저 자기를 위해 제사를 드려야 했고, 죽음으로 직분이 끊겼습니다.","s":1279.752,"e":1285.535,"p":false,"h":false},{"t":"그리스도는 죄가 없으시고(히 7:26-27), 영원히 계시며(히 7:24), 우리의 연약함을 아십니다(히 4:15).","s":1286.16,"e":1299.034,"p":false,"h":false},{"t":"그리고 다른 짐승이 아니라 자기 자신을 제물로 드리셨습니다.","s":1299.504,"e":1303.641,"p":false,"h":false},{"t":"제사장이 곧 제물이십니다.","s":1304.256,"e":1306.246,"p":true,"h":false},{"t":"짐승의 피를 넘어서.","s":1307.112,"e":1308.658,"p":false,"h":false},{"t":"짐승의 피는 죄를 없앨 수 없었지만(히 10:4), \"하물며 영원하신 성령으로 말미암아 흠 없는 자기를 하나님께 드린 그리스도의 피가 어찌 너희 양심을 죽은 행실에서 깨끗하게 하지 못하겠느냐\"(히 9:14).","s":1309.128,"e":1324.372,"p":true,"h":false},{"t":"단번에.","s":1325.208,"e":1326.026,"p":false,"h":false},{"t":"해마다 반복되던 제사가 한 번으로 완성되었습니다.","s":1327.08,"e":1330.838,"p":false,"h":false},{"t":"\"자기의 피로 영원한 속죄를 이루사 단번에 성소에 들어가셨느니라\"(히 9:12).","s":1331.136,"e":1337.118,"p":false,"h":false},{"t":"\"예수 그리스도의 몸을 단번에 드리심으로 말미암아 우리가 거룩함을 얻었노라\"(히 10:10).","s":1337.736,"e":1344.716,"p":false,"h":false},{"t":"그래서 십자가 위에서 \"다 이루었다\"(요 19:30)고 하셨습니다.","s":1345.32,"e":1352.647,"p":false,"h":false},{"t":"더 보탤 것도, 반복할 것도 없습니다.","s":1353.312,"e":1356.71,"p":true,"h":false},{"t":"휘장이 찢어지다","s":1357.56,"e":1358.877,"p":true,"h":false},{"t":"예수님이 십자가에서 숨을 거두시던 순간, 이 모든 일을 보여 주는 사건이 있었습니다.","s":1359.744,"e":1365.686,"p":true,"h":false},{"t":"\"이에 성소 휘장이 위로부터 아래까지 찢어져 둘이 되고\"(마 27:51)","s":1366.56,"e":1372.779,"p":true,"h":false},{"t":"2장에서 보았던 지성소의 휘장입니다.","s":1373.424,"e":1376.056,"p":false,"h":false},{"t":"대제사장만, 1년에 한 번, 피를 가지고서만 들어갈 수 있던 곳을 가로막던 휘장이 찢어졌습니다.","s":1376.664,"e":1383.618,"p":false,"h":false},{"t":"위로부터 아래로라는 점이 중요합니다.","s":1384.272,"e":1386.82,"p":false,"h":false},{"t":"사람이 뚫은 것이 아니라 하나님이 열어 주신 길입니다.","s":1387.416,"e":1390.81,"p":true,"h":false},{"t":"\"그러므로 형제들아 우리가 예수의 피를 힘입어 성소에 들어갈 담력을 얻었나니 그 길은 우리를 위하여 휘장 곧 자기 육체를 통해 열어 놓으신 새로운 살 길이요\"(히 10:19-20)","s":1391.664,"e":1404.508,"p":true,"h":false},{"t":"2장의 \"거룩하시지만 가까이 거하기를 원하시는 하나님\"이라는 이중성이 마침내 풀렸습니다.","s":1405.248,"e":1411.219,"p":false,"h":false},{"t":"거룩은 그대로이고, 가까이 가는 길이 열렸습니다.","s":1411.848,"e":1415.696,"p":true,"h":false},{"t":"3장에서 부정이 옮아가던 방향이 거꾸로 돌려진다고 했던 것도 여기서 완성됩니다.","s":1416.576,"e":1422.032,"p":false,"h":false},{"t":"우리의 죄와 부정이 그분께 옮겨지고, 그분의 의와 정결이 우리에게 옮겨졌습니다.","s":1422.6,"e":1428.492,"p":false,"h":false},{"t":"음식 규례가 만들던 구별의 벽도 그리스도 안에서 무너져 이방인에게 복음이 열렸습니다(행 10장).","s":1429.128,"e":1436.794,"p":false,"h":false},{"t":"구별의 목적, 곧 하나님께 속한 거룩한 백성이라는 정체성은 폐해진 것이 아니라 그리스도 안에서 성취되었습니다.","s":1437.216,"e":1445.36,"p":true,"h":false},{"t":"(십자가에서 길이 열렸습니다.","s":1446.264,"e":1448.423,"p":false,"h":false},{"t":"그러나 복음은 여기서 끝나지 않습니다.)","s":1449.072,"e":1451.829,"p":true,"h":false},{"t":"부활: 하나님이 \"아멘\" 하셨습니다","s":1452.624,"e":1455.548,"p":true,"h":false},{"t":"십자가만 있고 부활이 없으면 복음이 완성되지 않습니다.","s":1456.44,"e":1460.364,"p":false,"h":false},{"t":"\"그리스도께서 만일 다시 살아나신 일이 없으면 우리의 전파하는 것도 헛것이요 또 너희 믿음도 헛것이며 너희가 여전히 죄 가운데 있으리라\"(고전 15:14, 17).","s":1460.976,"e":1473.98,"p":false,"h":false},{"t":"부활은 세 가지를 확증합니다.","s":1474.488,"e":1476.497,"p":true,"h":false},{"t":"속죄가 받아들여졌습니다.","s":1477.368,"e":1479.277,"p":false,"h":false},{"t":"\"예수는 우리 범죄함을 위하여 내줌이 되고 또한 우리를 의롭다 하시기 위하여 살아나셨느니라\"(롬 4:25).","s":1479.6,"e":1487.847,"p":false,"h":false},{"t":"아버지가 아들의 제사를 받으셨다는 응답입니다.","s":1488.408,"e":1491.712,"p":true,"h":false},{"t":"죽음이 깨졌습니다.","s":1492.536,"e":1493.992,"p":false,"h":false},{"t":"3장에서 본 부정과 부패의 뿌리는 죽음이었습니다.","s":1494.624,"e":1498.131,"p":false,"h":false},{"t":"그 죽음이 이겨졌습니다(고전 15:55-57).","s":1498.728,"e":1504.285,"p":false,"h":false},{"t":"정결법이 가리키던 생명의 하나님이 죽음을 이기셨습니다.","s":1504.752,"e":1508.671,"p":true,"h":false},{"t":"새 생명이 시작되었습니다.","s":1509.528,"e":1511.461,"p":false,"h":false},{"t":"그분의 부활은 우리 부활의 첫 열매이고(고전 15:20), 우리도 그분과 함께 새 생명 가운데 행하게 됩니다(롬 6:4).","s":1512.048,"e":1522.68,"p":false,"h":false},{"t":"이것이 7장으로 이어지는 다리입니다.","s":1523.28,"e":1525.964,"p":true,"h":false},{"t":"승천: 지금도 우리를 위해 서 계신 대제사장","s":1526.808,"e":1530.624,"p":true,"h":false},{"t":"부활하신 그리스도는 제자들에게 나타나신 뒤 하늘로 올라가셨습니다(행 1:9-11).","s":1531.128,"e":1538.229,"p":false,"h":false},{"t":"승천은 구원 이야기의 여운이 아니라 속죄일의 마지막 장면입니다.","s":1538.688,"e":1543.288,"p":false,"h":false},{"t":"4장에서 대제사장은 피를 가지고 지성소에 들어가 하나님 앞에 섰습니다.","s":1543.92,"e":1549.044,"p":false,"h":false},{"t":"그리스도도 손으로 지은 성소가 아니라 바로 그 하늘에 들어가셔서, 지금 우리를 위해 하나님 앞에 나타나 계십니다(히 9:24).","s":1549.68,"e":1559.356,"p":false,"h":false},{"t":"해마다 들어가야 했던 제사장과 달리, 그분은 단번의 제사를 드리신 뒤 영원히 살아 계셔서 우리를 위해 간구하십니다(히 7:25, 롬 8:34).","s":1559.904,"e":1572.138,"p":true,"h":false},{"t":"그래서 우리가 서 있는 자리는 우리의 결심이 아니라 그분의 간구 위에 있습니다.","s":1572.96,"e":1578.211,"p":false,"h":false},{"t":"5장의 거울 앞에서 넘어질 때에도, 우리에게는 아버지 앞에서 변호해 주시는 분이 계십니다(요일 2:1).","s":1578.864,"e":1587.008,"p":true,"h":false},{"t":"왜 은혜인가","s":1587.816,"e":1589.027,"p":true,"h":false},{"t":"여기서 한 가지 질문이 남습니다.","s":1589.904,"e":1592.346,"p":false,"h":false},{"t":"하나님은 왜 하필 은혜의 방법으로 구원하셨을까요?","s":1592.928,"e":1596.413,"p":true,"h":false},{"t":"은혜 말고는 길이 없었습니다.","s":1597.32,"e":1599.592,"p":false,"h":false},{"t":"5장의 진단대로 우리에게는 내밀 것이 없었습니다.","s":1600.224,"e":1603.844,"p":false,"h":false},{"t":"\"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라\"(엡 2:8-9).","s":1604.496,"e":1618.408,"p":true,"h":false},{"t":"그러나 은혜는 마지못해 택하신 길이 아니었습니다.","s":1619.28,"e":1622.622,"p":false,"h":false},{"t":"하나님이 구원하시는 궁극적인 목적은 그분의 영광이며, 그 영광은 우리가 그분을 즐거워할 때 가장 크게 드러납니다.","s":1623.168,"e":1631.397,"p":false,"h":false},{"t":"행위로 얻는 구원은 평생 점수를 계산하며 사는 긴장이 됩니다.","s":1631.952,"e":1636.285,"p":false,"h":false},{"t":"그러나 은혜로 받은 구원은 하나님이 다 이루어 놓으시고 \"여기 와서 마음껏 즐기라\"고 하시는 초청입니다.","s":1636.944,"e":1643.701,"p":false,"h":false},{"t":"탕자가 돌아왔을 때 아버지는 조건을 따지지 않고 가락지를 끼우고 잔치를 차리셨습니다(눅 15:22-24).","s":1644.336,"e":1653.696,"p":false,"h":false},{"t":"구원은 그 잔치로의 초청입니다.","s":1654.176,"e":1656.674,"p":true,"h":false},{"t":"이것은 처음부터 하나님의 뜻이었습니다.","s":1657.536,"e":1660.357,"p":false,"h":false},{"t":"삼위 하나님은 영원 전부터 서로 사랑하며 더할 나위 없이 만족하셨습니다(요 17:24).","s":1660.656,"e":1668.33,"p":false,"h":false},{"t":"그 충만한 사랑과 기쁨을 더 풍성하게 나누시려고 사람을 지으셨고, 그 사람의 기쁨을 위해 우주 만물을 지으셨습니다.","s":1668.72,"e":1677.07,"p":false,"h":false},{"t":"땅을 정복하고 다스리라는 아담에게 주신 명령도 짐이 아니라 누림이었습니다(창 1:28-29).","s":1677.696,"e":1685.989,"p":false,"h":false},{"t":"사람이 지음 받은 목적도 마찬가지입니다.","s":1686.48,"e":1689.299,"p":false,"h":false},{"t":"\"사람의 제일 되는 목적은 하나님을 영화롭게 하며 그를 영원토록 즐거워하는 것\"(웨스트민스터 소요리문답 1문)이라고 고백합니다.","s":1689.912,"e":1699.357,"p":false,"h":false},{"t":"\"주의 앞에는 충만한 기쁨이 있고\"(시 16:11).","s":1699.992,"e":1704.29,"p":true,"h":false},{"t":"이 즐거움은 값이 없어서 가능한 것이 아닙니다.","s":1705.032,"e":1708.326,"p":false,"h":false},{"t":"부담이 없는 것은 값을 이미 그분이 다 치르셨기 때문입니다.","s":1708.92,"e":1713.228,"p":false,"h":false},{"t":"로마서 5:8은 말합니다.","s":1713.888,"e":1716.205,"p":false,"h":false},{"t":"\"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라.\"","s":1716.816,"e":1724.719,"p":false,"h":false},{"t":"우리가 변한 뒤가 아니라 아직 원수였을 때 먼저 사랑하셨습니다.","s":1725.384,"e":1729.746,"p":false,"h":false},{"t":"십자가에서 하나님은 \"자기도 의로우시며 또한 예수 믿는 자를 의롭다 하시는 이\"(롬 3:26)가 되셨습니다.","s":1730.4,"e":1739.595,"p":false,"h":false},{"t":"거룩은 한 치도 줄지 않았고, 사랑은 가장 크게 드러났습니다.","s":1740.24,"e":1744.682,"p":false,"h":false},{"t":"2장의 거룩하신 하나님과 가까이 거하기를 원하시는 하나님이 십자가에서 하나로 만났습니다.","s":1745.304,"e":1751.035,"p":true,"h":false},{"t":"그래서 은혜로 구원받은 사람에게 순종은 다른 것이 됩니다.","s":1751.904,"e":1755.886,"p":false,"h":false},{"t":"율법의 요구가 줄어든 것이 아닙니다.","s":1756.392,"e":1758.85,"p":false,"h":false},{"t":"그 요구는 그리스도께서 이미 이루셨고, 우리는 이루어 놓으신 구원 위에 서서 살아갑니다.","s":1759.416,"e":1765.875,"p":false,"h":false},{"t":"구원받기 위해 채워야 하는 점수가 아니라, 이미 받은 구원 안에서 하나님을 즐거워하며 걷는 길이 된 것입니다.","s":1766.496,"e":1773.554,"p":false,"h":false},{"t":"아담에게 주신 땅을 다스리라는 명령이 짐이 아니라 누림이었듯, 하나님의 명령을 따르는 일도 무거운 책임이 아니라 즐거운 순종이 됩니다.","s":1774.2,"e":1782.932,"p":false,"h":false},{"t":"\"그의 계명들은 무겁지 아니하니라\"(요일 5:3).","s":1783.488,"e":1787.889,"p":false,"h":false},{"t":"\"우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라\"(요일 4:19).","s":1788.408,"e":1793.939,"p":true,"h":false},{"t":"그림자에서 실체로","s":1794.792,"e":1796.392,"p":true,"h":false},{"t":"이제 지금까지의 대응을 한눈에 정리하겠습니다.","s":1796.976,"e":1800.157,"p":true,"h":false},{"t":"• 성막과 지성소는 그리스도 안에서 열린 하나님의 임재로","s":1800.984,"e":1804.931,"p":true,"h":false},{"t":"• 안수와 대속의 제물은 우리 죄를 지신 어린 양 예수님으로","s":1805.808,"e":1809.813,"p":true,"h":false},{"t":"• 해마다 반복되던 속죄일은 단번에 드려진 십자가의 제사로","s":1810.344,"e":1814.469,"p":true,"h":false},{"t":"• 죄 있는 대제사장은 영원하시고 흠 없으신 대제사장 예수님으로","s":1815.288,"e":1820.291,"p":true,"h":false},{"t":"• 율법이 요구한 완전한 의는 그리스도가 대신 이루신 의로","s":1821.168,"e":1825.265,"p":true,"h":false},{"t":"• 율법이 선언한 저주는 그리스도가 대신 받으신 저주로","s":1826.088,"e":1829.862,"p":true,"h":false},{"t":"• 찢어진 휘장은 하나님이 열어 주신 새로운 살 길로","s":1830.744,"e":1834.227,"p":true,"h":false},{"t":"• 죽음과 부정의 세상은 부활의 새 생명으로","s":1835.064,"e":1838.028,"p":true,"h":false},{"t":"그림자는 사라지지 않고 실체 안에서 완성되었습니다.","s":1838.904,"e":1842.919,"p":false,"h":false},{"t":"이 복음은 \"너희가 율법을 다 지켰기에 구원받았다\"가 아니라 \"그분이 다 이루셨기에 은혜로 구원받았다\"고 선언합니다.","s":1843.536,"e":1851.823,"p":false,"h":false},{"t":"1장에서 구약 성도들이 약속을 믿어 구원받았듯, 우리도 이루어진 약속을 믿어 구원받습니다.","s":1852.464,"e":1859.004,"p":false,"h":false},{"t":"그들은 희미하게 보았고, 우리는 환하게 봅니다.","s":1859.64,"e":1863.21,"p":true,"h":false},{"t":"낯선 용어 풀이","s":1864.056,"e":1865.406,"p":true,"h":false},{"t":"• 속량: 몸값을 치르고 종을 풀어 주는 것.","s":1866.264,"e":1869.66,"p":false,"h":false},{"t":"그리스도께서 자기 피로 값을 치르고 죄의 종 되었던 우리를 자유롭게 하신 일입니다.","s":1870.152,"e":1875.672,"p":true,"h":false},{"t":"• 전가: 한 사람의 것이 다른 사람에게 옮겨져 계산되는 것.","s":1876.56,"e":1880.978,"p":false,"h":false},{"t":"우리의 죄가 그리스도께, 그리스도의 의가 우리에게 전가됩니다.","s":1881.456,"e":1886.111,"p":true,"h":false},{"t":"• 단번에: 한 번으로 완전하게.","s":1886.976,"e":1889.419,"p":false,"h":false},{"t":"반복할 필요가 없는 완성을 뜻합니다.","s":1889.88,"e":1892.601,"p":true,"h":false},{"t":"• 휘장: 성막과 성전에서 성소와 지성소를 갈라놓던 두꺼운 장막입니다.","s":1893.432,"e":1898.752,"p":true,"h":false},{"t":"• 체휼: 몸소 겪어 보고 깊이 공감함을 뜻합니다.","s":1899.648,"e":1903.755,"p":true,"h":false},{"t":"• 은혜: 받을 자격이 없는 자에게 값없이 주시는 하나님의 호의입니다.","s":1904.664,"e":1909.322,"p":true,"h":false},{"t":"한 줄 요약","s":1910.208,"e":1911.171,"p":true,"h":false},{"t":"하나님이 사람이 되어 낮은 자리에서 사시고, 율법을 이루시고, 저주를 대신 받으시고, 부활하심으로 길을 여셨으며, 이 모든 것을 은혜로 하신 것은 우리가 하나님을 마음껏 즐거워하게 하시려는 것입니다.","s":1912.08,"e":1926.341,"p":true,"h":false},{"t":"함께 나눠 볼 질문","s":1927.248,"e":1928.777,"p":true,"h":false},{"t":"1.","s":1929.576,"e":1930.111,"p":false,"h":false},{"t":"하나님이 우리 자리까지 내려와 멸시받는 삶을 사셨다는 사실은 나의 아픔과 어떻게 만나는가?","s":1931.448,"e":1937.454,"p":true,"h":false},{"t":"2.","s":1938.336,"e":1938.621,"p":false,"h":false},{"t":"시험을 대신 치러 만점을 받은 사람이 그 점수를 나에게 주었다면, 나는 그것을 어떻게 받아들이겠는가?","s":1938.936,"e":1945.808,"p":true,"h":false},{"t":"3.","s":1946.64,"e":1947.229,"p":false,"h":false},{"t":"나는 구원을 \"점수를 계산하는 긴장\"으로 받아들이고 있는가, \"차려진 잔치로의 초청\"으로 받아들이고 있는가?","s":1948.512,"e":1955.615,"p":true,"h":false},{"t":"4.","s":1956.504,"e":1957.05,"p":false,"h":false},{"t":"휘장이 위로부터 아래로 찢어졌다는 사실은 내가 하나님께 나아가는 방식에 어떤 변화를 주는가?","s":1958.376,"e":1964.278,"p":true,"h":false},{"t":"목회자 노트 (6장)","s":1965.168,"e":1967.375,"p":true,"h":false},{"t":"이 구조는 개혁신학의 은혜언약 이해를 따른 것입니다.","s":1968.216,"e":1971.812,"p":true,"h":false},{"t":"1.","s":1972.68,"e":1973.215,"p":false,"h":false},{"t":"가르칠 때의 뼈대","s":1974.552,"e":1976.087,"p":true,"h":false},{"t":"1~5장의 복선을 회수하는 장입니다.","s":1976.904,"e":1979.915,"p":false,"h":false},{"t":"4장의 제사의 세 한계(제사장도 죄인, 제물이 짐승, 반복)가 히 7장(더 나은 대제사장), 히 9:14(그리스도의 피), 히 9~10장(단번의 제사)에서 각각 성취됩니다.","s":1980.552,"e":2000.124,"p":false,"h":false},{"t":"성육신과 낮아지심, 십자가, 부활을 함께 다루어 복음이 법정적 계산으로만 읽히지 않도록 했습니다.","s":2000.76,"e":2008.431,"p":false,"h":false},{"t":"성경공부에서는 두 주로 나누어(성육신에서 휘장까지, 부활과 은혜) 가르칠 수도 있습니다.","s":2009.064,"e":2017.001,"p":true,"h":false},{"t":"2.","s":2017.896,"e":2018.181,"p":false,"h":false},{"t":"그리스도의 이중 순종","s":2018.496,"e":2020.211,"p":true,"h":false},{"t":"능동적 순종(율법의 요구를 이루심, 마 5:17, 롬 10:4)과 수동적 순종(저주와 죽음을 담당하심, 갈 3:13)이 함께 전가된다는 이해는 개혁신학의 전통입니다(웨스트민스터 신앙고백서 11장).","s":2020.752,"e":2041.881,"p":false,"h":false},{"t":"본문에서는 용어 없이 \"한평생의 순종\"으로 풀었습니다.","s":2042.208,"e":2046.127,"p":false,"h":false},{"t":"능동적 순종의 전가에 대해서는 신학자마다 이견이 있으니 교단 입장에 맞게 가르치시기 바랍니다.","s":2046.696,"e":2053.132,"p":true,"h":false},{"t":"3.","s":2054.016,"e":2054.605,"p":false,"h":false},{"t":"왜 은혜인가: 하나님을 즐거워함","s":2055.888,"e":2058.76,"p":true,"h":false},{"t":"구원의 궁극적 목적을 하나님을 즐거워함으로 보는 이해는 웨스트민스터 소요리문답 1문, 시 16:11, 73:25-26과 맞닿아 있습니다.","s":2059.584,"e":2071.033,"p":false,"h":false},{"t":"은혜의 \"부담 없음\"은 값이 없다는 뜻이 아니라 값을 그리스도께서 치르셨다는 뜻이며(고전 6:20), 즐거움이 순종의 동기이지 순종이 선택 사항이라는 뜻은 아닙니다.","s":2071.632,"e":2084.142,"p":false,"h":false},{"t":"7장의 제3용도와 이어집니다.","s":2084.808,"e":2087.216,"p":true,"h":false},{"t":"4.","s":2087.76,"e":2088.306,"p":false,"h":false},{"t":"속죄일 성취와 정결법의 성취","s":2089.632,"e":2091.98,"p":true,"h":false},{"t":"두 염소를 죄 값의 지불과 죄의 제거로 읽는 해석은 4장 노트와 연결됩니다.","s":2092.656,"e":2097.801,"p":false,"h":false},{"t":"부정 전염 방향의 역전(막 1:41, 5:25-34)과 십자가의 교환(고후 5:21)을 연결했으며, 음식 규례의 성취(막 7:19, 행 10장, 골 2:16-17)는 폐지가 아니라 성취의 틀로 가르칩니다.","s":2098.368,"e":2122.905,"p":false,"h":false},{"t":"율법을 도덕법, 의식법, 시민법으로 구분하는 이해는 부록에서 정리할 수 있습니다.","s":2123.568,"e":2130.5,"p":true,"h":false},{"t":"5.","s":2131.368,"e":2131.782,"p":false,"h":false},{"t":"승천과 중보","s":2133.24,"e":2134.535,"p":true,"h":false},{"t":"낮아지심, 십자가, 부활에서 끝내지 않고 승천과 하늘 성소에서의 중보(히 4:14, 7:25, 9:24, 롬 8:34)까지 다루어야 4장의 속죄일 그림, 곧 피를 들고 지성소에 들어가 하나님 앞에 서는 장면이 완결됩니다.","s":2135.376,"e":2156.684,"p":false,"h":false},{"t":"중보는 십자가에 무엇을 더하는 것이 아니라, 단번에 이루어진 속죄가 지금도 성도에게 적용되고 있음을 말합니다.","s":2157.312,"e":2164.624,"p":false,"h":false},{"t":"웨스트민스터 신앙고백서 8장(중보자 그리스도)과 함께 보시기 바랍니다.","s":2165.256,"e":2171.427,"p":true,"h":false},{"t":"6.","s":2172.312,"e":2172.88,"p":false,"h":false},{"t":"주의할 점","s":2174.184,"e":2175.189,"p":true,"h":false},{"t":"\"그림자가 사라진다\"가 아니라 \"실체 안에서 완성된다\"로 가르치십시오.","s":2176.056,"e":2181.782,"p":false,"h":false},{"t":"구약 제사는 그리스도를 가리키는 계시로서 가치가 있었습니다(1장과 연결).","s":2182.392,"e":2187.961,"p":true,"h":false}]},{"title":"7장. 복음으로 거룩하여진 성도","audio":"book_2611261521_2.mp3","start":2188.824,"end":3781.2,"dur":1592.4,"segs":[{"t":"7장.","s":2188.824,"e":2189.594,"p":false,"h":false},{"t":"복음으로 거룩하여진 성도","s":2190.696,"e":2192.718,"p":true,"h":false},{"t":"이 장의 자리","s":2193.24,"e":2194.307,"p":true,"h":false},{"t":"6장에서 길이 열렸습니다.","s":2195.16,"e":2197.276,"p":false,"h":false},{"t":"거룩하신 하나님과 죄인 사이를 가로막던 휘장이 찢어졌고, 우리는 그 길로 들어서게 되었습니다.","s":2197.92,"e":2204.663,"p":false,"h":false},{"t":"그런데 문 안으로 들어선 사람에게는 질문이 하나 남습니다.","s":2205.288,"e":2209.242,"p":false,"h":false},{"t":"\"그다음에는 어떻게 사는가?\"","s":2209.872,"e":2211.785,"p":true,"h":false},{"t":"지금까지 율법은 진단이었고(2~5장), 복음은 처방이었습니다(6장).","s":2212.68,"e":2219.602,"p":false,"h":false},{"t":"이 장은 처방을 받은 사람이 회복되어 가는 모습입니다.","s":2220.192,"e":2223.7,"p":false,"h":false},{"t":"6장이 \"왜 하나님을 즐거워할 수 있는가\"를 말했다면, 이 장은 그 즐거움이 일상에서 어떤 모습이 되는지를 봅니다.","s":2224.272,"e":2232.091,"p":true,"h":false},{"t":"거룩하여졌는데, 또 거룩하라고요?","s":2233.008,"e":2235.998,"p":true,"h":false},{"t":"레위기는 \"너희는 거룩하라\"고 명령했습니다(레 19:2).","s":2236.896,"e":2242.066,"p":false,"h":false},{"t":"2장에서 보았듯 이 명령 앞에서 사람은 한 걸음도 다가설 수 없었습니다.","s":2242.632,"e":2247.702,"p":true,"h":false},{"t":"그런데 신약을 펼치면 놀라운 일이 벌어집니다.","s":2248.56,"e":2251.84,"p":false,"h":false},{"t":"사도 바울은 고린도교회에 편지하면서 \"그리스도 예수 안에서 거룩하여지고 성도라 부르심을 입은 자들\"(고전 1:2)이라고 인사합니다.","s":2252.448,"e":2262.965,"p":false,"h":false},{"t":"고린도교회는 분열과 다툼, 음행, 예배의 무질서로 문제가 많은 교회였습니다.","s":2263.584,"e":2269.801,"p":false,"h":false},{"t":"그런데도 바울은 책망하기 전에 먼저 그들을 \"거룩하여진 자들\"이라 부릅니다.","s":2270.4,"e":2275.321,"p":false,"h":false},{"t":"지난날 죄 가운데 살던 이들에게는 \"씻음을 받고 거룩함을 받고 의롭다 함을 받았느니라\"(고전 6:11)고 말합니다.","s":2275.896,"e":2285.741,"p":false,"h":false},{"t":"히브리서도 선언합니다.","s":2286.36,"e":2288.043,"p":false,"h":false},{"t":"\"예수 그리스도의 몸을 단번에 드리심으로 말미암아 우리가 거룩함을 얻었노라\"(히 10:10).","s":2288.328,"e":2295.308,"p":true,"h":false},{"t":"여기서 많은 분이 어리둥절해집니다.","s":2296.152,"e":2298.595,"p":false,"h":false},{"t":"\"이미 거룩하게 해 놓으셨다면서 왜 또 거룩해지라고 하실까?\"","s":2299.2,"e":2303.076,"p":false,"h":false},{"t":"이 둘은 같은 말이 아니라 서로 다른 두 가지를 가리킵니다.","s":2303.712,"e":2307.609,"p":true,"h":false},{"t":"\"거룩하여졌다\"는 신분을 말합니다.","s":2308.464,"e":2311.347,"p":false,"h":false},{"t":"그리스도께서 이루신 의 덕분에 하나님이 우리를 의롭다 하시고 자녀로 받아 주셨다는 선언입니다.","s":2311.992,"e":2318.266,"p":false,"h":false},{"t":"사도 요한은 \"영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니\"(요 1:12)라고 했습니다.","s":2318.904,"e":2328.362,"p":false,"h":false},{"t":"이것은 하나님이 이루신 일이고, 우리의 행실로 늘거나 줄지 않습니다.","s":2329.032,"e":2334.014,"p":true,"h":false},{"t":"\"거룩하여지라\"는 자녀다움에 대한 요구입니다.","s":2334.888,"e":2338.046,"p":false,"h":false},{"t":"자녀가 되었지만 아직 자녀다운 모습에 미치지 못하니, 자녀답게 자라라는 부르심입니다.","s":2338.68,"e":2344.649,"p":true,"h":false},{"t":"이 이야기를 하나 지어 보겠습니다.","s":2345.52,"e":2347.939,"p":false,"h":false},{"t":"거리에서 구걸하던 아이를 왕이 불러 자기 아들로 삼았다고 생각해 보십시오.","s":2348.568,"e":2353.206,"p":false,"h":false},{"t":"아이가 한 일은 아무것도 없습니다.","s":2353.776,"e":2356.269,"p":false,"h":false},{"t":"그날부터 아이는 왕자입니다.","s":2356.824,"e":2359.016,"p":false,"h":false},{"t":"그런데 신분이 하루아침에 바뀌었다고 몸에 밴 거리의 습관까지 하루아침에 사라지지는 않습니다.","s":2359.656,"e":2366.055,"p":false,"h":false},{"t":"궁에 들어간 아이는 식탁에서 음식을 움켜쥐고, 사람들 앞에서 비굴하게 굽니다.","s":2366.688,"e":2372.124,"p":false,"h":false},{"t":"궁중의 예절과 격식에 서툴러 실수가 이어집니다.","s":2372.784,"e":2376.205,"p":false,"h":false},{"t":"그렇다고 왕이 \"너는 왕자가 아니다\" 하며 아이를 내쫓습니까?","s":2376.864,"e":2381.099,"p":false,"h":false},{"t":"아닙니다.","s":2381.736,"e":2382.632,"p":false,"h":false},{"t":"왕자라는 신분은 아이의 행실이 아니라 왕의 결정에 달려 있기 때문입니다.","s":2383.608,"e":2388.672,"p":true,"h":false},{"t":"성도의 모습이 이와 같습니다.","s":2389.56,"e":2391.727,"p":false,"h":false},{"t":"예수님을 믿어 구원받았지만 신자답지 못한 모습이 남아 있을 수 있습니다.","s":2392.296,"e":2397.167,"p":false,"h":false},{"t":"그래도 신분은 그대로입니다.","s":2397.816,"e":2399.939,"p":false,"h":false},{"t":"바울은 \"그러므로 이제 그리스도 예수 안에 있는 자에게는 결코 정죄함이 없나니\"(롬 8:1)라고 말합니다.","s":2400.216,"e":2408.511,"p":false,"h":false},{"t":"왕이 아들로 삼은 아이에게 왕자다움이 요구되듯이 하나님은 영원한 천국을 물려받을 자녀에게 자녀다움을 요구하십니다.","s":2409.144,"e":2416.477,"p":false,"h":false},{"t":"\"거룩하라\"는 명령은 바로 이 부르심입니다.","s":2417.112,"e":2420.21,"p":false,"h":false},{"t":"자녀가 되기 위한 조건이 아니라, 이미 자녀가 된 사람에게 하시는 말씀입니다.","s":2420.808,"e":2426.063,"p":true,"h":false},{"t":"베드로가 레위기의 그 말씀을 성도에게 다시 들려주는 대목을 보십시오.","s":2426.952,"e":2431.484,"p":false,"h":false},{"t":"\"너희가 순종하는 자식처럼 전에 알지 못할 때에 따르던 너희 사욕을 본받지 말고 오직 너희를 부르신 거룩한 이처럼 너희도 모든 행실에 거룩한 자가 되라 기록하였으되 내가 거룩하니 너희도 거룩할지어다\"(벧전 1:14-16).","s":2432.088,"e":2448.299,"p":false,"h":false},{"t":"\"순종하는 자식처럼\", \"전에 따르던 것을 본받지 말고\".","s":2448.888,"e":2452.803,"p":false,"h":false},{"t":"방금 본 이야기와 똑같은 말입니다.","s":2453.352,"e":2455.82,"p":false,"h":false},{"t":"같은 말씀인데 자리가 달라졌습니다.","s":2456.112,"e":2458.777,"p":false,"h":false},{"t":"위기의 백성은 하나님이 마련하신 제사와 정결의 길을 통해 그분께 나아갔습니다.","s":2459.304,"e":2464.791,"p":false,"h":false},{"t":"신약의 성도는 그 길이 그리스도 안에서 완성되었기에, 이미 자녀로 받아들여진 신분에서 거룩한 삶을 살아갑니다.","s":2465.424,"e":2473.191,"p":false,"h":false},{"t":"1장의 결혼식 비유로 말하면 반지가 먼저 끼워지고 집안의 규칙이 그다음인 것과 같습니다.","s":2473.824,"e":2480.145,"p":true,"h":false},{"t":"이 이야기에서 두 가지를 더 분명히 해 두겠습니다.","s":2481.024,"e":2484.568,"p":true,"h":false},{"t":"첫째, 왕위를 이어받는 것은 왕자다운 행동을 쌓은 보상이 아니라 왕자라는 신분 때문입니다.","s":2485.416,"e":2492.037,"p":false,"h":false},{"t":"바울은 \"자녀이면 또한 상속자 곧 하나님의 상속자요 그리스도와 함께 한 상속자\"(롬 8:17)라고 합니다.","s":2492.688,"e":2501.832,"p":false,"h":false},{"t":"자녀다움은 상속의 조건이 아니라 상속자로서 사는 삶입니다.","s":2502.48,"e":2506.825,"p":true,"h":false},{"t":"둘째, 이 이야기에는 담기지 못한 것이 하나 있습니다.","s":2507.712,"e":2511.833,"p":false,"h":false},{"t":"예화 속 아이는 혼자 애써서 습관을 고쳐야 하지만, 성도에게는 마음 안에 계신 분이 있습니다.","s":2512.488,"e":2518.632,"p":false,"h":false},{"t":"\"하나님이 그 아들의 영을 우리 마음 가운데 보내사 아빠 아버지라고 부르게 하셨느니라\"(갈 4:6).","s":2519.28,"e":2526.823,"p":false,"h":false},{"t":"바울은 \"두렵고 떨림으로 너희 구원을 이루라\"고 한 뒤 곧바로 이유를 밝힙니다.","s":2527.392,"e":2532.801,"p":false,"h":false},{"t":"\"너희 안에서 행하시는 이는 하나님이시니 그의 소원을 두고 행하게 하시나니\"(빌 2:12-13).","s":2533.44,"e":2540.751,"p":false,"h":false},{"t":"자녀답게 자라는 일은 우리가 하지만, 그 일을 시작하고 이끄시는 분은 하나님이십니다.","s":2541.216,"e":2547.04,"p":false,"h":false},{"t":"그래서 아버지는 자녀를 징계하시되 \"그의 거룩하심에 참여하게 하시려고\" 하십니다(히 12:10).","s":2547.672,"e":2555.074,"p":false,"h":false},{"t":"거지 습관이 남아 있는 아들을 내쫓으시는 것이 아니라 가르치고 다듬으십니다.","s":2555.592,"e":2560.429,"p":true,"h":false},{"t":"휘장이 찢어진 곳에서 맞는 하루","s":2561.328,"e":2563.631,"p":true,"h":false},{"t":"2장에서 지성소는 1년에 하루, 한 사람만 들어가던 곳이었습니다.","s":2564.16,"e":2568.955,"p":false,"h":false},{"t":"6장에서 그 휘장이 위로부터 찢어졌습니다.","s":2569.584,"e":2572.776,"p":false,"h":false},{"t":"이 사실은 성도의 일상에서 어떤 모습이 될까요?","s":2573.376,"e":2576.93,"p":true,"h":false},{"t":"히브리서는 이렇게 권합니다.","s":2577.84,"e":2579.907,"p":false,"h":false},{"t":"\"그러므로 우리는 긍휼하심을 받고 때를 따라 돕는 은혜를 얻기 위하여 은혜의 보좌 앞에 담대히 나아가자\"(히 4:16).","s":2580.192,"e":2588.672,"p":false,"h":false},{"t":"거룩한 지성소가 은혜의 보좌가 되었습니다.","s":2589.288,"e":2592.243,"p":false,"h":false},{"t":"그래서 성도의 기도는 문밖에서 두려워 서성이는 일이 아니라, 아버지 집의 문을 열고 들어가는 일입니다.","s":2592.84,"e":2599.585,"p":false,"h":false},{"t":"아침에 눈을 뜨며 드리는 짧은 기도도, 일터에서 잠깐 숨을 고르며 드리는 기도도 모두 그 보좌 앞에 서는 일입니다.","s":2600.136,"e":2607.956,"p":false,"h":false},{"t":"3장에서 우리는 하루 종일이 하나님 앞이었다는 것을 보았습니다.","s":2608.584,"e":2612.846,"p":false,"h":false},{"t":"이제 그 하루 종일이 두려움의 시간이 아니라 아버지 앞에서 사는 시간이 되었습니다.","s":2613.48,"e":2618.804,"p":true,"h":false},{"t":"다만 담대함이 가벼움이 되어서는 안 됩니다.","s":2619.672,"e":2622.882,"p":false,"h":false},{"t":"2장의 나답과 아비후는 자기 방식의 불을 들고 나아갔다가 쓰러졌습니다.","s":2623.44,"e":2628.336,"p":false,"h":false},{"t":"우리는 하나님이 정하신 단 하나의 길, 그리스도를 통해 나아갑니다.","s":2628.984,"e":2633.768,"p":false,"h":false},{"t":"그 길이 얼마나 비싼 값으로 열렸는지를 아는 사람의 담대함에는 감사와 경외가 함께 있습니다.","s":2634.336,"e":2640.58,"p":false,"h":false},{"t":"히브리서도 \"경건과 두려움으로 하나님을 기쁘시게 섬길 것이니 우리 하나님은 소멸하는 불이심이라\"(히 12:28-29)고 말합니다.","s":2641.2,"e":2652.058,"p":false,"h":false},{"t":"아버지 앞에서 누리는 기쁨과 거룩하신 분 앞에서의 경외는 서로 다투지 않고, 함께 자랍니다.","s":2652.696,"e":2659.229,"p":true,"h":false},{"t":"돌판에서 마음으로: 율법의 새로운 자리","s":2660.064,"e":2663.266,"p":true,"h":false},{"t":"그렇다면 거룩하여진 성도는 율법과 무관해진 것일까요?","s":2664.144,"e":2668.108,"p":false,"h":false},{"t":"그렇지 않습니다.","s":2668.776,"e":2670.12,"p":false,"h":false},{"t":"달라진 것은 율법의 기능입니다.","s":2670.744,"e":2673.086,"p":false,"h":false},{"t":"5장에서 율법은 우리 얼굴의 얼룩을 비추는 거울이었습니다.","s":2673.696,"e":2677.733,"p":false,"h":false},{"t":"우리의 죄인 된 모습을 밝혀서 죄 사함의 필요성을 알려 주었습니다.","s":2678.4,"e":2682.994,"p":false,"h":false},{"t":"이제 구원받은 성도에게 율법은 사랑하시는 아버지의 뜻을 알려 주는 안내가 됩니다.","s":2683.608,"e":2689.032,"p":false,"h":false},{"t":"거울은 우리를 구원자께로 이끌었고, 안내는 구원받은 자녀가 걸어갈 길을 보여 줍니다.","s":2689.608,"e":2695.617,"p":true,"h":false},{"t":"이것은 하나님이 오래전부터 하신 약속이었습니다.","s":2696.472,"e":2700.003,"p":false,"h":false},{"t":"\"내가 새 영을 너희 속에 두어 ...","s":2700.528,"e":2702.556,"p":false,"h":false},{"t":"내 규례를 행하게 하리니\"(겔 36:26-27).","s":2703.192,"e":2708.299,"p":false,"h":false},{"t":"\"내 법을 그들의 속에 두며 그들의 마음에 기록하리라\"(렘 31:33).","s":2708.784,"e":2714.778,"p":false,"h":false},{"t":"돌판에 새겨졌던 법이 성령을 통해 마음에 새겨진 것입니다.","s":2715.336,"e":2719.119,"p":false,"h":false},{"t":"바울은 성령을 따라 사는 사람들 안에서 \"율법의 요구가 이루어진다\"고 말합니다(롬 8:4).","s":2719.68,"e":2727.352,"p":true,"h":false},{"t":"1장에서 시편 119편의 경건한 사람들을 기억하십니까?","s":2728.104,"e":2731.991,"p":false,"h":false},{"t":"\"내가 주의 법을 어찌 그리 사랑하는지요.\"","s":2732.64,"e":2735.305,"p":false,"h":false},{"t":"구약에서는 소수의 경건한 사람이 누리던 이 기쁨을, 성령께서 이제 모든 성도의 마음에 심어 주십니다.","s":2735.976,"e":2743.308,"p":false,"h":false},{"t":"그래서 이들의 기도는 이렇게 이어집니다.","s":2743.944,"e":2746.752,"p":false,"h":false},{"t":"\"주께서 내 마음을 넓히시면 내가 주의 계명들의 길로 달려가리이다\"(시 119:32).","s":2747.04,"e":2755.001,"p":false,"h":false},{"t":"순종은 억지로 끌려가는 걸음이 아니라, 마음이 넓어진 사람이 달려가는 걸음이 됩니다.","s":2755.584,"e":2761.138,"p":false,"h":false},{"t":"예수님도 말씀하셨습니다.","s":2761.776,"e":2763.749,"p":false,"h":false},{"t":"\"너희가 나를 사랑하면 나의 계명을 지키리라\"(요 14:15).","s":2764.392,"e":2769.649,"p":false,"h":false},{"t":"순종은 사랑의 열매입니다.","s":2770.2,"e":2772.268,"p":true,"h":false},{"t":"마음에 아버지의 법을 두고 그 뜻 행하기를 즐거워하신 첫 번째 사람은 그리스도이십니다(시 40:8, 히 10:5-7).","s":2773.128,"e":2783.695,"p":false,"h":false},{"t":"우리 마음에 새겨지는 법은 그분 안에서 이루어진 그 법이고, 성령께서는 아들의 마음을 우리 안에 심어 주십니다(갈 4:6).","s":2784.192,"e":2793.325,"p":true,"h":false},{"t":"이 순서를 놓치지 않는 것이 중요합니다.","s":2794.128,"e":2796.886,"p":true,"h":false},{"t":"• 자녀가 되기 위해 순종하는 것이 아니라, 자녀가 되었기 때문에 순종합니다.","s":2797.752,"e":2802.623,"p":true,"h":false},{"t":"• 순종이 신분을 만드는 것이 아니라, 신분이 순종을 낳습니다.","s":2803.512,"e":2807.662,"p":true,"h":false},{"t":"• 넘어질 때에도 신분이 흔들리는 것이 아니라, 아버지 품으로 돌아가 죄를 자백하고 다시 걷습니다(요일 1:9).","s":2808.528,"e":2816.711,"p":true,"h":false},{"t":"이 말이 \"은혜를 받았으니 마음대로 살아도 된다\"는 뜻은 아닙니다.","s":2817.552,"e":2822.173,"p":false,"h":false},{"t":"바울은 단호하게 말합니다.","s":2822.76,"e":2824.681,"p":false,"h":false},{"t":"\"우리가 죄에 거하여 은혜를 더하게 하려고 죄를 계속하자는 말이냐 그럴 수 없느니라\"(롬 6:1-2).","s":2825.304,"e":2833.025,"p":false,"h":false},{"t":"아버지의 사랑을 아는 자녀는 그 사랑을 아프게 하는 일이 마음에 걸립니다.","s":2833.632,"e":2838.317,"p":false,"h":false},{"t":"신랑의 집 규칙을 어길 때 마음이 아픈 것은 규칙이 무서워서가 아니라 신랑을 사랑하기 때문입니다.","s":2838.912,"e":2845.513,"p":true,"h":false},{"t":"날마다 드리는 산 제사","s":2846.304,"e":2848.071,"p":true,"h":false},{"t":"구약의 제사는 그리스도 안에서 완성되어 더는 드리지 않습니다.","s":2848.92,"e":2853.118,"p":false,"h":false},{"t":"그런데 제사의 정신은 성도의 삶으로 이어집니다.","s":2853.744,"e":2857.204,"p":false,"h":false},{"t":"바울은 이렇게 권합니다.","s":2857.488,"e":2859.265,"p":false,"h":false},{"t":"\"그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라 이는 너희가 드릴 영적 예배니라\"(롬 12:1).","s":2859.888,"e":2871.956,"p":true,"h":false},{"t":"여기서 '그러므로'를 눈여겨보십시오.","s":2872.728,"e":2875.209,"p":false,"h":false},{"t":"로마서 1~11장이 말한 복음, 곧 하나님이 이미 이루신 일 위에서 나온 권면입니다.","s":2875.752,"e":2882.331,"p":false,"h":false},{"t":"신분이 먼저이고, 드림이 그다음입니다.","s":2882.904,"e":2885.971,"p":false,"h":false},{"t":"죽은 짐승이 아니라 산 제물로, 일 년에 한 번이 아니라 날마다 드립니다.","s":2886.6,"e":2891.333,"p":false,"h":false},{"t":"그리스도의 속죄 제사가 이미 완성되었으니, 우리의 드림은 죄를 사하기 위한 것이 아니라 감사와 사랑의 응답입니다.","s":2891.952,"e":2899.845,"p":true,"h":false},{"t":"4장에서 본 제사들의 정신이 이렇게 삶이 됩니다.","s":2900.736,"e":2904.095,"p":true,"h":false},{"t":"• 번제의 정신은 전적인 헌신으로: 내 삶 전체가 하나님께 속해 있다는 고백","s":2904.888,"e":2910.571,"p":true,"h":false},{"t":"• 소제의 정신은 일상의 감사로: 오늘의 양식과 일터를 \"이 모든 것이 주께서 주신 것입니다\" 하며 받는 마음","s":2911.536,"e":2919.82,"p":true,"h":false},{"t":"• 화목제의 정신은 교제로: 하나님과 함께, 그리고 성도와 함께 앉는 식탁","s":2920.416,"e":2926.084,"p":true,"h":false},{"t":"• 속죄제의 정신은 회개로: 죄를 숨기지 않고 십자가를 의지하여 돌아오는 걸음","s":2926.92,"e":2932.7,"p":true,"h":false},{"t":"히브리서는 이를 더 구체적으로 말합니다.","s":2933.568,"e":2936.449,"p":false,"h":false},{"t":"\"그러므로 우리는 예수로 말미암아 항상 찬송의 제사를 하나님께 드리자 이는 그 이름을 증언하는 입술의 열매니라 선을 행함과 서로 나누어 주기를 잊지 말라 하나님은 이같은 제사를 기뻐하시느니라\"(히 13:15-16).","s":2936.736,"e":2952.471,"p":false,"h":false},{"t":"거룩한 삶은 입술의 찬양과 이웃을 향한 나눔으로 구체화됩니다.","s":2952.936,"e":2957.28,"p":false,"h":false},{"t":"같은 장은 예수님이 \"자기 피로 백성을 거룩하게 하려고 성문 밖에서 고난을 받으셨다\"고 합니다(히 13:12).","s":2957.928,"e":2966.401,"p":false,"h":false},{"t":"3장에서 부정한 사람이 격리되던 진영 밖으로 그분이 먼저 가셨고, 이제 우리도 그분을 따라 그 바깥, 곧 지치고 소외된 이웃이 있는 자리로 나아갑니다(히 13:13).","s":2966.904,"e":2979.616,"p":true,"h":false},{"t":"거룩한 공동체","s":2980.32,"e":2981.8,"p":true,"h":false},{"t":"레위기의 \"너희는 거룩하라\"는 개인에게만 주신 말씀이 아니라 백성 전체에게 주신 말씀이었습니다.","s":2982.456,"e":2988.988,"p":false,"h":false},{"t":"2장에서 시내산의 하나님이 \"너희는 내게 제사장 나라가 되며 거룩한 백성이 되리라\"(출 19:6)고 하셨던 것을 기억하실 것입니다.","s":2989.632,"e":3000.139,"p":false,"h":false},{"t":"베드로는 이 약속이 교회에서 이루어졌다고 말합니다.","s":3000.792,"e":3004.36,"p":true,"h":false},{"t":"\"너희는 택하신 족속이요 왕 같은 제사장들이요 거룩한 나라요 그의 소유가 된 백성이니 이는 너희를 어둠에서 불러내어 그의 기이한 빛에 들어가게 하신 이의 아름다운 덕을 선포하게 하려 하심이라\"(벧전 2:9)","s":3005.232,"e":3019.585,"p":true,"h":false},{"t":"구약에서는 소수의 제사장만 하나님께 나아갔지만, 이제는 모든 성도가 제사장입니다.","s":3020.016,"e":3026.037,"p":false,"h":false},{"t":"거룩은 세상에서 도망치는 것이 아니라 세상 한가운데서 빛을 드러내는 삶입니다.","s":3026.664,"e":3032.257,"p":false,"h":false},{"t":"그리고 그 삶은 혼자 걷는 길이 아니라 공동체가 함께 걷는 길입니다.","s":3032.88,"e":3037.742,"p":false,"h":false},{"t":"이 공동체는 스스로 거룩해진 사람들의 모임이 아닙니다.","s":3038.28,"e":3042.21,"p":false,"h":false},{"t":"산 돌이신 그리스도께 나아온 사람들이 그분 위에 함께 세워져 가는 집입니다(벧전 2:4-5, 엡 2:20-22).","s":3042.744,"e":3053.079,"p":false,"h":false},{"t":"초대교회는 \"사도의 가르침을 받아 교제하며 떡을 떼며 기도하기를 전혀 힘썼고\"(행 2:42), \"집에서 떡을 떼며 기쁨과 순전한 마음으로 음식을 먹으며\"(행 2:46) 지냈습니다.","s":3053.592,"e":3069.297,"p":false,"h":false},{"t":"말씀과 식탁과 기쁨이 한곳에 있었습니다.","s":3069.864,"e":3072.858,"p":true,"h":false},{"t":"저는 일본에서 사역하면서 이 모습을 작은 방식으로나마 붙들고 살았습니다.","s":3073.68,"e":3078.96,"p":false,"h":false},{"t":"3장에서 되새김질하는 동물을 보며 들은 말씀을 곱씹는 성도를 떠올렸다고 말씀드렸습니다.","s":3079.608,"e":3085.932,"p":false,"h":false},{"t":"그것은 본문이 직접 가르친 뜻이 아니라 영적 묵상이라고 했지만, 평신도였던 시절 한 부흥회에서 이 해석을 들은 뒤로 목회하면서 저는 들은 말씀을 되새기는 일을 소중한 덕목으로 여기게 되었습니다.","s":3086.568,"e":3100.013,"p":false,"h":false},{"t":"주일에 들은 설교가 한 주 동안 삶에 남으려면 되새김이 있어야 한다고 생각했습니다.","s":3100.584,"e":3105.866,"p":false,"h":false},{"t":"그래서 설교를 요약한 묵상 인쇄물을 일본어로 번역해 매 주일 성도들에게 나누어 주었습니다.","s":3106.464,"e":3112.406,"p":false,"h":false},{"t":"번거로운 일이었지만, 집에 돌아가 말씀을 다시 곱씹는 성도가 되기를 바라는 마음으로 열심히 했고, 성도들도 잘 따라와 주었습니다.","s":3113.04,"e":3121.994,"p":true,"h":false},{"t":"점심 식탁도 되새김의 자리가 되었습니다.","s":3122.856,"e":3125.725,"p":false,"h":false},{"t":"점심 식사 시간은 늘 그날 들은 설교를 나누는 시간이었습니다.","s":3126.288,"e":3130.562,"p":false,"h":false},{"t":"일본에는 식사 뒤에 간식을 함께 먹는 습관이 있어서 식탁에 앉아 있는 시간이 깁니다.","s":3131.208,"e":3136.918,"p":false,"h":false},{"t":"식사를 마치고 간식 시간이 되면 그 시간에 방금 들은 설교를 나누면 유익이 많았습니다.","s":3137.544,"e":3143.356,"p":false,"h":false},{"t":"이 나눔이 자리를 잡자 성도들이 먼저 궁금한 것을 물어오기 시작했습니다.","s":3143.976,"e":3148.933,"p":false,"h":false},{"t":"협력목사님 두 분이 함께하고 계셔서 큰 도움이 되었습니다.","s":3149.568,"e":3153.449,"p":false,"h":false},{"t":"한 번 먹고 마는 것이 아니라 되새김질하는 신앙, 그것이 제가 3장의 규례에서 얻은 가장 소중한 적용이었습니다.","s":3154.08,"e":3161.613,"p":true,"h":false},{"t":"대단한 프로그램이 있었던 것은 아닙니다.","s":3162.528,"e":3165.361,"p":false,"h":false},{"t":"종이 한 장과 긴 식탁이 전부였습니다.","s":3165.864,"e":3168.545,"p":false,"h":false},{"t":"그러나 말씀을 함께 곱씹고, 궁금한 것을 서로 묻고, 함께 먹는 자리가 거룩한 공동체의 한 모습이라고 저는 생각합니다.","s":3169.152,"e":3178.08,"p":false,"h":false},{"t":"시편 1편이 말씀을 즐거워하며 주야로 묵상하는 사람을 복 있는 사람이라 했는데, 그 즐거움이 식탁 위에서 이어지고 있었습니다.","s":3178.704,"e":3187.199,"p":false,"h":false},{"t":"그 식탁은 그리스도께서 이루신 화평 위에서 열려 있었습니다.","s":3187.848,"e":3192.094,"p":true,"h":false},{"t":"이 장을 마치며","s":3192.936,"e":3194.203,"p":true,"h":false},{"t":"2장은 이런 질문으로 시작했습니다.","s":3194.88,"e":3197.424,"p":false,"h":false},{"t":"\"거룩하신 하나님과 죄 많은 백성이 어떻게 함께 살 수 있는가?\"","s":3198.048,"e":3202.347,"p":false,"h":false},{"t":"이제 답이 보입니다.","s":3202.968,"e":3204.498,"p":false,"h":false},{"t":"하나님이 길을 마련하시고(4장), 그 길이 되어 주시고(6장), 그 길로 들어온 사람을 자녀 삼아 함께 살게 하십니다(7장).","s":3205.104,"e":3215.396,"p":false,"h":false},{"t":"율법은 진단이었고, 복음은 처방이었으며, 성도의 삶은 회복되어 가는 건강입니다.","s":3215.88,"e":3222.164,"p":true,"h":false},{"t":"5장에서 율법의 기준은 사람이 본래 지음 받은 자리를 보여 주었습니다.","s":3223.056,"e":3227.588,"p":false,"h":false},{"t":"복음은 그 자리를 향해 우리를 조금씩 회복시켜 갑니다.","s":3228.144,"e":3231.838,"p":false,"h":false},{"t":"바울의 말대로 우리는 \"자기를 창조하신 이의 형상을 따라 지식에까지 새롭게 하심을 받는 자\"입니다(골 3:10).","s":3232.392,"e":3241.386,"p":false,"h":false},{"t":"그 길을 걷는 동안 구원은 점수를 따는 긴장이 아니라, 하나님을 즐거워하며 걷는 발걸음이 됩니다.","s":3241.944,"e":3248.781,"p":true,"h":false},{"t":"낯선 용어 풀이","s":3249.672,"e":3251.022,"p":true,"h":false},{"t":"• 성도: 거룩하게 구별된 사람들이라는 뜻으로, 그리스도를 믿는 모든 사람을 가리킵니다.","s":3251.88,"e":3258.425,"p":false,"h":false},{"t":"특별히 훌륭한 사람이 아니라 하나님이 거룩하다고 불러 주신 사람입니다.","s":3259.056,"e":3263.926,"p":true,"h":false},{"t":"• 거룩하여짐(신분): 그리스도의 의로 하나님 앞에서 의롭다 하심을 받고 자녀로 받아들여진 일입니다.","s":3264.792,"e":3271.784,"p":false,"h":false},{"t":"하나님이 이루신 일이며, 행실로 늘거나 줄지 않습니다.","s":3272.424,"e":3276.441,"p":true,"h":false},{"t":"• 거룩하여지라(성화): 이미 자녀가 된 사람이 자녀다운 삶으로 자라 가는 일입니다.","s":3277.296,"e":3282.565,"p":false,"h":false},{"t":"성령께서 우리 안에서 이루십니다.","s":3283.224,"e":3285.596,"p":true,"h":false},{"t":"• 산 제물: 죽은 짐승 대신 날마다 살아서 하나님께 드리는 삶 전체를 말합니다.","s":3286.488,"e":3292.393,"p":true,"h":false},{"t":"• 영적 예배: 예배당 안의 시간만이 아니라 몸과 삶 전체로 드리는 예배입니다.","s":3293.28,"e":3299.072,"p":true,"h":false},{"t":"• 왕 같은 제사장: 그리스도 안에서 모든 성도가 하나님께 직접 나아가고 섬기는 제사장이 되었다는 뜻입니다.","s":3299.952,"e":3307.609,"p":true,"h":false},{"t":"• 은혜의 보좌: 지성소의 속죄소가 그리스도 안에서 하나님의 은혜를 받는 자리가 된 것을 가리킵니다.","s":3308.496,"e":3314.932,"p":true,"h":false},{"t":"한 줄 요약","s":3315.816,"e":3316.779,"p":true,"h":false},{"t":"복음 안에서 \"거룩하여졌다\"는 그리스도의 의로 받은 자녀의 신분이고, \"거룩하여지라\"는 그 신분에 걸맞게 자녀다워지라는 부르심이며, 성도는 성령의 도우심으로 즐거이 순종하고 산 제사를 드리며 거룩한 공동체로 살아갑니다.","s":3317.688,"e":3333.387,"p":true,"h":false},{"t":"함께 나눠 볼 질문","s":3334.296,"e":3335.825,"p":true,"h":false},{"t":"1.","s":3336.624,"e":3337.159,"p":false,"h":false},{"t":"나는 자녀의 신분을 이미 받은 사람으로 순종하고 있는가, 아직 인정받기 위해 순종하고 있는가?","s":3338.496,"e":3344.677,"p":true,"h":false},{"t":"2.","s":3345.552,"e":3345.837,"p":false,"h":false},{"t":"내게 아직 남아 있는 \"거지 습관\"은 무엇인가?","s":3346.152,"e":3349.155,"p":false,"h":false},{"t":"그것이 드러날 때 아버지는 나를 어떻게 대하신다고 믿는가?","s":3349.8,"e":3353.674,"p":true,"h":false},{"t":"3.","s":3354.552,"e":3355.141,"p":false,"h":false},{"t":"나의 기도는 문밖에서 서성이는 기도에 가까운가, 아버지 집의 문을 여는 기도에 가까운가?","s":3356.424,"e":3362.393,"p":false,"h":false},{"t":"그 담대함 안에 감사와 경외도 함께 있는가?","s":3363,"e":3365.777,"p":true,"h":false},{"t":"4.","s":3366.648,"e":3367.194,"p":false,"h":false},{"t":"월요일부터 토요일까지의 내 삶에서 \"산 제사\"라고 부를 만한 자리는 어디인가?","s":3368.52,"e":3373.775,"p":true,"h":false},{"t":"5.","s":3374.64,"e":3375.054,"p":false,"h":false},{"t":"들은 말씀을 되새기고 함께 나누는 자리가 내 삶에 있는가?","s":3376.512,"e":3380.175,"p":false,"h":false},{"t":"없다면 어디서부터 시작할 수 있는가?","s":3380.76,"e":3383.277,"p":true,"h":false},{"t":"목회자 노트 (7장)","s":3384.168,"e":3386.601,"p":true,"h":false},{"t":"이 구조는 개혁신학의 은혜언약 이해를 따른 것입니다.","s":3387.456,"e":3391.052,"p":true,"h":false},{"t":"1.","s":3391.92,"e":3392.455,"p":false,"h":false},{"t":"가르칠 때의 뼈대","s":3393.792,"e":3395.327,"p":true,"h":false},{"t":"이 장은 책 전체 흐름(진단, 처방, 회복된 삶)의 마지막 단계입니다.","s":3396.144,"e":3403.813,"p":false,"h":false},{"t":"1장의 \"구원이 먼저, 율법이 그다음\"이 이 장에서 \"신분이 먼저, 순종이 그다음\"으로 회수됩니다.","s":3404.472,"e":3412.059,"p":false,"h":false},{"t":"6장이 즐거움의 이유를 다루었다면 7장은 즐거움이 삶에서 나타나는 모습(기도, 순종, 드림, 공동체)을 다룹니다.","s":3412.704,"e":3423.325,"p":false,"h":false},{"t":"성경공부에서는 \"거룩하여졌고 거룩하여지라 → 담대한 접근 → 마음의 율법 → 산 제사 → 공동체\"의 다섯 마디로 가르칠 수 있습니다.","s":3423.96,"e":3432.543,"p":true,"h":false},{"t":"2.","s":3433.464,"e":3433.749,"p":false,"h":false},{"t":"신분과 부르심: 직설법과 명령법","s":3434.064,"e":3437.557,"p":true,"h":false},{"t":"본문에서는 \"거룩하여졌다\"를 의롭다 하심과 자녀 삼으심의 신분으로, \"거룩하여지라\"를 자녀다움의 요구(점진적 성화)로 풀었습니다(요 1:12, 롬 8:15-17, 갈 4:4-7, 벧전 1:14-16).","s":3438.312,"e":3460.059,"p":false,"h":false},{"t":"조직신학에서는 고전 1:2, 6:11, 히 10:10의 \"거룩하게 하심\"을 흔히 확정적 성화(그리스도와 연합하여 죄의 지배에서 분리된 신분)라 부르며, 칭의와 함께 주어지되 개념상 구별합니다.","s":3460.704,"e":3478.087,"p":false,"h":false},{"t":"평신도 본문에서는 이를 하나의 \"신분\"으로 묶어 설명했으니, 교단 교재의 용어에 맞게 조정하시기 바랍니다.","s":3478.656,"e":3485.975,"p":false,"h":false},{"t":"웨스트민스터 신앙고백서 11장(칭의), 12장(양자 됨), 13장(성화)과 이어집니다.","s":3486.6,"e":3497.53,"p":false,"h":false},{"t":"어느 쪽으로 설명하든 신분(하나님이 이루심)이 먼저이고 자라 감(성령이 우리 안에서 이루심)이 그다음이며, 둘을 섞지 않는다는 원칙은 같습니다.","s":3498.12,"e":3510.455,"p":true,"h":false},{"t":"3.","s":3511.344,"e":3511.933,"p":false,"h":false},{"t":"율법의 제3용도","s":3513.216,"e":3514.817,"p":true,"h":false},{"t":"성도에게 율법은 정죄의 기능에서 안내의 기능으로 자리가 바뀝니다(겔 36:26-27, 렘 31:33, 롬 8:4, 시 119편).","s":3515.592,"e":3529.708,"p":false,"h":false},{"t":"신앙고백서 19장과 맞닿아 있습니다.","s":3530.136,"e":3532.829,"p":false,"h":false},{"t":"롬 8:4의 \"율법의 요구가 이루어진다\"는 그리스도께서 이루신 의를 강조하는 해석과 성도 안에서 성령으로 이루어짐을 강조하는 해석이 있으며, 개혁파에서는 둘을 함께 보는 경우가 많습니다.","s":3533.352,"e":3547.235,"p":false,"h":false},{"t":"교단 입장에 맞게 가르치시기 바랍니다.","s":3547.848,"e":3550.716,"p":false,"h":false},{"t":"5장 노트에서 말한 제1용도(거울)와 부록의 제2용도(시민적 용도)를 함께 두면 삼중 용도가 완성됩니다.","s":3551.352,"e":3560.773,"p":true,"h":false},{"t":"4.","s":3561.648,"e":3562.194,"p":false,"h":false},{"t":"두 가지 오류에 대한 균형","s":3563.52,"e":3565.383,"p":true,"h":false},{"t":"율법폐기론(롬 6:1-2)과 율법주의(갈 3:3, \"성령으로 시작하고 육체로 마치겠느냐\")를 함께 경계합니다.","s":3566.184,"e":3578.368,"p":false,"h":false},{"t":"본문은 신랑의 집 규칙 비유(1장)와 왕자 예화로 두 오류를 함께 다루었습니다.","s":3579.024,"e":3585.827,"p":false,"h":false},{"t":"성경의 구조는 선언(직설법)이 먼저이고 권면(명령법)이 그다음입니다.","s":3586.44,"e":3594.294,"p":false,"h":false},{"t":"롬 12:1의 \"그러므로\"가 대표적입니다.","s":3594.936,"e":3598.547,"p":false,"h":false},{"t":"7장이 \"이제 열심히 살라\"는 도덕 권면으로 읽히지 않도록 이 순서를 지켜 가르칩니다.","s":3599.136,"e":3605.25,"p":true,"h":false},{"t":"5.","s":3606.168,"e":3606.582,"p":false,"h":false},{"t":"산 제사와 제사의 정신","s":3608.04,"e":3610.048,"p":true,"h":false},{"t":"롬 12:1과 히 13:15-16은 제사가 폐지된 뒤에도 제사의 정신이 삶으로 이어진다고 가르칩니다.","s":3610.824,"e":3619.769,"p":false,"h":false},{"t":"4장의 다섯 제사 중 번제, 소제, 화목제, 속죄제의 정신을 삶의 적용으로 풀었는데, 이는 본문이 직접 명시한 상징이 아니라 설교적 적용입니다.","s":3620.376,"e":3631.61,"p":false,"h":false},{"t":"3장 노트에서처럼 \"본문의 뜻\"과 \"적용\"을 구분해서 가르치도록 권합니다.","s":3631.896,"e":3637.163,"p":false,"h":false},{"t":"히 13:12-13의 \"성문 밖(영문 밖)\"은 3장의 진영 밖과 연결됩니다.","s":3637.8,"e":3645.443,"p":true,"h":false},{"t":"6.","s":3646.344,"e":3646.912,"p":false,"h":false},{"t":"만인제사장직","s":3648.216,"e":3649.574,"p":true,"h":false},{"t":"벧전 2:9는 출 19:6(2장에서 다룸)을 교회에 적용한 구절이며 계 1:6과도 이어집니다.","s":3650.352,"e":3660.144,"p":false,"h":false},{"t":"모든 성도가 그리스도 안에서 하나님께 직접 나아가고 섬긴다는 뜻이며, 교회의 직분(목사, 장로, 집사)을 부정하는 것이 아닙니다.","s":3660.744,"e":3672.299,"p":true,"h":false},{"t":"7.","s":3673.176,"e":3673.824,"p":false,"h":false},{"t":"현장 이야기의 사용","s":3675.048,"e":3676.603,"p":true,"h":false},{"t":"묵상 인쇄물과 점심 식탁 나눔은 \"되새김\"이라는 적용이 본문의 직접적 뜻이 아님을 3장에서 밝힌 뒤, 이 장에서 성도의 교제의 실례로 풀었습니다.","s":3677.304,"e":3687.333,"p":false,"h":false},{"t":"연결 구절은 시 1:2, 행 2:42-47, 골 3:16입니다.","s":3687.864,"e":3695.646,"p":false,"h":false},{"t":"목회자 독자에게는 \"말씀의 되새김이 공동체의 식탁으로 이어지는\" 실천 모델로 소개할 수 있습니다.","s":3696.216,"e":3702.697,"p":true,"h":false},{"t":"8.","s":3703.584,"e":3704.128,"p":false,"h":false},{"t":"거지왕자 예화의 사용과 한계","s":3705.456,"e":3707.642,"p":true,"h":false},{"t":"거리에서 구걸하던 아이를 왕이 아들로 삼았으나 거지 때의 습관이 남아 있다는 지어낸 이야기로, \"신분은 행실에 달려 있지 않다\"(롬 8:1)와 \"그러나 자녀답게 살아야 한다\"(벧전 1:14-16)를 함께 보여 줍니다.","s":3708.288,"e":3727.641,"p":false,"h":false},{"t":"성경의 양자 됨(롬 8:15-17, 갈 4:4-7)을 풀어 쓴 것이며, 예화는 한 부분만 견주는 것이므로 모든 세부를 맞추려 하지 않아도 됩니다.","s":3728.256,"e":3741.46,"p":false,"h":false},{"t":"가르칠 때는 두 가지만 덧붙이시기 바랍니다.","s":3742.104,"e":3745.376,"p":false,"h":false},{"t":"첫째, 상속은 행위의 보상이 아니라 신분의 결과입니다(롬 8:17).","s":3745.992,"e":3752.074,"p":false,"h":false},{"t":"둘째, 예화 속 아이는 혼자 습관을 고쳐야 하지만 성도 안에는 양자의 영이 계십니다(갈 4:6, 빌 2:12-13).","s":3752.52,"e":3763.499,"p":false,"h":false},{"t":"이 둘을 짚지 않으면 \"자녀다워져야 상속받는다\"는 율법주의로 읽힐 수 있고, 반대로 \"신분만 있으면 된다\"는 율법폐기론으로 읽히지 않도록 히 12:5-10(아버지의 징계)을 함께 보게 하면 좋습니다.","s":3764.04,"e":3780.635,"p":true,"h":false}]},{"title":"나가며","audio":"book_2611261521_3.mp3","start":0,"end":233.544,"dur":233.5,"segs":[{"t":"나가며","s":0,"e":0.768,"p":true,"h":false},{"t":"처음 질문으로 돌아와서","s":1.872,"e":3.658,"p":true,"h":false},{"t":"이 책은 하나의 질문으로 시작했습니다.","s":4.464,"e":7.202,"p":false,"h":false},{"t":"\"거룩하신 하나님과 죄 많은 백성이 어떻게 함께 살 수 있는가?\"","s":7.824,"e":12.123,"p":false,"h":false},{"t":"이제 그 답을 한 줄로 말할 수 있습니다.","s":12.744,"e":15.413,"p":false,"h":false},{"t":"하나님이 하셨습니다.","s":16.008,"e":17.528,"p":true,"h":false},{"t":"율법은 진단이었습니다.","s":18.384,"e":20.301,"p":false,"h":false},{"t":"엑스레이가 부러진 뼈를 정확히 보여 주듯, 율법은 거룩하신 하나님과 우리 사이의 거리(2장), 스스로 씻을 수 없는 부정(3장), 아무도 통과할 수 없는 기준(5장)을 숨김없이 보여 주었습니다.","s":20.952,"e":36.822,"p":false,"h":false},{"t":"복음은 처방이었습니다.","s":37.464,"e":39.205,"p":false,"h":false},{"t":"진단서의 마지막 줄 \"스스로 고칠 수 없음, 구원자가 필요함\"에 대한 응답으로 그리스도께서 오셨고, 하나님이 마련하신 제사의 길(4장)이 한 분 안에서 완성되었습니다(6장).","s":39.72,"e":53.777,"p":false,"h":false},{"t":"그리고 성도의 삶은 회복되어 가는 건강입니다(7장).","s":54.336,"e":58.529,"p":false,"h":false},{"t":"자녀가 된 신분 위에서 아버지를 닮아 자라 가고, 휘장이 찢어진 길로 날마다 나아가며, 한 식탁에 앉아 말씀을 나누는 삶입니다.","s":59.136,"e":68.006,"p":true,"h":false},{"t":"이 순서는 처음부터 끝까지 한 방향이었습니다.","s":68.904,"e":72.284,"p":false,"h":false},{"t":"구원이 먼저이고 율법이 그다음이었으며(1장), 신분이 먼저이고 순종이 그다음입니다(7장).","s":72.888,"e":80.868,"p":false,"h":false},{"t":"우리가 올라가는 사다리가 아니라 하나님이 내려오신 길이었습니다.","s":81.48,"e":85.676,"p":true,"h":false},{"t":"레위기를 다시 펴 보십시오","s":86.568,"e":88.561,"p":true,"h":false},{"t":"이제 이 책을 덮고 레위기를 다시 펴 보시기 바랍니다.","s":89.352,"e":93.21,"p":false,"h":false},{"t":"처음 읽을 때 낯설기만 하던 장면들이 달리 보일 것입니다.","s":93.84,"e":97.863,"p":false,"h":false},{"t":"번제단 앞에서 짐승의 머리에 손을 얹는 사람 위에서 \"보라 세상 죄를 지고 가는 하나님의 어린 양\"이 보이고, 속죄일에 피를 들고 지성소로 들어가는 대제사장 위에서 단번에 성소에 들어가신 우리의 대제사장이 보일 것입니다.","s":98.52,"e":113.751,"p":false,"h":false},{"t":"정결법의 \"부정하다, 부정하다\" 외침 속에서는 부정한 자에게 손을 대어 고치신 분의 손이 보일 것입니다.","s":114.36,"e":122.105,"p":true,"h":false},{"t":"1장에서 구약 성도들은 새벽빛을 바라보며 해가 뜨기를 기다린 사람들이라고 했습니다.","s":123,"e":128.574,"p":false,"h":false},{"t":"그들은 희미하게 보았고, 우리는 환하게 봅니다.","s":129.192,"e":132.762,"p":false,"h":false},{"t":"해가 뜬 뒤에 읽는 레위기는 더 이상 무거운 규칙집이 아니라, 그 해를 가리키던 새벽의 기록입니다.","s":133.344,"e":139.963,"p":true,"h":false},{"t":"함께 거하시는 하나님","s":140.856,"e":142.596,"p":true,"h":false},{"t":"성경은 처음부터 끝까지 한 가지를 말합니다.","s":143.472,"e":146.692,"p":false,"h":false},{"t":"하나님이 사람 가운데 거하시기를 원하신다는 것입니다.","s":147.24,"e":150.759,"p":false,"h":false},{"t":"시내산 아래서 하나님은 \"내가 그들 중에 거하리라\"고 하시며 성막을 세우게 하셨습니다(출 25:8).","s":151.416,"e":159.424,"p":false,"h":false},{"t":"때가 차매 \"말씀이 육신이 되어 우리 가운데 거하시매\", 곧 우리 가운데 장막을 치셨습니다(요 1:14).","s":159.96,"e":168.267,"p":false,"h":false},{"t":"그리고 성경의 마지막 장면에서는 이렇게 선언합니다.","s":168.744,"e":172.402,"p":false,"h":false},{"t":"\"하나님의 장막이 사람들과 함께 있으매 하나님이 그들과 함께 거하시리니\"(계 21:3).","s":173.016,"e":180.127,"p":true,"h":false},{"t":"휘장도, 거리도, 해마다 반복되던 제사도 없는 자리입니다.","s":180.744,"e":185.765,"p":false,"h":false},{"t":"레위기가 던진 질문의 끝에는 이 약속이 있었습니다.","s":186.36,"e":190.131,"p":false,"h":false},{"t":"거룩하신 하나님과 죄 많은 백성이 함께 사는 날입니다.","s":190.776,"e":194.549,"p":true,"h":false},{"t":"하나님을 즐거워하며","s":195.408,"e":196.946,"p":true,"h":false},{"t":"그날을 기다리는 동안, 우리의 걸음에는 이미 그 기쁨이 시작되어 있습니다.","s":197.784,"e":203.03,"p":false,"h":false},{"t":"구원은 점수를 계산하는 긴장이 아니라 다 차려진 잔치로의 초청입니다.","s":203.616,"e":208.611,"p":false,"h":false},{"t":"\"사람의 제일 되는 목적은 하나님을 영화롭게 하며 그를 영원토록 즐거워하는 것\"이라는 고백처럼, \"주의 앞에는 충만한 기쁨이 있습니다\"(시 16:11).","s":209.232,"e":221.33,"p":true,"h":false},{"t":"이 책이 선생님의 신앙에 작은 도움이라도 되었다면 바라는 것은 한 가지입니다.","s":222.048,"e":227.035,"p":false,"h":false},{"t":"은혜로 구원하신 하나님을, 오늘도 더 즐거워하며 사시기를 바랍니다.","s":227.64,"e":232.658,"p":true,"h":false}]},{"title":"부록 1. 율법의 세 갈래: 도덕법, 의식법, 시민법","audio":"book_2611261521_3.mp3","start":233.544,"end":658.92,"dur":425.4,"segs":[{"t":"부록 1.","s":233.544,"e":234.435,"p":false,"h":false},{"t":"율법의 세 갈래: 도덕법, 의식법, 시민법","s":235.416,"e":240.907,"p":true,"h":false},{"t":"그러면 오늘 우리는 무엇을 지키는가","s":241.704,"e":244.326,"p":true,"h":false},{"t":"레위기를 읽는 분들이 반드시 하는 질문이 있습니다.","s":245.208,"e":248.666,"p":false,"h":false},{"t":"\"그러면 오늘 나는 이 율법 가운데 무엇을 지켜야 하는가?","s":249.312,"e":253.125,"p":false,"h":false},{"t":"돼지고기는 먹어도 되는가?","s":253.776,"e":255.485,"p":false,"h":false},{"t":"십계명은 지키라면서 제사 규례는 왜 지키지 않는가?\"","s":256.104,"e":259.78,"p":false,"h":false},{"t":"이 질문에 답하려고 교회는 오래전부터 율법을 내용에 따라 세 갈래로 나누어 읽어 왔습니다.","s":260.424,"e":266.623,"p":true,"h":false},{"t":"도덕법: 사랑의 길","s":267.528,"e":269.898,"p":true,"h":false},{"t":"십계명으로 대표되는 도덕법은 하나님을 사랑하고 이웃을 사랑하는 길을 보여 줍니다.","s":270.672,"e":276.02,"p":false,"h":false},{"t":"이 율법은 이스라엘만을 위한 것이 아니라, 하나님이 사람을 지으신 본래의 모습에 뿌리를 둡니다(5장).","s":276.648,"e":284.053,"p":false,"h":false},{"t":"그래서 신약도 이 요구를 그대로 가져옵니다.","s":284.544,"e":287.577,"p":false,"h":false},{"t":"바울은 \"사랑은 율법의 완성\"이라고 하고(롬 13:8-10), 제5계명을 교회에 그대로 말합니다(엡 6:1-3).","s":288.192,"e":299.324,"p":false,"h":false},{"t":"도덕법은 폐지되지 않고, 그리스도께서 이루셨으며(6장), 이제 성령으로 성도의 마음에 새겨져 자녀가 걷는 길이 됩니다(7장).","s":299.904,"e":310.071,"p":true,"h":false},{"t":"의식법: 그림자의 길","s":310.872,"e":313.454,"p":true,"h":false},{"t":"제사, 성막, 제사장, 정결 규례, 절기, 음식 규례는 의식법에 속합니다.","s":314.256,"e":323.223,"p":false,"h":false},{"t":"이것들은 그리스도를 가리키는 그림자였습니다(4장).","s":323.808,"e":327.942,"p":false,"h":false},{"t":"그래서 의식법은 \"폐지되었다\"고 하기보다 \"성취되었다\"고 해야 정확합니다.","s":328.464,"e":334.631,"p":false,"h":false},{"t":"실체가 오셨으므로 그림자를 더 드릴 필요가 없습니다(히 10:1, 골 2:16-17).","s":335.256,"e":343.964,"p":false,"h":false},{"t":"예수님이 모든 음식을 깨끗하다 선언하셨고(막 7:19), 베드로가 환상을 통해 이방인에게 복음을 전했으며(행 10장), 예루살렘 공의회가 이방인 성도에게 할례와 율법의 멍에를 지우지 않았던 것(행 15장)도 이 성취의 흐름 안에 있습니다.","s":344.424,"e":364.732,"p":false,"h":false},{"t":"의식법은 쓸모없는 규칙이 아니라, 오늘도 우리가 그리스도를 이해하는 가장 좋은 그림책입니다.","s":365.4,"e":372.024,"p":true,"h":false},{"t":"시민법: 나라의 길","s":372.888,"e":375.125,"p":true,"h":false},{"t":"시민법은 이스라엘이라는 나라를 다스리던 재판, 형벌, 토지, 사회 제도에 관한 규정입니다.","s":375.696,"e":383.274,"p":false,"h":false},{"t":"이는 하나님이 직접 다스리시던 이스라엘 나라에 주어진 것이어서, 그 나라의 제도와 함께 그 역할을 마쳤습니다.","s":383.904,"e":391.419,"p":false,"h":false},{"t":"교회는 정치적 국가가 아니기 때문입니다(요 18:36).","s":392.04,"e":397.504,"p":false,"h":false},{"t":"그렇다고 이 규정들이 무의미해진 것은 아닙니다.","s":397.872,"e":401.277,"p":false,"h":false},{"t":"그 안에 담긴 공평과 긍휼의 원리는 오늘도 지혜로 남아 있습니다.","s":401.808,"e":406.51,"p":false,"h":false},{"t":"지붕에 난간을 두라는 규정(신 22:8)은 이웃의 생명을 지키는 마음을, 곡식 떠는 소에게 망을 씌우지 말라는 규정(신 25:4)은 일하는 사람에게 마땅한 삯을 주는 마음을 가르칩니다.","s":407.112,"e":423.169,"p":false,"h":false},{"t":"바울은 이 소 규정을 가져와 복음 사역자를 돌보는 일에 적용했습니다(고전 9:9-10).","s":423.744,"e":431.196,"p":false,"h":false},{"t":"형벌의 조항을 그대로 옮기는 것이 아니라 그 안의 원리를 오늘의 자리에 옮기는 것입니다.","s":431.736,"e":437.632,"p":true,"h":false},{"t":"세 갈래가 모이는 곳","s":438.528,"e":440.144,"p":true,"h":false},{"t":"이 세 갈래는 모두 한 분께로 모입니다.","s":440.832,"e":443.751,"p":false,"h":false},{"t":"도덕법의 요구는 그분이 한평생의 순종으로 이루셨습니다.","s":444.408,"e":448.45,"p":false,"h":false},{"t":"의식법이 가리키던 실체는 그분 자신입니다.","s":449.016,"e":452.196,"p":false,"h":false},{"t":"시민법이 다스리던 이스라엘 나라는 그분이 다스리시는 하나님 나라를 미리 보여 주는 그림이었습니다.","s":452.808,"e":459.033,"p":false,"h":false},{"t":"율법을 어느 한 부분만 붙들거나 어느 한 부분만 버리는 것이 아니라, 전체를 그리스도 안에서 읽을 때 레위기는 제자리를 찾습니다.","s":459.648,"e":468.134,"p":true,"h":false},{"t":"낯선 용어 풀이","s":469.056,"e":470.406,"p":true,"h":false},{"t":"• 도덕법: 하나님과 이웃을 사랑하는 길을 가르치는 율법.","s":471.264,"e":475.695,"p":false,"h":false},{"t":"십계명이 중심입니다.","s":476.28,"e":477.973,"p":true,"h":false},{"t":"• 의식법: 제사와 성막, 정결 규례처럼 하나님께 나아가는 방식을 정한 율법.","s":478.848,"e":485.265,"p":false,"h":false},{"t":"그리스도를 예표했습니다.","s":485.88,"e":487.677,"p":true,"h":false},{"t":"• 시민법: 이스라엘이라는 나라의 재판, 형벌, 토지 등을 다스리던 율법입니다.","s":488.544,"e":495.119,"p":true,"h":false},{"t":"• 성취: 그림자가 가리키던 실체가 와서 그 뜻이 온전히 이루어진 것입니다.","s":496.008,"e":501.943,"p":true,"h":false},{"t":"한 줄 요약","s":502.848,"e":503.811,"p":true,"h":false},{"t":"율법은 도덕법, 의식법, 시민법으로 나뉘며, 도덕법은 성도의 삶의 길로 남고 의식법은 그리스도 안에서 성취되었고 시민법은 그 원리가 지혜로 남으며, 셋 모두 그리스도께로 모입니다.","s":504.72,"e":519.588,"p":true,"h":false},{"t":"함께 나눠 볼 질문","s":520.488,"e":522.017,"p":true,"h":false},{"t":"1.","s":522.816,"e":523.351,"p":false,"h":false},{"t":"\"이 율법은 지켜야 하고, 저 율법은 지키지 않아도 된다\"고 막연히 생각해 온 기준이 있다면 무엇이었는가?","s":524.688,"e":532.361,"p":true,"h":false},{"t":"2.","s":533.208,"e":533.493,"p":false,"h":false},{"t":"의식법을 \"폐지된 규칙\"이 아니라 \"그리스도를 보여 주는 그림책\"으로 읽으면 레위기가 어떻게 달라지는가?","s":533.808,"e":541.316,"p":true,"h":false},{"t":"3.","s":542.184,"e":542.773,"p":false,"h":false},{"t":"시민법의 원리(예: 이웃의 안전, 일하는 사람에게 마땅한 삯)를 오늘 내 삶에 옮긴다면 어떤 모습이 되겠는가?","s":544.056,"e":553.438,"p":true,"h":false},{"t":"목회자 노트 (부록 1)","s":554.352,"e":556.895,"p":true,"h":false},{"t":"1.","s":557.52,"e":558.055,"p":false,"h":false},{"t":"구분의 한계를 밝혀 두십시오.","s":559.392,"e":561.42,"p":false,"h":false},{"t":"도덕·의식·시민법의 삼분법은 성경이 붙인 이름이 아니라, 교회가 율법을 이해하려고 쓰는 틀입니다(웨스트민스터 신앙고백서 19장 참조).","s":561.984,"e":572.251,"p":false,"h":false},{"t":"한 규정이 둘에 걸치는 경우도 많습니다(안식일 계명은 십계명에 있으면서 의식적인 요소가 있고, 레 19장에는 도덕 규정과 의식 규정이 섞여 있습니다).","s":572.76,"e":584.42,"p":false,"h":false},{"t":"구분을 기계적으로 적용하지 말고 이해를 돕는 틀로만 쓰시기 바랍니다.","s":585.048,"e":589.532,"p":true,"h":false},{"t":"2.","s":590.4,"e":590.685,"p":false,"h":false},{"t":"의식법은 폐기가 아니라 성취입니다.","s":591,"e":593.637,"p":false,"h":false},{"t":"\"의식법은 구약의 낡은 규칙\"이라는 인상을 주지 않도록 하고, 1장과 6장의 \"그림자는 사라지지 않고 실체 안에서 완성된다\"는 틀을 이어서 가르치십시오.","s":594.264,"e":605.732,"p":true,"h":false},{"t":"3.","s":606.264,"e":606.853,"p":false,"h":false},{"t":"시민법의 현대적 적용에는 신중하십시오.","s":608.136,"e":610.978,"p":false,"h":false},{"t":"시민법의 일반적 공평의 원리를 오늘에 적용하는 것(신앙고백서 19장 4항)과 구약의 형벌 조항을 오늘의 국가에 그대로 적용하자는 주장은 다른 입장입니다.","s":611.52,"e":622.785,"p":false,"h":false},{"t":"본문은 앞의 입장을 따랐으며, 후자는 교단과 학자에 따라 다양하니 교단 입장에 맞게 가르치시기 바랍니다.","s":623.376,"e":630.94,"p":true,"h":false},{"t":"4.","s":631.8,"e":632.346,"p":false,"h":false},{"t":"세 갈래(내용의 구분)와 율법의 세 용도(기능의 구분)는 서로 다른 구분입니다.","s":633.672,"e":641.49,"p":false,"h":false},{"t":"5장 노트의 제1용도(거울), 7장 노트의 제3용도(성도의 삶의 길)와 혼동하지 않도록 가르치십시오.","s":642.12,"e":651.352,"p":false,"h":false},{"t":"도덕법은 세 용도 모두에 걸치고, 의식법은 그리스도를 가리키는 계시로서 기능했습니다.","s":651.888,"e":658.031,"p":true,"h":false}]},{"title":"부록 2. 율법의 또 다른 쓰임: 세상을 붙드는 율법","audio":"book_2611261521_3.mp3","start":658.92,"end":1053.192,"dur":394.3,"segs":[{"t":"부록 2.","s":658.92,"e":659.818,"p":false,"h":false},{"t":"율법의 또 다른 쓰임: 세상을 붙드는 율법","s":660.792,"e":664.485,"p":true,"h":false},{"t":"율법에는 쓰임이 하나 더 있습니다","s":665.28,"e":667.724,"p":true,"h":false},{"t":"5장에서 우리는 율법이 죄를 비추는 거울임을 보았고, 7장에서는 구원받은 자녀가 걸어갈 길임을 보았습니다.","s":668.568,"e":675.923,"p":false,"h":false},{"t":"그런데 율법에는 믿는 사람의 자리가 아니라 믿지 않는 사람들까지 함께 사는 세상의 자리에서 하는 일이 하나 더 있습니다.","s":676.536,"e":684.56,"p":false,"h":false},{"t":"교회는 이것을 율법의 시민적 용도, 곧 제2용도라고 불러 왔습니다.","s":685.176,"e":690.58,"p":true,"h":false},{"t":"양심에 새겨진 율법","s":691.44,"e":693.12,"p":true,"h":false},{"t":"율법이 없던 이방인에게도 율법의 요구가 마음에 새겨져 있다고 바울은 말합니다(롬 2:14-15).","s":693.936,"e":701.983,"p":false,"h":false},{"t":"도둑질이 나쁘고 거짓말이 나쁘다는 것을 성경을 읽어 보지 않은 사람도 압니다.","s":702.504,"e":707.648,"p":false,"h":false},{"t":"이것은 하나님이 사람을 자기 형상대로 지으실 때 새기신 것이어서(5장), 타락으로 흐려졌지만 완전히 지워지지는 않았습니다.","s":708.288,"e":717.275,"p":true,"h":false},{"t":"세상을 붙드는 법과 질서","s":718.104,"e":720.15,"p":true,"h":false},{"t":"하나님은 이 양심과 함께 나라의 법과 권세를 두어 악을 억제하게 하셨습니다.","s":721.008,"e":726.278,"p":false,"h":false},{"t":"바울은 권세가 하나님이 세우신 것이며 악을 행하는 자에게 두려움이 된다고 말합니다(롬 13:1-4).","s":726.912,"e":734.868,"p":false,"h":false},{"t":"디모데전서 1:9-10은 율법이 불법한 자와 방종한 자를 위해 있다고 합니다.","s":735.456,"e":741.511,"p":false,"h":false},{"t":"이 쓰임이 없다면 죄는 곧바로 극에 달하고, 가정도, 학교도, 교회도 평안히 설 수 없을 것입니다.","s":742.176,"e":749.745,"p":false,"h":false},{"t":"법과 질서가 완전하지 않아도, 그 덕분에 세상은 아직 무너지지 않고 서 있습니다.","s":750.384,"e":756.092,"p":true,"h":false},{"t":"이것은 사람을 구원하는 일이 아니라 세상을 보존하는 일입니다.","s":756.984,"e":761.319,"p":false,"h":false},{"t":"하나님은 구원받지 못한 사람들에게도 선하신 손길을 거두지 않으십니다.","s":761.952,"e":766.833,"p":true,"h":false},{"t":"복음이 전해질 시간","s":767.688,"e":769.26,"p":true,"h":false},{"t":"하나님이 죄를 이렇게 억제하시는 데는 이유가 있습니다.","s":770.016,"e":773.41,"p":false,"h":false},{"t":"베드로는 하나님이 오래 참으시며 아무도 멸망하지 않고 모두 회개하기에 이르기를 원하신다고 말합니다(벧후 3:9).","s":774.048,"e":782.786,"p":false,"h":false},{"t":"법과 질서가 세상을 붙들고 있는 동안, 복음이 전해질 시간이 주어집니다.","s":783.36,"e":788.584,"p":false,"h":false},{"t":"이 용도는 구원과 무관해 보이지만, 복음이 달려갈 길을 닦는 하나님의 은혜입니다.","s":789.24,"e":795.089,"p":true,"h":false},{"t":"그러나 법이 구원하지는 못합니다","s":795.984,"e":798.603,"p":true,"h":false},{"t":"법은 겉을 억제할 뿐 마음은 바꾸지 못합니다.","s":799.44,"e":802.615,"p":false,"h":false},{"t":"5장에서 보았듯이, 겉으로 바른 모습이 곧 마음의 모습은 아닙니다.","s":803.208,"e":808.243,"p":false,"h":false},{"t":"법을 잘 지키는 사회가 곧 구원받은 사회는 아니고, 법을 잘 지키는 사람이 곧 의로운 사람도 아닙니다.","s":808.872,"e":816.365,"p":false,"h":false},{"t":"마음을 바꾸시는 분은 그리스도와 성령이십니다.","s":816.984,"e":820.123,"p":true,"h":false},{"t":"이 모든 일 위에 계신 분","s":820.992,"e":822.986,"p":true,"h":false},{"t":"만물이 그리스도로 말미암아 지음 받았고, 만물이 그분 안에 함께 서 있다고 바울은 말합니다(골 1:16-17).","s":823.752,"e":833.057,"p":false,"h":false},{"t":"믿지 않는 사람들이 사는 세상을 붙들고 계신 분도 결국 그분이십니다.","s":833.544,"e":838.386,"p":false,"h":false},{"t":"그리고 양심이 법 앞에서 찔릴 때, 그것은 거울의 첫 걸음이 되어 사람을 그리스도께로 이끄는 길목이 되기도 합니다.","s":838.992,"e":846.95,"p":false,"h":false},{"t":"제2용도는 제1용도와 이렇게 이어져 있습니다.","s":847.584,"e":851.08,"p":true,"h":false},{"t":"낯선 용어 풀이","s":851.904,"e":853.254,"p":true,"h":false},{"t":"시민적 용도(제2용도): 율법이 사회 안에서 악을 억제하고 질서를 지키게 하는 쓰임입니다.","s":854.112,"e":860.771,"p":true,"h":false},{"t":"양심: 하나님이 사람 마음에 새기신, 옳고 그름을 아는 감각입니다.","s":861.624,"e":867.408,"p":true,"h":false},{"t":"일반은총: 구원과는 별개로 하나님이 모든 사람과 세상에 베푸시는 선하신 은혜입니다.","s":868.272,"e":874.555,"p":false,"h":false},{"t":"법과 질서, 자연의 질서가 여기에 속합니다.","s":875.184,"e":878.793,"p":true,"h":false},{"t":"권세: 나라를 다스리도록 하나님이 세우신 권위를 말합니다.","s":879.696,"e":883.99,"p":true,"h":false},{"t":"한 줄 요약","s":884.784,"e":885.747,"p":true,"h":false},{"t":"율법은 믿지 않는 사람이 사는 세상에서도 양심과 법으로 악을 억제하여 세상을 붙들고 복음이 전해질 시간을 벌어 주지만, 사람의 마음을 구원하는 것은 그리스도뿐입니다.","s":886.656,"e":897.501,"p":true,"h":false},{"t":"함께 나눠 볼 질문","s":898.392,"e":899.921,"p":true,"h":false},{"t":"성경을 모르는 사람도 \"이건 아니다\"라고 아는 것이 있다면, 그것은 하나님에 대해 무엇을 말해 주는가?","s":900.72,"e":907.604,"p":true,"h":false},{"t":"법과 질서 덕분에 내가 누리고 있는 평안에는 어떤 것이 있는가?","s":908.52,"e":912.596,"p":false,"h":false},{"t":"그것을 하나님의 은혜로 받아 본 적이 있는가?","s":913.248,"e":915.883,"p":true,"h":false},{"t":"겉으로 착한 사람들을 볼 때, 이 부록의 \"법은 겉을 억제하지만 마음은 바꾸지 못한다\"는 말은 복음을 전하는 데 어떤 도움이 되는가?","s":916.776,"e":925.302,"p":true,"h":false},{"t":"목회자 노트 (부록 2)","s":926.184,"e":928.868,"p":true,"h":false},{"t":"용어와 순서를 확인하십시오.","s":929.496,"e":931.53,"p":false,"h":false},{"t":"이 책은 개혁파의 순서를 따랐습니다.","s":932.136,"e":934.857,"p":false,"h":false},{"t":"제1용도는 신학적·교육적 용도(거울, 5장), 제2용도는 시민적 용도(이 부록), 제3용도는 성도의 삶의 규범(7장)입니다.","s":935.448,"e":949.465,"p":false,"h":false},{"t":"루터교 전통은 시민적 용도를 제1용도로, 신학적 용도를 제2용도로 부르므로, 다른 책을 참고하실 때 번호가 뒤바뀌어 있을 수 있습니다.","s":950.04,"e":959.485,"p":true,"h":false},{"t":"부록 1의 시민법과 구분하십시오.","s":960.24,"e":962.658,"p":false,"h":false},{"t":"시민법은 이스라엘 나라에 주어진 구체적인 규정이고, 제2용도는 율법(주로 도덕법)이 오늘의 사회에서 하는 기능입니다.","s":963.12,"e":972.937,"p":false,"h":false},{"t":"둘을 같은 것으로 설명하면 혼동이 생깁니다.","s":973.56,"e":976.68,"p":true,"h":false},{"t":"성경 근거.","s":977.424,"e":978.477,"p":false,"h":false},{"t":"롬 2:14-15(양심), 롬 13:1-4(권세), 딤전 1:8-10(율법의 쓰임), 벧후 3:9(오래 참으심)가 중심입니다.","s":979.296,"e":996.511,"p":false,"h":false},{"t":"일반은총과 관련된 구절로 마 5:45, 행 14:17, 행 17:25-28을 함께 보실 수 있습니다.","s":997.152,"e":1007.885,"p":true,"h":false},{"t":"이 용도를 교회가 특정 정치 노선이나 정책을 지지하는 근거로 삼지 않도록 주의하십시오.","s":1008.768,"e":1014.609,"p":false,"h":false},{"t":"제2용도는 하나님이 세상의 질서를 보존하신다는 신학적 사실을 말하는 것이지, 교회가 어떤 법이나 정당을 지지해야 한다는 뜻이 아닙니다.","s":1015.152,"e":1024.457,"p":false,"h":false},{"t":"교회의 사명은 복음 전파이고, 세상의 질서는 국가의 소관이라는 구별(요 18:36, 롬 13장)을 유지하는 것이 성경적입니다.","s":1025.064,"e":1036.769,"p":true,"h":false},{"t":"제1용도와의 연결.","s":1037.64,"e":1039.289,"p":false,"h":false},{"t":"제2용도가 강조되면 \"법으로 사회를 바르게 하면 된다\"는 인상을 줄 수 있습니다.","s":1039.776,"e":1045.262,"p":false,"h":false},{"t":"5장 노트 8번과 같이, 마지막에는 법의 한계와 복음으로 방향을 돌려 가르치십시오.","s":1045.896,"e":1052.397,"p":true,"h":false}]},{"title":"부록 3. 음식법은 어떻게 성취되었는가","audio":"book_2611261521_3.mp3","start":1053.192,"end":1601.952,"dur":548.8,"segs":[{"t":"부록 3.","s":1053.192,"e":1054.113,"p":false,"h":false},{"t":"음식법은 어떻게 성취되었는가","s":1055.064,"e":1057.369,"p":true,"h":false},{"t":"그러면 지금은 무엇이든 먹어도 되는가","s":1058.232,"e":1061.003,"p":true,"h":false},{"t":"3장에서 우리는 음식 규례가 하나님이 구별된 백성을 식탁 위에까지 새기신 가르침이었음을 보았습니다(레 11:44-45).","s":1061.88,"e":1072.015,"p":false,"h":false},{"t":"그런데 오늘 성도들은 돼지고기도, 새우도 먹습니다.","s":1072.512,"e":1076.433,"p":false,"h":false},{"t":"이것은 신앙이 느슨해진 것일까요, 아니면 성경이 허락한 일일까요?","s":1077.048,"e":1081.908,"p":false,"h":false},{"t":"신약은 이 질문에 분명하게 답합니다.","s":1082.544,"e":1085.318,"p":true,"h":false},{"t":"예수님의 선언: 문제는 입 밖에 있지 않습니다","s":1086.216,"e":1089.999,"p":true,"h":false},{"t":"예수님은 제자들과 바리새인들이 정결 문제로 논쟁할 때 이렇게 가르치셨습니다.","s":1090.872,"e":1096.304,"p":false,"h":false},{"t":"밖에서 사람 안으로 들어가는 것은 사람을 더럽게 하지 못하고, 사람 속에서 나오는 것이 사람을 더럽게 한다는 것입니다(막 7:14-23).","s":1096.92,"e":1107.867,"p":false,"h":false},{"t":"음식은 배로 들어가 몸 밖으로 나갈 뿐 마음에 들어가지 않습니다.","s":1108.416,"e":1112.746,"p":false,"h":false},{"t":"더러움의 뿌리는 음식이 아니라 마음입니다.","s":1113.36,"e":1116.205,"p":false,"h":false},{"t":"마가는 이 말씀을 이렇게 풀이해 둡니다.","s":1116.816,"e":1119.708,"p":false,"h":false},{"t":"예수님이 이렇게 하심으로 모든 음식을 깨끗하다 선언하신 것이라고(막 7:19).","s":1120.368,"e":1126.826,"p":false,"h":false},{"t":"이것은 3장에서 본 정결법의 한계가 드러나는 순간입니다.","s":1127.4,"e":1131.383,"p":false,"h":false},{"t":"사람의 부정을 씻을 수 있는 것은 음식을 가리는 규례가 아니라, 마음을 새롭게 하시는 분입니다.","s":1131.936,"e":1138.207,"p":true,"h":false},{"t":"베드로의 환상: 먹는 이야기 같지만 사람 이야기입니다","s":1139.088,"e":1143.571,"p":true,"h":false},{"t":"사도행전 10장에서 베드로는 하늘에서 내려온 보자기에 온갖 짐승이 담긴 것을 보고, 잡아먹으라는 음성을 듣습니다.","s":1144.488,"e":1152.225,"p":false,"h":false},{"t":"베드로는 속되고 깨끗하지 않은 것은 먹은 적이 없다고 거절하지만, 하나님은 \"하나님이 깨끗하게 하신 것을 네가 속되다 하지 말라\"고 하십니다.","s":1152.888,"e":1161.844,"p":false,"h":false},{"t":"이것이 세 번 반복됩니다.","s":1162.464,"e":1164.469,"p":false,"h":false},{"t":"그런데 이 환상은 음식에 대한 가르침으로 끝나지 않습니다.","s":1165.08,"e":1169.113,"p":false,"h":false},{"t":"곧바로 로마 백부장 고넬료의 집으로 인도하기 때문입니다.","s":1169.712,"e":1173.592,"p":false,"h":false},{"t":"베드로는 그제야 환상의 뜻을 깨닫습니다.","s":1174.176,"e":1177.088,"p":false,"h":false},{"t":"하나님은 어떤 사람도 속되다거나 깨끗하지 않다고 하지 말라고 가르치신 것이라고(행 10:28).","s":1177.704,"e":1185.148,"p":false,"h":false},{"t":"음식의 구별이 사람의 구별을 낳았고, 사람의 구별 때문에 이방인은 복음의 문 밖에 서 있었습니다.","s":1185.672,"e":1192.401,"p":false,"h":false},{"t":"하나님은 그 담을 허물기 위해 먼저 식탁의 담을 허무신 것입니다.","s":1193.016,"e":1197.286,"p":true,"h":false},{"t":"담이 무너진 자리","s":1197.816,"e":1199.2,"p":true,"h":false},{"t":"바울은 이 일을 이렇게 설명합니다.","s":1200.048,"e":1202.518,"p":false,"h":false},{"t":"그리스도께서 유대인과 이방인 사이에 있던 막힌 담을 허물고 둘을 한 몸으로 만드셨다고(엡 2:14-16).","s":1203.144,"e":1211.838,"p":false,"h":false},{"t":"음식 규례는 이스라엘을 열방과 구별하던 가장 일상적인 담이었습니다.","s":1212.384,"e":1217.508,"p":false,"h":false},{"t":"그 구별의 목적은 하나님께 속한 거룩한 백성이라는 정체성을 지키는 것이었습니다.","s":1218.192,"e":1223.812,"p":false,"h":false},{"t":"그리스도 안에서 이 정체성은 없어지지 않고, 식탁의 규칙이 아니라 그분께 속했다는 사실로 완성되었습니다(벧전 2:9).","s":1224.456,"e":1234.243,"p":false,"h":false},{"t":"그래서 예루살렘 공의회도 이방인 성도에게 율법의 멍에를 지우지 않기로 했습니다(행 15장).","s":1234.776,"e":1242.061,"p":true,"h":false},{"t":"그림자와 실체, 그리고 감사함으로 받는 식탁","s":1242.864,"e":1246.708,"p":true,"h":false},{"t":"바울은 골로새교회에 이렇게 씁니다.","s":1247.544,"e":1250.126,"p":false,"h":false},{"t":"먹고 마시는 것으로 아무도 너희를 비판하지 못하게 하라.","s":1250.76,"e":1254.36,"p":false,"h":false},{"t":"이것들은 장래 일의 그림자이고 몸은 그리스도의 것이라고(골 2:16-17).","s":1255.008,"e":1262.04,"p":false,"h":false},{"t":"음식법은 그림자였고, 실체가 오셨습니다.","s":1262.52,"e":1266.078,"p":false,"h":false},{"t":"디모데에게는 이렇게 가르칩니다.","s":1266.6,"e":1268.969,"p":false,"h":false},{"t":"\"하나님의 지으신 모든 것이 선하매 감사함으로 받으면 버릴 것이 없나니\"(딤전 4:4).","s":1269.576,"e":1276.156,"p":false,"h":false},{"t":"창조 때 \"보시기에 좋았더라\" 하신 세상의 음식이, 그리스도 안에서 다시 감사함으로 받는 선물이 된 것입니다.","s":1276.728,"e":1284.302,"p":true,"h":false},{"t":"오늘 우리의 식탁","s":1285.224,"e":1286.691,"p":true,"h":false},{"t":"그렇다고 아무렇게나 먹으면 된다는 뜻은 아닙니다.","s":1287.528,"e":1291.007,"p":false,"h":false},{"t":"바울은 로마교회에서 먹는 문제로 서로를 판단하던 성도들에게 두 가지를 말합니다(롬 14장).","s":1291.632,"e":1298.761,"p":false,"h":false},{"t":"먹는 사람은 먹지 않는 사람을 업신여기지 말고, 먹지 않는 사람은 먹는 사람을 판단하지 말라.","s":1299.312,"e":1305.955,"p":false,"h":false},{"t":"그리고 자유가 믿음이 약한 형제를 넘어지게 하는 걸림이 되어서는 안 된다는 것입니다(고전 8장).","s":1306.632,"e":1313.704,"p":false,"h":false},{"t":"자유는 사랑 안에서 쓰는 자유입니다.","s":1314.288,"e":1317.019,"p":true,"h":false},{"t":"구별은 없어진 것이 아니라 자리가 옮겨졌습니다.","s":1317.792,"e":1321.163,"p":false,"h":false},{"t":"이스라엘은 식탁에서 구별되었지만, 성도는 삶 전체가 하나님께 속한 자로 구별됩니다(7장).","s":1321.824,"e":1329.053,"p":false,"h":false},{"t":"그리고 성도에게는 새로운 식탁이 있습니다.","s":1329.624,"e":1332.448,"p":false,"h":false},{"t":"그리스도께서 자기 몸과 피로 세우신 새 언약의 식탁, 주의 만찬입니다(고전 11:23-26).","s":1332.984,"e":1342.292,"p":false,"h":false},{"t":"구약의 화목제에서 하나님과 사람이 함께 나누던 식탁은, 이제 그리스도 안에서 이 식탁으로 이어집니다.","s":1342.824,"e":1349.719,"p":true,"h":false},{"t":"낯선 용어 풀이","s":1350.6,"e":1351.95,"p":true,"h":false},{"t":"• 정결 선언: 음식을 포함한 모든 것에 대해 \"깨끗하다\"고 선포하는 일.","s":1352.808,"e":1358.349,"p":false,"h":false},{"t":"막 7:19에서 마가가 예수님의 가르침을 풀이한 표현입니다.","s":1358.976,"e":1363.763,"p":true,"h":false},{"t":"• 공의회: 교회의 중요한 문제를 결정하려고 지도자들이 모인 회의.","s":1364.64,"e":1369.67,"p":false,"h":false},{"t":"행 15장의 예루살렘 공의회가 대표적입니다.","s":1370.256,"e":1373.802,"p":true,"h":false},{"t":"• 걸림: 믿음이 약한 사람이 나의 행동 때문에 믿음에서 넘어지게 되는 일입니다.","s":1374.696,"e":1380.457,"p":true,"h":false},{"t":"• 주의 만찬: 그리스도께서 자기 몸과 피로 세우신 새 언약을 기억하고 누리는 성도의 식탁입니다.","s":1381.344,"e":1388.434,"p":true,"h":false},{"t":"한 줄 요약","s":1389.336,"e":1390.299,"p":true,"h":false},{"t":"음식법의 구별은 그리스도 안에서 폐지가 아니라 성취되어 모든 음식이 감사함으로 받는 선물이 되었고, 성도는 사랑 안에서 그 자유를 누리며 삶 전체로 구별되어 살아갑니다.","s":1391.208,"e":1402.475,"p":true,"h":false},{"t":"함께 나눠 볼 질문","s":1403.28,"e":1404.809,"p":true,"h":false},{"t":"1.","s":1405.608,"e":1406.143,"p":false,"h":false},{"t":"음식 문제로 다른 사람을 판단하거나 판단받은 경험이 있다면, 롬 14장의 말씀은 그 일을 어떻게 다시 보게 하는가?","s":1407.48,"e":1415.476,"p":true,"h":false},{"t":"2.","s":1416.36,"e":1416.645,"p":false,"h":false},{"t":"베드로의 환상이 음식 이야기가 아니라 사람 이야기였다는 것은, 내가 은연중에 \"속되다\" 하여 밀어내고 있는 사람은 없는지 돌아보게 하는가?","s":1416.96,"e":1425.942,"p":true,"h":false},{"t":"3.","s":1426.824,"e":1427.413,"p":false,"h":false},{"t":"주의 만찬을 \"새 언약의 식탁\"으로 생각하면, 그 자리에 앉는 마음은 어떻게 달라지는가?","s":1428.696,"e":1434.653,"p":true,"h":false},{"t":"목회자 노트 (부록 3)","s":1435.512,"e":1438.179,"p":true,"h":false},{"t":"1.","s":1438.944,"e":1439.479,"p":false,"h":false},{"t":"구약과 신약의 연속성.","s":1440.816,"e":1442.628,"p":false,"h":false},{"t":"성취의 틀을 유지하십시오.","s":1442.808,"e":1444.68,"p":false,"h":false},{"t":"\"구약 음식법은 낡았다\"가 아니라 \"그림자가 가리키던 실체가 오고, 구별의 목적이 그리스도 안에서 이루어졌다\"입니다(1장, 6장 노트와 같은 틀).","s":1445.16,"e":1456.956,"p":true,"h":false},{"t":"2.","s":1457.76,"e":1458.045,"p":false,"h":false},{"t":"막 7:19의 해석.","s":1458.36,"e":1460.654,"p":false,"h":false},{"t":"마가가 덧붙인 해설로 보는 것이 일반적이며(개역개정 역시 괄호로 표기), 예수님이 이 말씀으로 음식 규례의 구별 기능이 종결됨을 선언하셨다고 이해하는 입장이 널리 받아들여집니다.","s":1461.144,"e":1473.94,"p":false,"h":false},{"t":"번역본마다 표기가 다르니 원문 형식을 확인하시기 바랍니다.","s":1474.584,"e":1478.614,"p":true,"h":false},{"t":"3.","s":1479.528,"e":1480.117,"p":false,"h":false},{"t":"행 10장의 해석 열쇠.","s":1481.4,"e":1483.627,"p":false,"h":false},{"t":"환상의 직접 해석은 행 10:28과 10:34-35, 11:17-18에 있습니다.","s":1483.8,"e":1492.178,"p":false,"h":false},{"t":"환상의 핵심은 음식 자체가 아니라 이방인에게 복음이 열린다는 점입니다.","s":1492.776,"e":1497.763,"p":true,"h":false},{"t":"4.","s":1498.656,"e":1499.202,"p":false,"h":false},{"t":"바울의 두 방향 균형.","s":1500.528,"e":1502.22,"p":false,"h":false},{"t":"롬 14장과 고전 8장은 자유와 사랑의 균형을 가르칩니다.","s":1502.832,"e":1508.019,"p":false,"h":false},{"t":"자유를 강조하여 \"아무렇게나 먹어도 된다\"로 읽히거나, 배려를 강조하여 \"약한 자 때문에 늘 포기해야 한다\"로 읽히지 않도록 하십시오.","s":1508.616,"e":1518.265,"p":false,"h":false},{"t":"바울은 믿음의 확신이 있는 사람과 약한 사람을 모두 존중하되, 복음의 진리를 양보하는 일(갈 2:11-14)과 형제를 배려하는 일을 구별합니다.","s":1518.864,"e":1531.292,"p":true,"h":false},{"t":"5.","s":1532.184,"e":1532.598,"p":false,"h":false},{"t":"음식법 준수를 요구하는 가르침에 대하여.","s":1534.056,"e":1536.909,"p":false,"h":false},{"t":"오늘날 레위기 음식법을 그리스도인에게 의무로 요구하는 입장이 있습니다.","s":1537.536,"e":1542.426,"p":false,"h":false},{"t":"이에 대한 성경의 답은 골 2:16-17, 갈 2:11-14, 행 15장, 딤전 4:3-5입니다.","s":1543.056,"e":1554.923,"p":false,"h":false},{"t":"상대를 정죄하는 어조보다, 그림자가 실체로 성취되었다는 복음의 논리로 설명하는 것이 좋습니다.","s":1555.56,"e":1562.247,"p":true,"h":false},{"t":"6.","s":1563.12,"e":1563.688,"p":false,"h":false},{"t":"건강과 위생 논의.","s":1564.992,"e":1566.559,"p":false,"h":false},{"t":"3장 본문에서 말했듯 음식법의 목적에 대한 위생설은 하나의 해석일 뿐, 본문이 명시한 이유는 거룩과 구별입니다.","s":1567.176,"e":1575.062,"p":false,"h":false},{"t":"건강을 위한 지혜로운 식생활과 구약 음식법의 신학적 의미는 구분해서 가르치십시오.","s":1575.72,"e":1581.405,"p":true,"h":false},{"t":"7.","s":1582.152,"e":1582.8,"p":false,"h":false},{"t":"주의 만찬과의 연결.","s":1584.024,"e":1585.684,"p":false,"h":false},{"t":"화목제(4장)에서 주의 만찬으로 이어지는 흐름은 개혁파의 은혜언약 이해와도 맞닿습니다.","s":1586.04,"e":1593.139,"p":false,"h":false},{"t":"다만 구약 화목제와 주의 만찬을 일대일로 대응시키는 데에는 신중하시고, 성취의 방향을 중심으로 가르치십시오.","s":1593.768,"e":1601.484,"p":true,"h":false}]}], LIST = "index.html";

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let k = 0, SEGS = [], spd = 1, fsi = 2, last = -1, lastUser = 0, playing = false, tickId = 0, curSrc = '', endTimer = 0, lastSave = 0;
  const audio = new Audio();
  audio.preload = 'metadata';

  function pref(key, v) { try { if (v === undefined) { return localStorage.getItem(KEY + ':' + key); } localStorage.setItem(KEY + ':' + key, String(v)); } catch (e) { return null; } }
  const savedSpd = parseInt(pref('spd'), 10); if (savedSpd >= 0 && savedSpd < SPEEDS.length) { spd = savedSpd; }
  const savedFs = parseInt(pref('fs'), 10); if (savedFs >= 0 && savedFs < FS.length) { fsi = savedFs; }
  function fmt(s) { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + String(x).padStart(2, '0'); }
  function T() { return TRACKS[k]; }
  function localT() { return Math.max(0, Math.min(T().dur, (audio.currentTime || 0) - T().start)); }

  function applyFs() { document.documentElement.style.setProperty('--fs', FS[fsi] + 'px'); }
  function applySpd() { audio.playbackRate = SPEEDS[spd]; audio.defaultPlaybackRate = SPEEDS[spd]; $('spd').textContent = SPEEDS[spd].toFixed(1) + 'x'; }
  applyFs(); applySpd();

  /* 강조와 따라가기 */
  window.addEventListener('wheel', () => { lastUser = Date.now(); }, { passive: true });
  window.addEventListener('touchmove', () => { lastUser = Date.now(); }, { passive: true });
  function idxAt(t) { let q = -1; for (let i = 0; i < SEGS.length; i++) { if (SEGS[i].s <= t + 0.03) { q = i; } else { break; } } return q; }
  function mark(i, follow) {
    if (i === last) { return; }
    const old = $('g' + last); if (old) { old.classList.remove('on'); }
    last = i;
    const el = $('g' + i); if (!el) { return; }
    el.classList.add('on');
    if (follow && Date.now() - lastUser > 2500) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {} }
  }
  function paint() {
    const t = audio.currentTime || 0, d = T().dur || 0, rel = Math.max(0, Math.min(d, t - T().start));
    $('cur').textContent = fmt(rel);
    if (d > 0) { $('fill').style.width = Math.min(100, rel / d * 100) + '%'; }
    mark(idxAt(t), playing);
    if (playing && t >= T().end - 0.06) { finishDoc(); }
  }
  function loop() { paint(); if (playing) { tickId = requestAnimationFrame(loop); } }
  function setPlaying(p) {
    playing = p; $('play').textContent = p ? '❚❚ 일시정지' : '▶ 재생'; $('play').setAttribute('aria-label', p ? '일시정지' : '재생');
    cancelAnimationFrame(tickId); if (p) { loop(); }
  }
  /* 이 글이 끝나는 자리에서 멈춥니다 (소리 파일에는 뒤의 글이 이어져 있으므로 정확히 끊어 줍니다) */
  function armEnd() {
    clearTimeout(endTimer); if (!playing) { return; }
    const rem = (T().end - (audio.currentTime || 0)) / (audio.playbackRate || 1);
    endTimer = setTimeout(checkEnd, Math.max(0, rem * 1000 - 40));
  }
  function checkEnd() { if (!playing) { return; } if ((audio.currentTime || 0) >= T().end - 0.06) { finishDoc(); } else { armEnd(); } }
  function finishDoc() {
    clearTimeout(endTimer); audio.pause(); setPlaying(false); pref('pos' + k, 0);
    try { audio.currentTime = T().start; } catch (e) {}
    const o = $('g' + last); if (o) { o.classList.remove('on'); } last = -1;
    $('cur').textContent = '0:00'; $('fill').style.width = '0%';
  }
  function savePos() { pref('pos' + k, localT()); }
  function play() { $('play').classList.remove('wait'); const pr = audio.play(); setPlaying(true); armEnd(); if (pr && pr.catch) { pr.catch(() => setPlaying(false)); } }
  function pause() { clearTimeout(endTimer); audio.pause(); setPlaying(false); savePos(); }
  function toggle() { if (playing) { pause(); } else { play(); } }
  function seek(t) { try { audio.currentTime = Math.max(T().start, Math.min(t, T().end)); } catch (e) {} armEnd(); paint(); }
  function jump(i) { if (i < 0 || i >= SEGS.length) { return; } lastUser = 0; seek(SEGS[i].s); mark(i, true); if (!playing) { play(); } }

  audio.addEventListener('timeupdate', () => {
    if (!playing) { paint(); } else if ((audio.currentTime || 0) >= T().end - 0.06) { finishDoc(); }
    if (playing && Date.now() - lastSave > 4000) { lastSave = Date.now(); savePos(); }
  });
  audio.addEventListener('ended', finishDoc);
  audio.addEventListener('error', () => { $('meta').textContent = '소리 파일을 불러오지 못했습니다. mp3 파일들이 이 페이지와 같은 폴더에 있는지 확인해 주세요.'; });

  /* 글 그리기와 글 바꾸기 */
  function render(nk) {
    if (playing) { pause(); }
    k = nk; const t = T(); SEGS = t.segs; last = -1; lastUser = 0;
    document.title = t.title + ' — ' + TITLE;
    $('ttl').textContent = t.title;
    let html = '', para = '';
    SEGS.forEach((g, i) => {
      const span = '<span class="seg" id="g' + i + '" data-i="' + i + '">' + esc(g.t) + '</span> ';
      if (g.h) { if (para) { html += '<p>' + para + '</p>'; para = ''; } html += '<h2 class="hd">' + span + '</h2>'; }
      else { para += span; if (g.p) { html += '<p>' + para + '</p>'; para = ''; } }
    });
    if (para) { html += '<p>' + para + '</p>'; }
    $('text').innerHTML = html;
    $('meta').textContent = '듣는 시간 약 ' + fmt(t.dur) + ' · 읽는 문장을 누르면 그 곳부터 들려요';
    $('tot').textContent = fmt(t.dur); $('cur').textContent = '0:00'; $('fill').style.width = '0%';
    if (curSrc !== t.audio) { curSrc = t.audio; audio.src = t.audio; applySpd(); }
    try { audio.currentTime = t.start; } catch (e) {}
    /* 앞 글·다음 글 */
    const pt = $('pt'), nt = $('nt');
    pt.style.display = k > 0 ? '' : 'none'; if (k > 0) { pt.title = '앞 글: ' + TRACKS[k - 1].title; }
    nt.style.display = k < N - 1 ? '' : 'none'; if (k < N - 1) { nt.title = '다음 글: ' + TRACKS[k + 1].title; }
    if (k < N - 1) { $('nvname').textContent = TRACKS[k + 1].title; $('nvgo').href = '#' + (k + 2); $('nvcard').style.display = 'block'; } else { $('nvcard').style.display = 'none'; }
    /* 이어 듣기 */
    const r = $('resume'); r.style.display = 'none';
    const pos = parseFloat(pref('pos' + k));
    if (pos > 10 && pos < (t.dur || 1e9) - 5) {
      r.style.display = 'block';
      r.innerHTML = '지난번 <b>' + fmt(pos) + '</b>까지 들으셨어요. <button type="button" id="rb">이어 듣기</button>';
      $('rb').onclick = () => { seek(t.start + pos); r.style.display = 'none'; play(); };
    }
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  function go(nk, autoplay) {
    if (nk < 0 || nk >= N) { return; }
    try { history.pushState(null, '', '#' + (nk + 1)); } catch (e) { try { location.hash = '#' + (nk + 1); } catch (x) {} }
    render(nk);
    if (autoplay) { play(); }
  }
  function hashK() { const m = /^#(\d+)/.exec(location.hash || ''); if (m) { const q = parseInt(m[1], 10) - 1; if (q >= 0 && q < N) { return q; } } return 0; }
  window.addEventListener('hashchange', () => { const q = hashK(); if (q !== k) { render(q); } });
  (function () { const tl = $('tolist'); if (LIST) { tl.href = LIST; tl.style.display = 'inline-block'; } })();

  /* 단추 */
  $('play').onclick = toggle;
  $('back').onclick = () => seek((audio.currentTime || 0) - 10);
  $('fwd').onclick = () => seek((audio.currentTime || 0) + 10);
  $('prev').onclick = () => { const i = idxAt(audio.currentTime || 0); const cur = SEGS[i]; jump((cur && (audio.currentTime - cur.s) > 2) ? i : Math.max(0, i - 1)); };
  $('next').onclick = () => jump(Math.min(SEGS.length - 1, idxAt(audio.currentTime || 0) + 1));
  $('pt').onclick = () => go(k - 1, false);
  $('nt').onclick = () => go(k + 1, true);
  $('nvgo').onclick = e => { e.preventDefault(); go(k + 1, true); };
  $('spd').onclick = () => { spd = (spd + 1) % SPEEDS.length; applySpd(); pref('spd', spd); armEnd(); };
  $('fsm').onclick = () => { fsi = Math.max(0, fsi - 1); applyFs(); pref('fs', fsi); };
  $('fbg').onclick = () => { fsi = Math.min(FS.length - 1, fsi + 1); applyFs(); pref('fs', fsi); };
  $('prog').onclick = e => { const r = $('prog').getBoundingClientRect(); seek(T().start + ((e.clientX - r.left) / r.width) * (T().dur || 0)); };
  $('text').addEventListener('click', e => { const s = e.target.closest ? e.target.closest('.seg') : null; if (s) { jump(+s.getAttribute('data-i')); } });
  document.addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'ArrowLeft') { seek((audio.currentTime || 0) - 10); }
    else if (e.code === 'ArrowRight') { seek((audio.currentTime || 0) + 10); }
  });
  window.addEventListener('pagehide', savePos);

  render(hashK());

  /* 전체 화면 (주소창 없이 글만 크게 보기). 지원하지 않는 기기에서는 단추를 숨깁니다 */
  (function () {
    const b = $('fs'), de = document.documentElement;
    const req = de.requestFullscreen || de.webkitRequestFullscreen;
    const ok = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
    if (!ok) { b.style.display = 'none'; return; }
    const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
    const upd = () => { b.textContent = isFs() ? '⛶ 나가기' : '⛶ 전체'; b.setAttribute('aria-label', isFs() ? '전체 화면 나가기' : '전체 화면'); };
    b.onclick = () => { try { if (isFs()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } else { req.call(de); } } catch (e) {} };
    document.addEventListener('fullscreenchange', upd); document.addEventListener('webkitfullscreenchange', upd); upd();
    document.addEventListener('keydown', e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) { return; }
      if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); b.onclick(); }
    });
  })();
  window.__player = { jump, go, seek, toggle, audio, TRACKS, state: () => ({ k, playing, curSrc }) };
})();
</script>
</body>
</html>
